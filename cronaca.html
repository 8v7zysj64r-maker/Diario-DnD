<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cronaca della campagna</title>
<style>
:root{color-scheme:dark;--bg:#120d0a;--panel:#1d1510;--panel2:#281c14;--ink:#efe4cf;--mute:#b3a58c;--line:#4a3626;--brass:#d9b25a;--red:#b9473a}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% -10%,#3a2618 0,var(--bg) 60%) fixed;color:var(--ink);font:18px/1.55 Georgia,"Liberation Serif",serif}
header{max-width:1100px;margin:0 auto;padding:22px 16px 6px}
h1{margin:0;font-size:2rem;color:var(--brass);letter-spacing:.02em}
.sub{color:var(--mute);font-size:.95rem;font-family:system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:8px 16px 60px;display:grid;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.chip,.btn{font:inherit;font-family:system-ui,sans-serif;font-size:.95rem;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer}
.btn{border-radius:8px}
.chip[aria-pressed=true],.btn.gold{background:var(--brass);color:#1d1405;border-color:var(--brass);font-weight:700}
.chip:hover,.btn:hover{border-color:var(--brass)}
.cols{display:grid;grid-template-columns:3fr 2fr;gap:16px;align-items:start}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
h2{margin:0 0 4px;font-size:1.35rem;color:var(--brass)}
h3{margin:0 0 8px;font-size:1.05rem;color:var(--brass);font-family:system-ui,sans-serif;text-transform:uppercase;letter-spacing:.06em}
.story p{margin:0 0 14px}
.story p:first-of-type::first-letter{font-size:2.6em;float:left;line-height:.9;padding:4px 8px 0 0;color:var(--red)}
.bozza{font-family:system-ui,sans-serif;font-size:.85rem;color:var(--mute);border:1px dashed var(--line);border-radius:8px;padding:6px 10px;margin-bottom:12px}
.mem{border-left:3px solid var(--brass);padding:4px 0 4px 10px;margin:0 0 12px}
.mem b{font-family:system-ui,sans-serif;font-size:.9rem}
.mem .t{color:var(--mute);font-size:.78rem;font-family:system-ui,sans-serif}
.mem p{margin:2px 0 0;white-space:pre-wrap;word-break:break-word}
.vuoto{color:var(--mute);font-style:italic}
label{display:grid;gap:4px;font-family:system-ui,sans-serif;font-size:.9rem;color:var(--mute)}
input,textarea,select{width:100%;background:#120d0a;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px;font:inherit;font-size:1rem}
textarea{min-height:96px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.st{font-family:system-ui,sans-serif;font-size:.85rem;color:var(--mute)}.st.ok{color:#8fd1a4}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.me{font-family:system-ui,sans-serif;font-size:.9rem;color:var(--mute)}
</style></head><body>
<header><h1>Cronaca della campagna</h1><div class="sub">La storia fin qui, raccontata dal master. Aggiungi i tuoi ricordi: compaiono accanto al racconto, firmati con il tuo personaggio.</div><div class="me" id="me"></div></header>
<main id="app"></main>
<script>
"use strict";
/* ====== IL RACCONTO (aggiornato da Claude con quello che racconta il master) ====== */
const STORY=[
 {id:"s1",title:"Sessione 1 · La rissa del Leviatano Spiaggiato",bozza:true,paras:[
  "Nella notte dell'equinozio di primavera, mentre la nebbia saliva dai moli di Neverwinter, sei avventurieri risposero all'invito di un vecchio amico: Dre, Orchideo, Myrith, Rowen, Freya e Vesna. La lettera di Gundren Cercapietre era stata chiara: mezzanotte, alla Taverna del Leviatano Spiaggiato, e da bere offriva lui.",
  "Nel locale, semplice e un po' diroccato, Gundren e il fidato Sildar presentarono il primo incarico: scortare un carro di merci fino a Phandalin. Il vero lavoro, quello importante, sarebbe cominciato soltanto laggiù, e per ora non ne disse di più.",
  "Ma ai tavoli vicini sedevano dei marinai, e non parevano felici di tanta compagnia. Orchideo mormorò: «avremmo potuto sfidarli in una gara di bevute». Sottovoce, sì. Ma non abbastanza.",
  "Il capo dei marinai si avvicinò, faccia a faccia con Orchideo. Rowen, con il suo atteggiamento altezzoso, lo provocò ancora, e il capo le lanciò un boccale: la rissa ebbe inizio.",
  "Orchideo mise a segno un pugno poderoso. Dre balzò dal tavolo e atterrò su un marinaio. Vesna tirò un 1 e cadde lunga distesa. Myrith colpì un marinaio con la Risata incontenibile di Tasha, Rowen trattenne a stento la voglia di dar fuoco alla taverna e Freya aiutò Dre con grande agilità.",
  "Più tardi Vesna spezzò la gamba di un tavolo per usarla come arma, rompendo tutto il tavolo e ritrovandosi fradicia di birra. Dre chiuse in bellezza con un calcio acrobatico che spedì un marinaio fuori dalla porta.",
  "Il povero tavernaio rimproverò a lungo il gruppo, finché Dre lo intimidì per farsi dire ciò che sapeva. Gli altri ripulirono e consegnarono i marinai svenuti alla guardia cittadina fuori dalla taverna. Il giorno dopo, il gruppo partì con il carro verso Phandalin."
 ]}
];
/* Ricordi dei giocatori già inseriti nella pagina: {i:id, s:"s1", w:"Dre", x:"testo", t:millisecondi} */
const BAKED=[];
const HERO=["Dre","Orchideo","Myrith","Rowen","Freya","Vesna","Master"];
const $=s=>document.querySelector(s);
const el=(t,p,...k)=>{const e=document.createElement(t);for(const[a,v]of Object.entries(p||{})){if(a==="class")e.className=v;else if(a.startsWith("on"))e.addEventListener(a.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(a,v)}for(const c of k.flat())if(c!=null)e.append(c);return e};
const LS={g(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const BASE=()=>{try{return localStorage.getItem("tavolo-ntfy")||"https://ntfy.sh"}catch(e){return"https://ntfy.sh"}};
const QS=new URLSearchParams(location.search);
let CODE=QS.get("c")||LS.g("cr-code","");if(QS.get("c"))LS.s("cr-code",CODE);
let ME=LS.g("cr-me","");let MEM=LS.g("cr-mem",{});let cur=LS.g("cr-cur",STORY[0].id);
for(const b of BAKED)MEM[b.i]=Object.assign({sent:1},b);
const save=()=>{LS.s("cr-mem",MEM)};
const topic=()=>BASE()+"/dnd-cr-"+CODE;
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const hue=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return h};
const fmt=t=>{const d=new Date(t);return d.toLocaleDateString("it-IT",{day:"numeric",month:"short"})+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
/* ---- rete ---- */
let busy=false,net="";
async function flush(){if(!CODE||busy)return;busy=true;try{for(const m of Object.values(MEM)){if(!m.sent&&m.own){const r=await fetch(topic(),{method:"POST",body:JSON.stringify({i:m.i,s:m.s,w:m.w,x:m.x})});if(!r.ok)throw 0;m.sent=1;save()}}net="ok"}catch(e){net="off"}busy=false;draw()}
let es=null;
function listen(){
  if(!CODE||typeof EventSource==="undefined")return;
  try{es=new EventSource(topic()+"/sse?since=12h")}catch(e){return}
  es.onopen=()=>{net="ok";stat()};es.onerror=()=>{net="off";stat()};
  es.onmessage=ev=>{try{const d=JSON.parse(ev.data);if(d.event!=="message"||!d.message)return;const m=JSON.parse(d.message);if(!m||!m.i||!m.x||!m.s)return;if(MEM[m.i]){MEM[m.i].sent=1;save();return}MEM[m.i]={i:m.i,s:String(m.s),w:String(m.w||"?").slice(0,30),x:String(m.x).slice(0,3000),t:d.time*1000,sent:1};save();draw()}catch(e){}}
}
function stat(){const s=$("#net");if(!s)return;s.className="st"+(net==="ok"?" ok":"");s.textContent=net==="ok"?"✓ Collegato: i ricordi arrivano a tutti":net==="off"?"Senza rete: i tuoi ricordi partono appena torna":""}
/* ---- testo da inviare a Claude ---- */
function allText(){let o="RICORDI DEI GIOCATORI\n";for(const s of STORY){const L=Object.values(MEM).filter(m=>m.s===s.id).sort((a,b)=>a.t-b.t);o+="\n== "+s.title+" ==\n";if(!L.length)o+="(nessun ricordo)\n";for(const m of L)o+="- "+m.w+": "+m.x.replace(/\n/g,"\n  ")+"\n"}return o}
/* ---- vista ---- */
function draw(){
  const app=$("#app");app.replaceChildren();
  $("#me").textContent=ME?"Scrivi come: "+ME+" · ":"";
  if(ME){const c=el("a",{href:"#",onclick:e=>{e.preventDefault();ME="";LS.s("cr-me","");draw()}},"cambia");$("#me").append(c)}
  if(!CODE){app.append(setupCard());return}
  if(!ME){app.append(whoCard());return}
  const tabs=el("div",{class:"tabs",role:"tablist"},STORY.map(s=>el("button",{class:"chip",type:"button",role:"tab","aria-pressed":String(s.id===cur),onclick:()=>{cur=s.id;LS.s("cr-cur",cur);draw()}},s.title.split(" · ")[0])));
  const S=STORY.find(x=>x.id===cur)||STORY[0];
  const story=el("div",{class:"card story"},el("h2",{},S.title),S.bozza?el("div",{class:"bozza"},"Bozza scritta da Claude dagli appunti del master: Mario la correggerà e ci aggiungerà i dettagli."):null,S.paras.map(p=>el("p",{},p)));
  const L=Object.values(MEM).filter(m=>m.s===S.id).sort((a,b)=>a.t-b.t);
  const mem=el("div",{class:"card"},el("h3",{},"Ricordi dei giocatori"),
    L.length?L.map(m=>el("div",{class:"mem",style:"border-color:hsl("+hue(m.w)+" 55% 60%)"},el("b",{style:"color:hsl("+hue(m.w)+" 60% 68%)"},m.w),el("span",{class:"t"}," · "+fmt(m.t)+(m.own&&!m.sent?" · ⏳ in attesa":"")),el("p",{},m.x))):el("div",{class:"vuoto"},"Ancora nessun ricordo per questa sessione. Aggiungi il tuo qui sotto."));
  const ta=el("textarea",{id:"x",placeholder:"Una scena che ricordi, cosa pensava il tuo personaggio, un dettaglio che il master non ha detto…","aria-label":"Il tuo ricordo"});
  const add=()=>{const x=ta.value.trim();if(!x){ta.focus();return}const i=rid();MEM[i]={i,s:S.id,w:ME,x,t:Date.now(),own:1,sent:0};save();ta.value="";draw();flush()};
  ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();add()}});
  const form=el("div",{class:"card"},el("h3",{},"Aggiungi un ricordo come "+ME),el("label",{},"Il tuo ricordo",ta),el("div",{class:"row",style:"margin-top:8px"},el("button",{class:"btn gold",type:"button",onclick:add},"Aggiungi (Ctrl+Invio)"),el("span",{id:"net",class:"st"})),el("div",{class:"st",style:"margin-top:6px"},"Una volta inviato un ricordo non si può più cancellare da qui: chiedi a Mario se vuoi toglierlo."));
  const tools=el("div",{class:"row"},el("button",{class:"btn",type:"button",onclick:async e=>{try{await navigator.clipboard.writeText(allText());e.target.textContent="Copiato ✓"}catch(x){const t=el("textarea");t.value=allText();document.body.append(t);t.select();document.execCommand("copy");t.remove();e.target.textContent="Copiato ✓"}setTimeout(()=>e.target.textContent="Copia tutti i ricordi",1800)}},"Copia tutti i ricordi"),el("button",{class:"btn",type:"button",onclick:()=>{const a=el("a",{href:URL.createObjectURL(new Blob([allText()],{type:"text/plain;charset=utf-8"})),download:"ricordi-giocatori.txt"});a.click()}},"Scarica .txt"),el("button",{class:"btn",type:"button",onclick:async e=>{const l=location.origin+location.pathname+"?c="+CODE;try{await navigator.clipboard.writeText(l);e.target.textContent="Link copiato ✓"}catch(x){prompt("Copia il link:",l)}setTimeout(()=>e.target.textContent="Copia il link per gli amici",1800)}},"Copia il link per gli amici"));
  app.append(tabs,el("div",{class:"cols"},story,el("div",{style:"display:grid;gap:16px"},mem,form)),tools);
  stat();
}
function setupCard(){
  const A="abcdefghjkmnpqrstuvwxyz23456789",inp=el("input",{placeholder:"Codice del gruppo","aria-label":"Codice del gruppo"});
  const go=()=>{const c=inp.value.trim().toLowerCase().replace(/[^a-z0-9]/g,"");if(c.length<6){inp.focus();return}CODE=c;LS.s("cr-code",c);start()};
  return el("div",{class:"card"},el("h2",{},"Prima di cominciare"),el("p",{},"Questa pagina si collega al gruppo con un codice segreto. Di solito arrivi qui da un link che Mario ti ha mandato e il codice c'è già."),
    el("label",{},"Hai un codice? Scrivilo qui",inp),el("div",{class:"row",style:"margin-top:8px"},el("button",{class:"btn gold",type:"button",onclick:go},"Entra")),
    el("p",{class:"st"},"Solo per il master: crea un nuovo codice, poi copia il link e mandalo agli amici."),
    el("button",{class:"btn",type:"button",onclick:()=>{CODE=Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>A[b%A.length]).join("");LS.s("cr-code",CODE);start()}},"Crea un nuovo codice del gruppo"));
}
function whoCard(){
  const other=el("input",{placeholder:"Altro nome","aria-label":"Altro nome"});
  const pick=n=>{ME=n;LS.s("cr-me",n);draw()};
  return el("div",{class:"card"},el("h2",{},"Chi sei?"),el("p",{},"I tuoi ricordi saranno firmati con il nome del tuo personaggio."),
    el("div",{class:"tabs"},HERO.map(n=>el("button",{class:"chip",type:"button",onclick:()=>pick(n)},n))),
    el("div",{class:"row",style:"margin-top:10px"},other,el("button",{class:"btn",type:"button",onclick:()=>{const v=other.value.trim();if(v)pick(v.slice(0,30))}},"Usa questo nome")));
}
function start(){if(es){es.close();es=null}draw();listen();flush()}
start();setInterval(flush,10000);
</script></body></html>
