<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fucina delle mappe</title>
<style>
:root{--bg:#0c1111;--panel:#141c1c;--panel2:#1b2626;--line:#2c3a3a;--ink:#e8e4d8;--mute:#9aa59f;--brass:#d4b25a;--acc:#c2503a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0}
button,select,input{font:inherit;color:inherit}
body{display:flex;flex-direction:column;overflow:hidden}
header{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:1.25rem;color:var(--brass);margin-right:10px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--brass)}
.btn[aria-pressed=true],.btn.gold{background:var(--brass);color:#1a1405;border-color:var(--brass);font-weight:700}
.btn.sm{padding:4px 8px;font-size:.88rem}
.sp{flex:1}
main{flex:1;display:flex;min-height:0}
#wrap{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;padding:10px;background:#070a0a;position:relative;overflow:hidden}
#bb{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;display:none}
#box{position:relative;box-shadow:0 0 0 1px #000,0 8px 30px rgba(0,0,0,.6);touch-action:none;line-height:0}
#gl,#ov{position:absolute;left:0;top:0;width:100%;height:100%}
#ov{cursor:crosshair}
#side{width:350px;flex:none;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;border-bottom:1px solid var(--line)}
#tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:10px 4px;cursor:pointer;color:var(--mute)}
#tabs button[aria-selected=true]{color:var(--brass);border-bottom-color:var(--brass);font-weight:700}
#pane{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.grp{display:flex;flex-direction:column;gap:6px}
.grp>h3{font-size:.95rem;color:var(--brass)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row label{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:.92rem}
.lab{display:flex;flex-direction:column;gap:2px;font-size:.88rem;color:var(--mute)}
.lab span b{color:var(--ink);font-weight:600}
input[type=range]{width:100%;accent-color:var(--brass)}
input[type=text],input[type=number],select{background:#0c1414;border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-width:0}
.mats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mat{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--panel2);border:2px solid var(--line);border-radius:9px;padding:6px 4px;cursor:pointer;font-size:.82rem}
.mat[aria-pressed=true]{border-color:var(--brass)}
.mat i{width:100%;height:26px;border-radius:5px;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.5)}
.objs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.obj{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--panel2);border:2px solid var(--line);border-radius:9px;padding:4px;cursor:pointer;font-size:.78rem;text-align:center}
.obj canvas{width:64px;height:64px}
.obj[aria-pressed=true]{border-color:var(--brass)}
.hint{color:var(--mute);font-size:.86rem}
.msg{color:var(--brass);font-size:.9rem}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#101818;border:1px solid var(--brass);border-radius:10px;padding:8px 14px;z-index:50;display:none}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:40;padding:14px}
#modal[hidden]{display:none}
.mbox{background:var(--panel);border:1px solid var(--brass);border-radius:14px;padding:16px;max-width:640px;width:100%;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:8px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px}
.item b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.viewer header,body.viewer #side{display:none}
body.viewer #wrap{padding:0;background:#000}
body.viewer #box{box-shadow:none}
@media(max-width:900px){main{flex-direction:column}#side{width:100%;height:46vh;border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <h1>Fucina delle mappe</h1>
  <button class="btn" id="b-new">Nuova</button>
  <button class="btn" id="b-save">Salva</button>
  <button class="btn" id="b-load">Le mie mappe</button>
  <span class="sp"></span>
  <button class="btn" id="b-png">Scarica immagine</button>
  <button class="btn gold" id="b-tav">Manda al Tavolo</button>
  <button class="btn" id="b-help">Guida</button>
</header>
<main>
  <div id="wrap"><div id="box"><canvas id="gl"></canvas><canvas id="ov"></canvas></div><canvas id="bb"></canvas></div>
  <aside id="side"><div id="tabs" role="tablist"></div><div id="pane"></div></aside>
</main>
<div id="toast"></div>
<div id="modal" hidden></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const VIEWER=/[?&]viewer=1/.test(location.search);
if(VIEWER)document.body.classList.add("viewer");
const PROP={value:1,checked:1,textContent:1,disabled:1,selected:1};
function h(t,a={},...c){const e=document.createElement(t);for(const[k,v]of Object.entries(a||{})){if(k==="class")e.className=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(PROP[k])e[k]=v;else if(v===true)e.setAttribute(k,"");else if(v!==false&&v!=null)e.setAttribute(k,v)}for(const x of c.flat(9))if(x!=null&&x!==false)e.append(x.nodeType?x:document.createTextNode(String(x)));return e}
let toastT=0;function toast(m,ms=2600){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toastT);toastT=setTimeout(()=>t.style.display="none",ms)}
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
function rngOf(seed){let s=0;const str=String(seed);for(let i=0;i<str.length;i++)s=(Math.imul(s,31)+str.charCodeAt(i))|0;s=s>>>0||1;return()=>{s=(s+0x6D2B79F5)|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- modello ---------- */
const CELL=40,F=4,FP=CELL/F; // 1 pixel di campo = 10 px mappa
const SIZES={s:[24,18,"Piccola 24×18"],m:[32,24,"Media 32×24"],l:[48,32,"Grande 48×32"]};
const DEF_SET={ang:35,spd:1,amb:1,vig:.5,glow:1,part:1,rough:.8,grid:false,gridc:"#ffffff",gridi:.22,gridw:1,fog:0,tint:[1,1,1],fogc:[.55,.55,.62],theme:"neutra",autol:1,relief:.6,motes:"none"};
let S=null;
function newMap(gw=32,gh=24){const fw=gw*F,fh=gh*F;return{id:uid(),name:"Mappa senza nome",seed:"",gw,gh,fw,fh,terr:new Uint8Array(fw*fh*4),liq:new Uint8Array(fw*fh*4),dec:new Uint8Array(fw*fh*4),objs:[],lights:[],bg:null,ftex:null,wtex:null,gtex:null,stex:null,ntex:null,cust:[],set:Object.assign({},DEF_SET)}}
const MW=()=>S.gw*CELL,MH=()=>S.gh*CELL;
const Z4=[0,0,0,0];
const MATS={
  wall:{n:"Roccia",t:[255,0,0,0],l:Z4,c:"#3a342f"},
  stone:{n:"Pietra",t:Z4,l:Z4,c:"#77706a"},
  grass:{n:"Erba",t:[0,255,0,0],l:Z4,c:"#4a7a2c"},
  sand:{n:"Sabbia",t:[0,0,255,0],l:Z4,c:"#b8a070"},
  snow:{n:"Neve",t:[0,0,0,255],l:Z4,c:"#dfe8f2"},
  lava:{n:"Lava",l:[255,0,0,0],c:"linear-gradient(120deg,#5a1004,#ff6a10 45%,#ffd060)"},
  water:{n:"Acqua",l:[0,255,0,0],c:"linear-gradient(120deg,#08304f,#3a98b0)"},
  slime:{n:"Melma",l:[0,0,255,0],c:"linear-gradient(120deg,#1c4a0c,#7ac030)"},
  abyss:{n:"Abisso",l:[0,0,0,255],c:"radial-gradient(#000,#10131e)"},
  roots:{n:"Radici luminose",d:0,c:"linear-gradient(120deg,#1c2a1a,#18c9a8)"},
  runes:{n:"Lastre con rune",d:1,c:"linear-gradient(120deg,#3a3850,#8a5cff)"},
  mud:{n:"Fango e ossa",d:2,c:"linear-gradient(120deg,#2a1a10,#d8cfae)"},
  crys:{n:"Cristalli",d:3,c:"linear-gradient(120deg,#33d0ff,#c04cff)"},
  clean:{n:"Pulisci decori",d:-1,c:"repeating-linear-gradient(45deg,#2a3535 0 6px,#1b2626 6px 12px)"},
  dry:{n:"Asciuga",l:Z4,keep:true,c:"repeating-linear-gradient(45deg,#2a3535 0 6px,#1b2626 6px 12px)"}
};
const FLOORS=["stone","grass","sand","snow"],LIQS=["lava","water","slime","abyss"];
function applyMat(m,x,y){
  const i=(y*S.fw+x)*4,M=MATS[m];
  if(M.d!==undefined){if(M.d<0){for(let k=0;k<4;k++)S.dec[i+k]=0}else S.dec[i+M.d]=255;return}
  if(!M.t||m==="wall")for(let k=0;k<4;k++)S.dec[i+k]=0;
  if(M.t){for(let k=0;k<4;k++)S.terr[i+k]=M.t[k];for(let k=0;k<4;k++)S.liq[i+k]=0}
  else{ // liquido o asciuga: toglie la roccia, tiene il tipo di pavimento
    S.terr[i]=0;for(let k=0;k<4;k++)S.liq[i+k]=M.l[k];
  }
}
function fieldFill(m){for(let y=0;y<S.fh;y++)for(let x=0;x<S.fw;x++)applyMat(m,x,y)}
function paintWhere(m,test){let n=0;for(let y=0;y<S.fh;y++)for(let x=0;x<S.fw;x++){if(test((x+.5)*FP,(y+.5)*FP)){applyMat(m,x,y);n++}}return n}
function paintCircle(m,cx,cy,r){
  const x0=Math.max(0,Math.floor((cx-r)/FP)),x1=Math.min(S.fw-1,Math.ceil((cx+r)/FP)),y0=Math.max(0,Math.floor((cy-r)/FP)),y1=Math.min(S.fh-1,Math.ceil((cy+r)/FP)),r2=r*r;
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const dx=(x+.5)*FP-cx,dy=(y+.5)*FP-cy;if(dx*dx+dy*dy<=r2)applyMat(m,x,y)}
}
function paintLine(m,a,b,r){const d=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.ceil(d/Math.max(4,r*.35)));for(let i=0;i<=n;i++)paintCircle(m,a[0]+(b[0]-a[0])*i/n,a[1]+(b[1]-a[1])*i/n,r)}
function inPoly(q,x,y){let c=false;for(let i=0,j=q.length-1;i<q.length;j=i++){const a=q[i],b=q[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])c=!c}return c}

/* ---------- salvataggio compatto (RLE + base64) ---------- */
function rle(u8){const o=[];let i=0;while(i<u8.length){const v=u8[i];let n=1;while(i+n<u8.length&&u8[i+n]===v&&n<255)n++;o.push(n,v);i+=n}return o}
function b64(bytes){let s="";const ch=0x8000;for(let i=0;i<bytes.length;i+=ch)s+=String.fromCharCode.apply(null,bytes.subarray?bytes.subarray(i,i+ch):bytes.slice(i,i+ch));return btoa(s)}
const enc=u8=>b64(Uint8Array.from(rle(u8)));
function dec(s,len){const b=atob(s),out=new Uint8Array(len);let p=0;for(let i=0;i+1<b.length;i+=2){const n=b.charCodeAt(i),v=b.charCodeAt(i+1);out.fill(v,p,p+n);p+=n}return out}
function serialize(m=S){return{v:1,id:m.id,name:m.name,seed:m.seed,gw:m.gw,gh:m.gh,terr:enc(m.terr),liq:enc(m.liq),dec:enc(m.dec),objs:m.objs,lights:m.lights||[],bg:m.bg||null,ftex:m.ftex||null,cust:m.cust||[],wtex:m.wtex||null,gtex:m.gtex||null,stex:m.stex||null,ntex:m.ntex||null,set:m.set}}
function deserialize(d){const m=newMap(d.gw,d.gh);m.id=d.id||uid();m.name=d.name||"Mappa";m.seed=d.seed||"";m.terr=dec(d.terr,m.fw*m.fh*4);m.liq=dec(d.liq,m.fw*m.fh*4);if(d.dec)m.dec=dec(d.dec,m.fw*m.fh*4);m.objs=(d.objs||[]).map(o=>Object.assign({},o));m.lights=(d.lights||[]).map(o=>Object.assign({},o));m.bg=d.bg||null;m.ftex=d.ftex||null;m.cust=d.cust||[];m.wtex=d.wtex||null;m.gtex=d.gtex||null;m.stex=d.stex||null;m.ntex=d.ntex||null;m.set=Object.assign({},DEF_SET,d.set||{});return m}

/* ---------- generatori ---------- */
function floodKeep(g,w,hh){ // tiene la regione libera piu' grande (g: 1=roccia)
  const lab=new Int32Array(w*hh),sizes=[0];let n=0;
  for(let s=0;s<w*hh;s++){if(g[s]||lab[s])continue;n++;let c=0;const st=[s];lab[s]=n;while(st.length){const p=st.pop();c++;const x=p%w,y=(p/w)|0;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=w||ny>=hh)continue;const q=ny*w+nx;if(!g[q]&&!lab[q]){lab[q]=n;st.push(q)}}}sizes[n]=c}
  let best=0;for(let k=1;k<=n;k++)if(sizes[k]>(sizes[best]||0))best=k;
  for(let p=0;p<w*hh;p++)if(!g[p]&&lab[p]!==best)g[p]=1;
  return sizes[best]||0;
}
function blobShape(rng){const k=2+((rng()*3)|0),ph=[],am=[];for(let i=0;i<k;i++){ph.push(rng()*6.28);am.push(.15+rng()*.25)}return(a)=>{let v=1;for(let i=0;i<k;i++)v+=am[i]*Math.sin(a*(i+2)+ph[i]);return v}}
const isWallF=(x,y)=>S.terr[(y*S.fw+x)*4]>127;
const hasLiqF=(x,y)=>{const i=(y*S.fw+x)*4;return S.liq[i]>127||S.liq[i+1]>127||S.liq[i+2]>127||S.liq[i+3]>127};
function floorSpot(rng,margin,tries=80,avoid=[]){ // posizione libera (px mappa) con spazio intorno
  const m=margin|0;
  for(let t=0;t<tries;t++){
    const x=(m+rng()*(S.fw-2*m))|0,y=(m+rng()*(S.fh-2*m))|0;let ok=true;
    for(let dy=-m;dy<=m&&ok;dy++)for(let dx=-m;dx<=m;dx++){if(isWallF(x+dx,y+dy)||hasLiqF(x+dx,y+dy)){ok=false;break}}
    if(!ok)continue;const px=(x+.5)*FP,py=(y+.5)*FP;
    if(avoid.some(a=>Math.hypot(a.x-px,a.y-py)<(a.d||CELL*.9)))continue;
    return[px,py];
  }
  return null;
}
function carveRiver(rng,liq,width,meander,vertical){
  const W=S.fw,H=S.fh,A=vertical?W:H,L=vertical?H:W;
  let c=A*(.25+.5*rng()),ph=rng()*6.28,fr=.05+rng()*.05,ph2=rng()*6.28;
  const wd=width*(.75+.5*rng());
  for(let l=0;l<L;l++){
    const off=Math.sin(l*fr+ph)*A*.09*meander+Math.sin(l*fr*2.3+ph2)*A*.04*meander;
    const cc=c+off,w=Math.max(1.6,wd*(.9+.22*Math.sin(l*.21+ph2)));
    for(let a=Math.floor(cc-w-1);a<=Math.ceil(cc+w+1);a++){
      const x=vertical?a:l,y=vertical?l:a;if(x<1||y<1||x>=W-1||y>=H-1)continue;
      if(Math.abs(a-cc)<=w){const i=(y*W+x)*4;S.terr[i]=0;for(let k=0;k<4;k++)S.liq[i+k]=0;S.liq[i+LIQS.indexOf(liq)]=255}
    }
  }
}
function lakes(rng,liq,n,rmin,rmax,onlyFloor=true){
  for(let q=0;q<n;q++){
    const p=floorSpot(rng,3,120);if(!p)continue;const r=(rmin+rng()*(rmax-rmin))*CELL,sh=blobShape(rng);
    const x0=Math.max(0,Math.floor((p[0]-r*1.6)/FP)),x1=Math.min(S.fw-1,Math.ceil((p[0]+r*1.6)/FP)),y0=Math.max(0,Math.floor((p[1]-r*1.6)/FP)),y1=Math.min(S.fh-1,Math.ceil((p[1]+r*1.6)/FP));
    for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
      const dx=(x+.5)*FP-p[0],dy=(y+.5)*FP-p[1],a=Math.atan2(dy,dx);
      if(Math.hypot(dx,dy)<r*sh(a)){const i=(y*S.fw+x)*4;if(onlyFloor&&S.terr[i]>127)continue;for(let k=0;k<4;k++)S.liq[i+k]=0;S.liq[i+LIQS.indexOf(liq)]=255}
    }
  }
}
function setFloor(kind){const M=MATS[kind].t;for(let i=0;i<S.fw*S.fh;i++){if(S.terr[i*4]>127)continue;for(let k=1;k<4;k++)S.terr[i*4+k]=M[k]}}
function beach(){ // sabbia intorno all'acqua sull'erba
  const W=S.fw,H=S.fh,mark=new Uint8Array(W*H);
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){if(S.liq[(y*W+x)*4+1]>127){for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const i=((y+dy)*W+x+dx)*4;if(S.terr[i]<128&&S.liq[i+1]<128)mark[(y+dy)*W+x+dx]=1}}}
  for(let p=0;p<W*H;p++)if(mark[p]){const i=p*4;S.terr[i+1]=0;S.terr[i+2]=255;S.terr[i+3]=0}
}
function genCave(o,rng){
  const cw=S.fw>>1,ch=S.fh>>1;let g,free=0;
  for(let attempt=0;attempt<6;attempt++){
    const dens=o.walls-attempt*.012;
    g=new Uint8Array(cw*ch);for(let i=0;i<g.length;i++)g[i]=rng()<dens?1:0;
    for(let it=0;it<5;it++){const n=new Uint8Array(g.length);for(let y=0;y<ch;y++)for(let x=0;x<cw;x++){let c=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const xx=x+dx,yy=y+dy;c+=(xx<0||yy<0||xx>=cw||yy>=ch)?1:g[yy*cw+xx]}n[y*cw+x]=c>=5?1:0}g=n}
    for(let x=0;x<cw;x++){g[x]=1;g[(ch-1)*cw+x]=1}for(let y=0;y<ch;y++){g[y*cw]=1;g[y*cw+cw-1]=1}
    free=floodKeep(g,cw,ch);if(free>cw*ch*.3)break;
  }
  for(let y=0;y<S.fh;y++)for(let x=0;x<S.fw;x++)if(g[(y>>1)*cw+(x>>1)])S.terr[(y*S.fw+x)*4]=255;
  setFloor(o.floor);
  if(o.liq!=="none"&&o.amount>0){
    if(o.shape!=="lakes")carveRiver(rng,o.liq,2+o.amount*3,1,rng()<.5);
    if(o.shape!=="river")lakes(rng,o.liq,Math.round(1+o.amount*5),.9,1.4+o.amount*1.6);
  }
}
function genOpen(o,rng){
  const fk=o.floor==="stone"?"grass":o.floor;setFloor(fk);
  const sc=.06+rng()*.03,ox=rng()*100,oy=rng()*100;
  const vnoise=(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),fx=x-xi,fy=y-yi,hh=(a,b)=>{const t=Math.sin(a*127.1+b*311.7+ox)*43758.5453;return t-Math.floor(t)},s=(t)=>t*t*(3-2*t);return hh(xi,yi)*(1-s(fx))*(1-s(fy))+hh(xi+1,yi)*s(fx)*(1-s(fy))+hh(xi,yi+1)*(1-s(fx))*s(fy)+hh(xi+1,yi+1)*s(fx)*s(fy)};
  const thr=1-o.walls;
  for(let y=0;y<S.fh;y++)for(let x=0;x<S.fw;x++){const v=vnoise(x*sc*2+oy,y*sc*2)*.7+vnoise(x*sc*5,y*sc*5+oy)*.3;if(v>thr)S.terr[(y*S.fw+x)*4]=255}

  if(!S.set.part||!lavaPts.length){parts.length=0;return}
  const want=Math.min(70,Math.round(lavaPts.length*.06)+10);
  while(parts.length<want){const p=lavaPts[(Math.random()*lavaPts.length)|0];parts.push({x:p[0]+(Math.random()-.5)*FP,y:p[1],vy:-(14+Math.random()*30),life:Math.random()*2.5,max:2+Math.random()*2.5,ph:Math.random()*6.28,s:.7+Math.random()*1.6})}
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.life+=dt;q.y+=q.vy*dt;q.x+=Math.sin(q.ph+q.life*2)*10*dt;if(q.life>q.max){const p=lavaPts[(Math.random()*lavaPts.length)|0];q.x=p[0]+(Math.random()-.5)*FP;q.y=p[1];q.life=0;q.max=2+Math.random()*2.5;q.vy=-(14+Math.random()*30)}}
}
function drawMotes(c,t){
  const kind=S.set.motes,N=kind==="snow"?90:kind==="dust"?70:50,W=MW(),Hh=MH();
  c.save();c.globalCompositeOperation=(kind==="snow"||kind==="dust")?"source-over":"lighter";
  for(let i=0;i<N;i++){
    const a=hashN(i*7.13+1),b=hashN(i*3.71+5),r=hashN(i*5.17+9),ph=r*40;
    let x,y,rad,al,col;
    if(kind==="snow"){x=((a*W+Math.sin(t*.6+ph)*22+t*10)%W+W)%W;y=((b*Hh+t*(26+r*30))%Hh+Hh)%Hh;rad=1.4+r*2.2;al=.55+.4*r;col="255,255,255"}
    else if(kind==="dust"){x=((a*W+Math.sin(t*.25+ph)*40+t*8)%W+W)%W;y=((b*Hh+Math.cos(t*.2+ph)*26-t*3)%Hh+Hh)%Hh;rad=.9+r*1.6;al=.12+.2*r*(.6+.4*Math.sin(t+ph));col="255,236,200"}
    else if(kind==="fireflies"){x=a*W+Math.sin(t*.5+ph)*46+Math.sin(t*1.3+ph*2)*14;y=b*Hh+Math.cos(t*.4+ph*1.3)*38;rad=2.2+r*1.6;al=Math.max(0,Math.sin(t*1.5+ph))**3*.95;col="190,255,110"}
    else if(kind==="spores"){x=a*W+Math.sin(t*.4+ph)*30;y=((b*Hh-t*(10+r*14))%Hh+Hh)%Hh;rad=1.6+r*2.4;al=.35+.45*Math.sin(t*1.1+ph)**2;col=r>.5?"90,255,230":"190,140,255"}
    else{x=((a*W+Math.sin(t+ph)*14)%W+W)%W;y=((b*Hh-t*(20+r*40))%Hh+Hh)%Hh;rad=1.2+r*1.8;al=(1-((y/Hh)))*.9;col=r>.5?"255,170,60":"255,100,30"} // brace
    const g=c.createRadialGradient(x,y,0,x,y,rad*4);g.addColorStop(0,"rgba("+col+","+al.toFixed(3)+")");g.addColorStop(.25,"rgba("+col+","+(al*.5).toFixed(3)+")");g.addColorStop(1,"rgba("+col+",0)");
    c.fillStyle=g;c.beginPath();c.arc(x,y,rad*4,0,6.283);c.fill();

  }
  if(S.set.part&&parts.length){c.save();c.globalCompositeOperation="lighter";for(const q of parts){const a=Math.max(0,1-q.life/q.max);c.fillStyle="rgba(255,"+(120+Math.round(80*a))+",40,"+(.85*a)+")";c.beginPath();c.arc(q.x,q.y,q.s,0,6.283);c.fill()}c.restore()}

function drawBillboards(c,t){

  const W2=TS.cx*2,H2=TS.cy*2;
  for(const o of objs){const[X,Y,k]=proj(o.x,o.y);if(X<-250||Y<-250||X>W2+250||Y>H2+250)continue;
    const sp=getSprite(o.k,o.r,o.s,o.v),sw=SWAY[o.k];
    c.save();c.translate(X,Y);c.scale(k,k);

    c.drawImage(sp.cv,-sp.ox,-sp.oy,sp.w,sp.h);c.restore();}
  for(const o of objs){const[X,Y,k]=proj(o.x,o.y);if(X<-250||Y<-250||X>W2+250||Y>H2+250)continue;
    const sp=getSprite(o.k,o.r,o.s,o.v);c.save();c.translate(X,Y);c.scale(k,k);
    sp.glow.forEach((g,i)=>glowAt(c,g[0],g[1],g[2],g[3],t,o.v+i));

}
