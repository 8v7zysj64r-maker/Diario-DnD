ra entro 9 m."],[7,"Incantesimi del dominio","Libertà di Movimento, Pelle di Pietra"],[8,"Colpo Divino","Una volta per turno +1d8 danni dello stesso tipo dell’arma (2d8 dal livello 14)."],[9,"Incantesimi del dominio","Blocca Mostri, Colpo Infuocato"],[17,"Avatar della Battaglia","Resistenza ai danni contundenti, perforanti e taglienti delle armi non magiche."]],"Inganno":[[1,"Benedizione dell’Ingannatore","Azione: concedi vantaggio alle prove di Furtività a una creatura consenziente toccata, per 1 ora."],[1,"Incantesimi del dominio","Camuffare Se Stesso, Charme su Persone"],[2,"Incanalare Divinità: Invocare Duplicato","Azione: crei un duplicato illusorio di te entro 9 m per 1 minuto (concentrazione)."],[3,"Incantesimi del dominio","Immagine Speculare, Passare Senza Tracce"],[5,"Incantesimi del dominio","Dissolvi Magie, Intermittenza"],[6,"Incanalare Divinità: Manto di Ombre","Azione: diventi invisibile fino alla fine del tuo prossimo turno."],[7,"Incantesimi del dominio","Metamorfosi, Porta Dimensionale"],[8,"Colpo Divino","Una volta per turno +1d8 danni da veleno (2d8 dal livello 14)."],[9,"Incantesimi del dominio","Dominare Persone, Modificare Memoria"],[17,"Duplicato Migliorato","Puoi creare fino a quattro duplicati."]],"Luce":[[1,"Trucchetto Bonus","Impari il trucchetto Luce."],[1,"Lampo di Interdizione","Reazione: svantaggio al tiro per colpire di chi ti attacca entro 9 m. Usi: mod SAG per riposo lungo."],[1,"Incantesimi del dominio","Luminescenza, Mani Brucianti"],[2,"Incanalare Divinità: Fulgore dell’Alba","Azione: dissolvi l’oscurità magica entro 9 m e infliggi 2d10 + livello da chierico danni radiosi (TS COS dimezza)."],[3,"Incantesimi del dominio","Raggio Rovente, Sfera Infuocata"],[5,"Incantesimi del dominio","Luce Diurna, Palla di Fuoco"],[6,"Lampo Migliorato","Puoi usare Lampo di Interdizione anche per proteggere un’altra creatura entro 9 m."],[7,"Incantesimi del dominio","Guardiano della Fede, Muro di Fuoco"],[8,"Incantesimi Potenti","Aggiungi il mod SAG ai danni dei trucchetti da chierico."],[9,"Incantesimi del dominio","Colpo Infuocato, Scrutare"],[17,"Corona di Luce","Azione: aura di luce solare per 1 minuto; i nemici nella luce intensa hanno svantaggio ai TS contro i tuoi incantesimi di fuoco o radiosi."]],"Natura":[[1,"Accolito della Natura","Impari un trucchetto da druido e competenza in una abilità (Addestrare Animali, Natura, Sopravvivenza)."],[1,"Competenza Bonus","Ottieni competenza nelle armature pesanti."],[1,"Incantesimi del dominio","Amicizia con gli Animali, Parlare con gli Animali"],[2,"Incanalare Divinità: Charme su Animali e Vegetali","Azione: affascini bestie e creature vegetali entro 9 m (TS Saggezza)."],[3,"Incantesimi del dominio","Crescita di Spine, Pelle Coriacea"],[5,"Incantesimi del dominio","Crescita Vegetale, Muro di Vento"],[6,"Mitigare Elementi","Reazione: dai a te o a una creatura entro 9 m resistenza ad acido, freddo, fulmine, fuoco o tuono."],[7,"Incantesimi del dominio","Dominare Bestie, Rampicante Afferrante"],[8,"Colpo Divino","Una volta per turno +1d8 danni da freddo, fulmine o fuoco (2d8 dal livello 14)."],[9,"Incantesimi del dominio","Piaga degli Insetti, Traslazione Arborea"],[17,"Maestro della Natura","Comandi le creature affascinate da Charme su Animali e Vegetali."]],"Tempesta":[[1,"Competenze Bonus","Ottieni competenza nelle armi da guerra e nelle armature pesanti."],[1,"Collera della Tempesta","Reazione: chi ti colpisce da entro 1,5 m subisce 2d8 fulmine o tuono (TS DES dimezza). Usi: mod SAG per riposo lungo."],[1,"Incantesimi del dominio","Nube di Nebbia, Onda Tonante"],[2,"Incanalare Divinità: Collera Distruttiva","Massimizzi i danni da fulmine o tuono invece di tirare."],[3,"Incantesimi del dominio","Folata di Vento, Frantumare"],[5,"Incantesimi del dominio","Invocare il Fulmine, Tempesta di Nevischio"],[6,"Colpo del Tuono e del Fulmine","Se infliggi danni da fulmine a una creatura Grande o inferiore, puoi spingerla fino a 3 m."],[7,"Incantesimi del dominio","Controllare Acqua, Tempesta di Ghiaccio"],[8,"Colpo Divino","Una volta per turno +1d8 danni da tuono (2d8 dal livello 14)."],[9,"Incantesimi del dominio","Onda Distruttiva, Piaga degli Insetti"],[17,"Nato dalla Tempesta","Hai velocità di volo pari alla tua velocità a terra quando non sei sottoterra o al chiuso."]],"Vita":[[1,"Competenza Bonus","Ottieni competenza nelle armature pesanti."],[1,"Discepolo della Vita","Gli incantesimi di cura (livello 1+) recuperano 2 + livello dell’incantesimo PF in più."],[1,"Incantesimi del dominio","Benedizione, Cura Ferite"],[2,"Incanalare Divinità: Preservare Vita","Azione: distribuisci 5 × livello da chierico PF a creature entro 9 m (fino a metà del loro massimo)."],[3,"Incantesimi del dominio","Arma Spirituale, Ristorare Inferiore"],[5,"Incantesimi del dominio","Faro di Speranza, Rinascita"],[6,"Guaritore Benedetto","Quando curi un altro con un incantesimo (1° o superiore), recuperi anche tu 2 + livello dell’incantesimo PF."],[7,"Incantesimi del dominio","Guardiano della Fede, Interdizione alla Morte"],[8,"Colpo Divino","Una volta per turno +1d8 danni radiosi (2d8 dal livello 14)."],[9,"Incantesimi del dominio","Cura Ferite di Massa, Rianimare Morti"],[17,"Guarigione Suprema","Quando tiri i dadi per curare, usi il valore massimo."]]}},"Druido":{"label":"Circolo Druidico","lv":2,"opts":{"Terra":[[2,"Trucchetto Bonus","Impari un trucchetto da druido a tua scelta."],[2,"Recupero Naturale","Riposo breve: recuperi slot per un totale di livelli pari a metà del livello da druido (per eccesso), nessuno di 6° o più. Una volta per riposo lungo."],[3,"Incantesimi del Circolo","Scegli un territorio (artico, costa, deserto, foresta, montagna, palude, prateria, Underdark): ottieni incantesimi sempre preparati ai livelli 3, 5, 7, 9."],[6,"Andatura sul Territorio","Il terreno difficile non magico non ti rallenta; le piante non magiche non ti ostacolano né ti feriscono."],[10,"Interdizione della Natura","Non puoi essere affascinato né spaventato da elementali e folletti; sei immune a veleni e malattie."],[14,"Rifugio della Natura","Bestie e creature vegetali che ti attaccano devono superare un TS Saggezza o scegliere un altro bersaglio (altrimenti l’attacco manca)."]],"Luna":[[2,"Forma Selvatica da Combattimento","Forma Selvatica come azione bonus; trasformato, azione bonus: spendi uno slot e recuperi 1d8 PF per livello dello slot."],[2,"Forme del Circolo","Puoi trasformarti in bestie con GS fino a 1 (livello 6: GS pari a livello/3)."],[6,"Colpo Primordiale","I tuoi attacchi in forma di bestia contano come magici."],[10,"Forma Selvatica Elementale","Spendi due usi di Forma Selvatica per trasformarti in un elementale dell’aria, della terra, del fuoco o dell’acqua."],[14,"Mille Forme","Lanci Alterare Se Stesso a volontà."]]}},"Ladro":{"label":"Archetipo Ladresco","lv":3,"opts":{"Furfante":[[3,"Mani Veloci","Con l’Azione Scaltra: Rapidità di Mano, uso di arnesi da scasso, uso di un oggetto."],[3,"Lavoro al Secondo Piano","Scalare non costa movimento extra; il salto in lungo aumenta di un numero di metri pari al mod DES."],[9,"Furtività Suprema","Se ti muovi a metà velocità o meno ottieni vantaggio alle prove di Furtività."],[13,"Usare Oggetto Magico","Ignori i requisiti di classe, razza e livello per usare oggetti magici."],[17,"Riflessi da Furfante","Nel primo round di ogni combattimento hai due turni (iniziativa e iniziativa − 10)."]],"Assassino":[[3,"Competenze Bonus","Ottieni competenza nel kit da camuffamento e nel kit da avvelenatore."],[3,"Assassinare","Vantaggio contro le creature che non hanno ancora agito; i tuoi colpi sui sorpresi sono critici."],[9,"Maestro Infiltrato","Crei identità false e ottieni nuove identità con 7 giorni e 25 mo."],[13,"Impostore","Imiti il discorso, la scrittura e il comportamento di una persona dopo 3 ore di studio."],[17,"Colpo Mortale","Se colpisci un sorpreso, TS Costituzione o danni doppi."]],"Mistificatore Arcano":[[3,"Incantesimi","Lanci incantesimi da mago (Intelligenza), solo di ammaliamento e illusione per la maggior parte; 3 trucchetti e incantesimi conosciuti come da tabella."],[3,"Gioco di Prestigio della Mano Magica","Quando lanci Mano Magica la mano è invisibile e può riporre o recuperare oggetti e scassinare a distanza."],[9,"Imboscata Magica","Se sei nascosto a una creatura, ha svantaggio ai TS contro i tuoi incantesimi."],[13,"Ingannatore Versatile","Azione bonus: designi una creatura entro 1,5 m dalla Mano Magica: vantaggio ai tuoi tiri per colpire contro di essa fino a fine turno."],[17,"Ladro di Incantesimi","Reazione: annulli un incantesimo lanciato contro di te e lo rubi (riposo lungo)."]]}},"Warlock":{"label":"Patrono Ultraterreno","lv":1,"opts":{"Signore Fatato":[[1,"Presenza Fatata","Azione: cubo di 3 m, TS Saggezza o affascinate/spaventate fino alla fine del tuo prossimo turno. Riposo breve o lungo."],[6,"Fuga Velata","Reazione quando subisci danni: ti teletrasporti fino a 18 m e diventi invisibile. Riposo breve o lungo."],[10,"Difese Seducenti","Non puoi essere affascinato; se qualcuno ci prova puoi ritorcere l’effetto con una reazione (TS Saggezza)."],[14,"Delirio Oscuro","Azione: una creatura entro 18 m (TS Saggezza) è affascinata o spaventata per 1 minuto. Riposo breve o lungo."]],"Immondo":[[1,"Benedizione dell’Oscuro","Quando riduci una creatura ostile a 0 PF ottieni PF temporanei pari al mod CAR + livello da warlock."],[6,"Fortuna dell’Oscuro","Quando fai una prova o un TS, aggiungi 1d10. Riposo breve o lungo."],[10,"Resilienza Immonda","Dopo ogni riposo scegli un tipo di danno: resistenza finché non lo cambi (ignorata da armi magiche o argentate)."],[14,"Scagliare all’Inferno","Quando colpisci con un attacco, il bersaglio sparisce nel piano inferiore e subisce 10d10 danni psichici se non è un immondo. Riposo lungo."]],"Grande Antico":[[1,"Mente Risvegliata","Parli telepaticamente con creature entro 9 m che vedi."],[6,"Interdizione Entropica","Reazione: svantaggio all’attacco di un nemico; se fallisce, il prossimo attacco contro di lui ha vantaggio. Riposo breve o lungo."],[10,"Scudo del Pensiero","I tuoi pensieri non possono essere letti; resistenza ai danni psichici e riflessione dei danni."],[14,"Creare Servitore","Azione: trasformi un umanoide (TS Saggezza) in tuo servitore per un anno. Riposo lungo."]]}}};
const DET={"Campione|Critico Migliorato":[["","I tuoi attacchi con un’arma mettono a segno un colpo critico con un 19 o un 20 sul d20."]],"Campione|Atleta Straordinario":[["","Aggiungi metà del tuo bonus di competenza (per eccesso) a ogni prova di Forza, Destrezza o Costituzione in cui non sei già competente."],["","Il salto in lungo con rincorsa aumenta di 30 cm per ogni punto del tuo modificatore di Forza."]],"Campione|Stile di Combattimento Aggiuntivo":[["","Scegli un secondo stile di combattimento tra quelli del guerriero. Lo selezioni nella scheda, sezione “Stile di combattimento”."]],"Campione|Critico Superiore":[["","I tuoi attacchi con un’arma mettono a segno un colpo critico con un risultato da 18 a 20 sul d20."]],"Campione|Sopravvissuto":[["","All’inizio di ogni tuo turno recuperi 5 + il tuo modificatore di Costituzione in PF, se hai meno della metà dei PF massimi. Non funziona a 0 PF."]],"Maestro di Battaglia|Superiorità in Combattimento":[["","Hai 4 dadi di superiorità (d8) e conosci 3 manovre. Puoi usare una sola manovra per attacco. Ogni dado speso si recupera con un riposo breve o lungo."],["Progressione","Livello 7: 5 dadi e 5 manovre. Livello 10: 7 manovre. Livello 15: 6 dadi e 9 manovre. A ogni nuova manovra puoi sostituirne una già conosciuta."],["CD dei tiri salvezza","8 + bonus di competenza + modificatore di Forza o Destrezza (a tua scelta)."],["Attacco Adescante","Dopo un colpo, il bersaglio fa un TS Saggezza o ha svantaggio ai tiri per colpire contro chiunque tranne te, fino alla fine del tuo prossimo turno. Aggiungi il dado ai danni."],["Attacco con Affondo","Con un attacco in mischia aumenti la portata di 1,5 m; se colpisci aggiungi il dado ai danni."],["Attacco con Finta","Azione bonus: scegli una creatura entro 1,5 m. Hai vantaggio al prossimo attacco contro di lei in questo turno; se colpisci aggiungi il dado ai danni."],["Attacco con Manovra","Dopo un colpo, aggiungi il dado ai danni e un alleato che ti vede o sente può usare la reazione per muoversi fino a metà velocità senza provocare attacchi di opportunità dal bersaglio."],["Attacco con Spazzata","Dopo un colpo in mischia, un’altra creatura entro 1,5 m dal bersaglio e nella tua portata subisce danni pari al dado (stesso tipo), se il tiro l’avrebbe colpita."],["Attacco con Spinta","Dopo un colpo, aggiungi il dado ai danni; un bersaglio Grande o più piccolo fa un TS Forza o viene spinto fino a 4,5 m."],["Attacco Disarmante","Dopo un colpo, aggiungi il dado ai danni; il bersaglio fa un TS Forza o lascia cadere un oggetto che scegli."],["Attacco Minaccioso","Dopo un colpo, aggiungi il dado ai danni; il bersaglio fa un TS Saggezza o è spaventato da te fino alla fine del tuo prossimo turno."],["Attacco Preciso","Prima o dopo un tiro per colpire con un’arma, aggiungi il dado al tiro."],["Attacco Sbilanciante","Dopo un colpo, aggiungi il dado ai danni; un bersaglio Grande o più piccolo fa un TS Forza o cade prono."],["Colpo del Comandante","Rinunci a un attacco e usi un’azione bonus: un alleato che ti vede o sente usa la reazione per attaccare con un’arma, aggiungendo il dado ai danni."],["Colpo Distraente","Dopo un colpo, aggiungi il dado ai danni; il prossimo attacco di un altro alleato contro il bersaglio ha vantaggio (entro l’inizio del tuo prossimo turno)."],["Incoraggiamento","Azione bonus: un alleato che ti vede o sente ottiene PF temporanei pari al dado + il tuo modificatore di Carisma."],["Parata","Reazione: quando una creatura ti infligge danni in mischia, li riduci di dado + modificatore di Destrezza."],["Replica","Reazione: se una creatura ti manca in mischia, la attacchi con un’arma da mischia; se colpisci aggiungi il dado ai danni."],["Scarto Elusivo","Quando ti muovi, tira il dado e aggiungi il risultato alla CA finché non smetti di muoverti."]],"Maestro di Battaglia|Studioso di Guerra":[["","Ottieni competenza in un tipo di strumenti da artigiano a tua scelta."]],"Maestro di Battaglia|Conosci il Tuo Nemico":[["","Se osservi o interagisci con una creatura per almeno 1 minuto fuori dal combattimento, il DM ti dice se è pari, superiore o inferiore a te in due di questi tratti a tua scelta: Forza, Destrezza, Costituzione, Classe Armatura, PF attuali, livelli di classe totali, livelli da guerriero."]],"Maestro di Battaglia|Superiorità in Combattimento Migliorata":[["","Al livello 10 i dadi di superiorità diventano d10, al livello 18 diventano d12."]],"Maestro di Battaglia|Implacabile":[["","Quando tiri l’iniziativa e non hai dadi di superiorità, ne recuperi uno."]],"Cavaliere Mistico|Incantesimi":[["","Lanci incantesimi da mago usando l’Intelligenza (CD = 8 + competenza + mod INT). Conosci 2 trucchetti (3 dal livello 10) e incantesimi di 1° livello o superiore memorizzati, senza libro. Gli slot si recuperano con un riposo lungo."],["Limiti di scuola","Gli incantesimi che impari devono essere di abiurazione o invocazione, tranne quelli ottenuti ai livelli 8, 14 e 20."],["Tabella","Slot e incantesimi conosciuti per livello sono nella tabella del Cavaliere Mistico del Manuale del giocatore."]],"Cavaliere Mistico|Magia da Guerra":[["","Dopo aver lanciato un trucchetto con l’azione puoi effettuare un attacco con un’arma come azione bonus."]],"Cavaliere Mistico|Colpo Mistico":[["","Quando colpisci una creatura con un’arma, essa ha svantaggio al prossimo tiro salvezza contro un tuo incantesimo prima della fine del tuo prossimo turno."]],"Cavaliere Mistico|Carica Arcana":[["","Quando usi Azione Impetuosa puoi teletrasportarti fino a 9 m in uno spazio libero che vedi, prima o dopo l’azione aggiuntiva."]],"Cavaliere Mistico|Magia da Guerra Migliorata":[["","Dopo aver lanciato un incantesimo con l’azione puoi effettuare un attacco con un’arma come azione bonus."]],"Abiurazione|Interdizione Arcana":[["","Quando lanci un’abiurazione di 1° livello o superiore crei un’interdizione che dura fino al riposo lungo. Ha PF pari a 2 × livello da mago + mod INT e assorbe i danni al posto tuo; i danni in eccesso passano a te."],["Ricarica","Ogni volta che lanci un’abiurazione di 1° livello o superiore, l’interdizione recupera PF pari al doppio del livello dell’incantesimo. Puoi crearne una nuova solo dopo un riposo lungo."]],"Abiurazione|Interdizione Proiettata":[["","Reazione: quando una creatura entro 9 m che vedi subisce danni, la tua Interdizione Arcana assorbe quei danni. Se i danni superano i PF dell’interdizione, il resto va alla creatura."]],"Abiurazione|Abiurazione Migliorata":[["","Aggiungi il bonus di competenza alle prove di caratteristica per Controincantesimo e Dissolvi Magie."]],"Abiurazione|Resistenza agli Incantesimi":[["","Hai vantaggio ai tiri salvezza contro gli incantesimi e resistenza ai danni degli incantesimi."]],"Ammaliamento|Sguardo Ipnotico":[["","Azione: scegli una creatura entro 1,5 m che ti vede o sente. Fa un TS Saggezza (CD incantesimi) o è affascinata fino alla fine del tuo prossimo turno, con velocità 0 e incapacitata. Nei turni successivi usi l’azione per mantenere l’effetto; termina se ti allontani oltre 1,5 m, se la creatura non ti vede o sente, o se subisce danni. Una creatura è colpita una volta per riposo lungo."]],"Ammaliamento|Fascino Istintivo":[["","Reazione: quando una creatura entro 9 m ti attacca, può essere costretta a un TS Saggezza; se lo fallisce sceglie un altro bersaglio entro portata (o l’attacco fallisce). Una creatura è colpita una volta per riposo lungo; le creature immuni all’essere affascinate sono immuni."]],"Ammaliamento|Ammaliamento Condiviso":[["","Quando lanci un incantesimo di ammaliamento di 1° livello o superiore che ha un solo bersaglio, puoi scegliere un secondo bersaglio entro 9 m dal primo."]],"Ammaliamento|Alterare Ricordi":[["","Quando affascini una creatura con un ammaliamento, puoi far sì che non si accorga di essere stata affascinata. Con un’azione puoi anche farle dimenticare parte del tempo trascorso (TS Intelligenza; durata di ricordi cancellati pari a 1 + mod INT ore)."]],"Divinazione|Portento":[["","Dopo ogni riposo lungo tiri 2d20 e annoti i risultati. Prima di un tiro per colpire, prova o TS tuo o di una creatura che vedi, puoi sostituire il d20 con uno dei risultati del Portento (una volta ciascuno). I tiri non usati si perdono al riposo lungo successivo."]],"Divinazione|Divinazione Esperta":[["","Quando lanci una divinazione di 2° livello o superiore recuperi uno slot incantesimo di livello inferiore di almeno 1 livello, fino al 5° livello."]],"Divinazione|Terzo Occhio":[["","Azione: ottieni un beneficio a scelta fino al prossimo riposo breve o lungo: scurovisione fino a 18 m, vista eterea fino a 18 m, lettura (comprendi qualunque scrittura) oppure vedere invisibilità fino a 3 m."]],"Divinazione|Portento Superiore":[["","Il Portento usa 3d20 invece di 2d20."]],"Evocazione|Evocazione Minore":[["","Azione: crei un oggetto inanimato non magico in uno spazio libero entro 3 m. Non più grande di 90 cm per lato e 4,5 kg; dura 1 ora o finché non subisce danni."]],"Evocazione|Trasposizione Benevola":[["","Azione: ti teletrasporti fino a 9 m in uno spazio libero visibile, oppure scambi posto con una creatura Piccola o Media consenziente entro 9 m. Dopo l’uso devi lanciare un’evocazione di 1° livello o superiore o fare un riposo lungo."]],"Evocazione|Evocazione Focalizzata":[["","Se ti concentri su un’evocazione, i danni non spezzano la concentrazione."]],"Evocazione|Evocazioni Perduranti":[["","Le creature che evochi con un incantesimo di evocazione ottengono 30 PF temporanei."]],"Illusione|Illusione Minore Migliorata":[["","Impari Illusione Minore (o un altro trucchetto da mago se già la conosci). Quando la lanci puoi creare insieme suono e immagine."]],"Illusione|Illusioni Duttili":[["","Quando lanci un’illusione con durata di almeno 1 minuto, puoi usare l’azione per modificarla finché la sostieni."]],"Illusione|Sosia Illusorio":[["","Reazione: quando una creatura ti attacca, crei un duplicato illusorio e l’attacco fallisce automaticamente. Si ricarica con un riposo breve o lungo."]],"Illusione|Realtà Illusoria":[["","Azione bonus mentre ti concentri su un’illusione di 1° livello o superiore: un oggetto inanimato non magico che fa parte dell’illusione diventa reale per 1 minuto. Non può infliggere danni né ferire direttamente."]],"Invocazione|Plasmare Incantesimi":[["","Quando lanci un’invocazione che colpisce un’area, scegli un numero di creature che vedi pari a 1 + livello dell’incantesimo: superano automaticamente il tiro salvezza e non subiscono danni."]],"Invocazione|Trucchetto Potente":[["","I trucchetti con un tiro salvezza infliggono metà danni anche se il bersaglio supera il tiro, e nessun effetto aggiuntivo."]],"Invocazione|Invocazione Potente":[["","Aggiungi il tuo modificatore di Intelligenza ai danni di qualsiasi incantesimo da mago di invocazione."]],"Invocazione|Saturazione Magica":[["","Quando lanci un incantesimo da mago di 1°-5° livello che infligge danni, puoi infliggere il massimo dei danni. La prima volta non hai conseguenze. Dal secondo uso prima di un riposo lungo subisci 2d12 danni necrotici per livello dell’incantesimo (+1d12 per livello a ogni uso successivo). Questi danni ignorano resistenze e immunità."]],"Trasmutazione|Alchimia Minore":[["","Per ogni 10 minuti di rito puoi trasformare 30 cm cubi di materiale non magico tra legno, pietra (non gemme), ferro, rame e argento. Dopo 1 ora o se perdi la concentrazione, torna com’era."]],"Trasmutazione|Pietra del Trasmutatore":[["","Con 8 ore di lavoro crei una pietra. Chi la porta ottiene un beneficio a tua scelta: scurovisione 18 m, +3 m di velocità, competenza nei TS Costituzione, oppure resistenza ad acido, freddo, fuoco, fulmine o tuono. Quando lanci una trasmutazione di 1° livello o superiore puoi cambiare il beneficio."]],"Trasmutazione|Muta Forma":[["","Aggiungi Metamorfosi al libro incantesimi. Puoi lanciarlo su te stesso senza slot, una volta per riposo breve o lungo, solo trasformandoti in una bestia di GS 1 o inferiore."]],"Trasmutazione|Maestro Trasmutatore":[["","Azione: consumi la tua Pietra del Trasmutatore per un effetto a scelta: Trasformazione Maggiore, Panacea (rimuove maledizioni, malattie, veleni e ripristina tutti i PF), Ripristino della Vita (come Rianimare Morti senza slot) o Ripristino della Giovinezza (riduci l’età di 3d10 anni)."]],"Abiurazione|Abiuratore Sapiente":[["","Il tempo e il denaro per copiare nel libro incantesimi un incantesimo di abiurazione sono dimezzati."]],"Ammaliamento|Ammaliatore Sapiente":[["","Il tempo e il denaro per copiare nel libro incantesimi un incantesimo di ammaliamento sono dimezzati."]],"Divinazione|Divinatore Sapiente":[["","Il tempo e il denaro per copiare nel libro incantesimi un incantesimo di divinazione sono dimezzati."]],"Evocazione|Evocatore Sapiente":[["","Il tempo e il denaro per copiare nel libro incantesimi un incantesimo di evocazione sono dimezzati."]],"Illusione|Illusionista Sapiente":[["","Il tempo e il denaro per copiare nel libro incantesimi un incantesimo di illusione sono dimezzati."]],"Invocazione|Invocatore Sapiente":[["","Il tempo e il denaro per copiare nel libro incantesimi un incantesimo di invocazione sono dimezzati."]],"Trasmutazione|Trasmutatore Sapiente":[["","Il tempo e il denaro per copiare nel libro incantesimi un incantesimo di trasmutazione sono dimezzati."]],"Discendenza Draconica|Antenato Draconico":[["","Scegli un drago come antenato: determina il tipo di danno dei tuoi privilegi. Parli, leggi e scrivi in Draconico e raddoppi la competenza nelle prove di Carisma con i draghi."],["Argento / Bianco","Freddo"],["Blu / Bronzo","Fulmine"],["Nero / Rame","Acido"],["Oro / Ottone / Rosso","Fuoco"],["Verde","Veleno"]],"Discendenza Draconica|Resilienza Draconica":[["","I tuoi PF massimi aumentano di 1 per ogni livello da stregone. Senza armatura la tua CA è 13 + modificatore di Destrezza."]],"Discendenza Draconica|Affinità Elementale":[["","Quando lanci un incantesimo che infligge danni del tipo del tuo antenato, aggiungi il modificatore di Carisma ai danni. Puoi spendere 1 punto stregoneria per ottenere resistenza a quel tipo per 1 ora."]],"Discendenza Draconica|Ali di Drago":[["","Azione bonus: ti spuntano ali di drago e ottieni velocità di volo pari alla tua velocità attuale. Durano finché non le congedi (azione bonus). Non puoi manifestarle con un’armatura non adatta."]],"Discendenza Draconica|Presenza Draconica":[["","Azione: spendi 5 punti stregoneria per creare un’aura di 18 m che dura 1 minuto (concentrazione). Le creature ostili che iniziano il turno nell’aura o vi entrano fanno un TS Saggezza o sono affascinate o spaventate (a tua scelta). Chi supera il TS è immune per 24 ore."]],"Magia Selvaggia|Impulso di Magia Selvaggia":[["","Una volta per turno, dopo aver lanciato un incantesimo da stregone di 1° livello o superiore, il DM può chiederti di tirare un d20. Con un 1 tiri sulla tabella “Impulsi di Magia Selvaggia” (d100) del Manuale. L’effetto non è influenzato dalla Metamagia e non richiede concentrazione."]],"Magia Selvaggia|Onde di Caos":[["","Ottieni vantaggio a un tiro per colpire, una prova di caratteristica o un tiro salvezza. Si ricarica con un riposo lungo, o quando il DM ti fa tirare sulla tabella degli impulsi dopo un incantesimo di 1° livello o superiore."]],"Magia Selvaggia|Piegare la Fortuna":[["","Reazione: spendi 2 punti stregoneria quando una creatura che vedi tira per colpire, prova o TS. Tira 1d4 e applica il risultato come bonus o penalità al tiro, dopo che ha tirato ma prima degli effetti."]],"Magia Selvaggia|Caos Controllato":[["","Quando tiri sulla tabella degli impulsi, tiri due volte e scegli quale risultato usare."]],"Magia Selvaggia|Bombardamento Magico":[["","Quando tiri i danni di un incantesimo e ottieni il massimo su un dado, puoi ritirare quel dado una volta per turno e aggiungere il nuovo risultato ai danni."]],"Devozione|Arma Consacrata":[["","Azione, spendi un uso di Incanalare Divinità. Per 1 minuto aggiungi il tuo modificatore di Carisma (minimo +1) ai tiri per colpire con un’arma che impugni. L’arma emette luce intensa per 6 m e fioca per altri 6 m, e diventa magica se non lo era. Puoi terminare l’effetto nel tuo turno; finisce se non impugni o porti l’arma o se sei privo di sensi."]],"Devozione|Scacciare i Sacrileghi":[["","Azione, spendi un uso di Incanalare Divinità. Ogni immondo o non morto entro 9 m che ti vede o sente fa un TS Saggezza. Se fallisce è scacciato per 1 minuto o finché non subisce danni: deve allontanarsi il più possibile da te, non può muoversi volontariamente entro 9 m da te, non può fare reazioni e può solo usare Scatto o tentare di liberarsi da effetti che lo bloccano (se non può muoversi usa Schivata)."]],"Devozione|Aura di Devozione":[["","Tu e gli alleati entro 3 m non potete essere affascinati finché sei cosciente. Dal livello 18 il raggio è 9 m."]],"Devozione|Purezza di Spirito":[["","Sei sempre sotto l’effetto di Protezione dal Bene e dal Male."]],"Devozione|Nube Sacra":[["","Azione: per 1 minuto emani luce solare, luce intensa per 9 m e fioca per altri 9 m. I nemici che iniziano il turno nella luce intensa subiscono 10 danni radiosi. Hai vantaggio ai TS contro gli incantesimi di immondi e non morti. Si ricarica con un riposo lungo."]],"Antichi|Collera della Natura":[["","Azione, spendi un uso di Incanalare Divinità. Rampicanti spettrali afferrano una creatura entro 3 m che vedi. La creatura fa un TS Forza o Destrezza (a sua scelta): se fallisce è trattenuta. Ripete il TS alla fine di ogni suo turno; se lo supera si libera e i rampicanti svaniscono."]],"Antichi|Scacciare gli Infedeli":[["","Azione, spendi un uso di Incanalare Divinità. Ogni folletto o immondo entro 9 m che ti sente fa un TS Saggezza. Se fallisce è scacciato per 1 minuto o finché non subisce danni: deve allontanarsi da te il più possibile, non può muoversi volontariamente entro 9 m da te, non può fare reazioni e può solo usare Scatto o tentare di liberarsi da effetti che lo bloccano (se non può muoversi usa Schivata). Se la sua vera forma è nascosta da illusioni o metamorfosi, viene rivelata."]],"Antichi|Aura di Interdizione":[["","Tu e gli alleati entro 3 m avete resistenza ai danni degli incantesimi. Dal livello 18 il raggio è 9 m."]],"Antichi|Sentinella Imperitura":[["","Quando scendi a 0 PF senza morire sul colpo, resti a 1 PF. Una volta per riposo lungo. Inoltre non subisci gli svantaggi dell’età e non puoi essere invecchiato magicamente."]],"Antichi|Campione degli Antichi":[["","Azione: per 1 minuto ti trasformi in una forza antica della natura. All’inizio di ogni tuo turno recuperi 10 PF; gli incantesimi da paladino con tempo di lancio di 1 azione possono essere lanciati con un’azione bonus; i nemici entro 3 m hanno svantaggio ai TS contro i tuoi incantesimi da paladino e le tue opzioni di Incanalare Divinità. Si ricarica con un riposo lungo."]],"Vendetta|Abiurare Nemico":[["","Azione, spendi un uso di Incanalare Divinità. Scegli una creatura entro 18 m che vedi: fa un TS Saggezza (immondi e non morti con svantaggio; immune chi non può essere spaventato). Se fallisce è spaventata per 1 minuto o finché non subisce danni, con velocità 0 e senza bonus alla velocità. Se supera il TS la sua velocità è dimezzata per 1 minuto o finché non subisce danni."]],"Vendetta|Giuramento di Inimicizia":[["","Azione bonus, spendi un uso di Incanalare Divinità. Scegli una creatura entro 3 m che vedi: hai vantaggio ai tiri per colpire contro di lei per 1 minuto o finché scende a 0 PF o perde i sensi."]],"Vendetta|Vendicatore Implacabile":[["","Quando colpisci con un attacco di opportunità puoi muoverti fino a metà della tua velocità subito dopo, come parte della stessa reazione. Questo movimento non provoca attacchi di opportunità."]],"Vendetta|Anima di Vendetta":[["","Reazione: quando una creatura sotto il tuo Giuramento di Inimicizia effettua un attacco, puoi attaccarla con un’arma da mischia se è entro portata."]],"Vendetta|Angelo Vendicatore":[["","Azione: per 1 ora ottieni ali e velocità di volo 18 m. Emani un’aura di minaccia di 9 m: la prima volta che una creatura ostile entra nell’aura o vi inizia il turno in combattimento, fa un TS Saggezza o è spaventata per 1 minuto o finché non subisce danni; i tiri per colpire contro una creatura spaventata hanno vantaggio. Si ricarica con un riposo lungo."]],"Cacciatore|Preda del Cacciatore":[["","Scegli una di queste opzioni:"],["Devastatore dell’Orda","Una volta per turno, quando attacchi con un’arma, puoi attaccare con la stessa arma una creatura diversa entro 1,5 m dal bersaglio originale e nella gittata dell’arma."],["Sterminatore di Colossi","Quando colpisci una creatura con un’arma che ha meno del massimo dei PF, infliggi 1d8 danni extra (una volta per turno)."],["Uccisore di Giganti","Reazione: quando una creatura Grande o più grande entro 1,5 m ti colpisce o ti manca, la attacchi subito dopo, se la vedi."]],"Cacciatore|Tattiche Difensive":[["","Scegli una di queste opzioni:"],["Difesa dal Multiattacco","Quando una creatura ti colpisce, hai +4 alla CA contro gli attacchi successivi di quella creatura per il resto del turno."],["Sfuggire all’Orda","Gli attacchi di opportunità contro di te hanno svantaggio."],["Volontà d’Acciaio","Hai vantaggio ai tiri salvezza contro l’essere spaventato."]],"Cacciatore|Multiattacco":[["","Scegli una di queste opzioni:"],["Raffica","Azione: attacco a distanza contro un qualsiasi numero di creature entro 3 m da un punto che vedi nella gittata. Tiro per colpire separato per ogni bersaglio, con munizioni sufficienti."],["Attacco Turbinante","Azione: un attacco in mischia contro ogni creatura entro 1,5 m da te, con un tiro per colpire separato per ciascuna."]],"Cacciatore|Difesa del Cacciatore Superiore":[["","Scegli una di queste opzioni:"],["Elusione","Nei TS Destrezza per dimezzare i danni non subisci danni se superi il tiro e metà se lo fallisci."],["Opporsi alla Marea","Reazione: quando una creatura ostile ti manca con un attacco in mischia, la costringi a ripetere lo stesso attacco contro un’altra creatura a tua scelta (non lei stessa)."],["Schivata Prodigiosa","Reazione: quando un attaccante che vedi ti colpisce, dimezzi i danni."]],"Signore delle Bestie|Compagno del Ranger":[["","Ottieni una bestia compagna di taglia Media o inferiore con GS 1/4 o meno (esempi: falco, mastino, pantera). Aggiungi il tuo bonus di competenza alla sua CA, ai tiri per colpire, ai danni, ai TS e alle abilità in cui è competente. I suoi PF massimi sono quelli indicati o 4 × il tuo livello da ranger, se maggiori; può spendere Dadi Vita nei riposi brevi."],["Comandi","Agisce nel tuo turno (tua iniziativa). Puoi ordinare dove muoversi (nessuna azione) e con un’azione ordini Aiuto, Attacco, Disimpegno, Scatto o Schivata. Con Attacco Extra attacchi tu stesso mentre ordini l’attacco alla bestia. Se sei incapacitato o assente agisce da sola; usa la reazione senza comando."],["Altro","Viaggi furtivamente a passo normale in compagnia solo della bestia nel tuo terreno prediletto. Se muore, ne leghi un’altra con 8 ore di rito."]],"Signore delle Bestie|Addestramento Straordinario":[["","Nei turni in cui la bestia non attacca, usi un’azione bonus per ordinarle Aiuto, Disimpegno, Scatto o Schivata."]],"Signore delle Bestie|Furia Bestiale":[["","Quando ordini alla bestia di attaccare, effettua due attacchi (o Multiattacco, se lo possiede)."]],"Signore delle Bestie|Condividere Incantesimi":[["","Quando lanci un incantesimo che bersaglia solo te stesso, puoi influenzare anche la bestia compagna se è entro 9 m."]],"Mano Aperta|Tecnica della Mano Aperta":[["","Ogni volta che colpisci con un attacco della Raffica di Colpi puoi imporre un effetto al bersaglio, a scelta:"],["Destrezza","TS Destrezza o cade prono."],["Forza","TS Forza o viene spinto fino a 4,5 m."],["Reazioni","Non può usare reazioni fino alla fine del tuo prossimo turno."]],"Mano Aperta|Integrità del Corpo":[["","Azione: recuperi PF pari a 3 × il tuo livello da monaco. Si ricarica con un riposo lungo."]],"Mano Aperta|Tranquillità":[["","Alla fine di un riposo lungo ottieni l’effetto di Santuario fino al prossimo riposo lungo (CD 8 + competenza + mod SAG). Termina se attacchi o lanci un incantesimo."]],"Mano Aperta|Palmo Tremante":[["","Quando colpisci con un attacco senz’armi puoi spendere 3 punti ki per avviare vibrazioni impercettibili nel bersaglio, che durano un numero di giorni pari al tuo livello da monaco. Con un’azione puoi concluderle se sei sullo stesso piano: il bersaglio fa un TS Costituzione; se fallisce scende a 0 PF, altrimenti subisce 10d10 danni necrotici. Puoi avere un solo bersaglio alla volta e puoi terminare le vibrazioni senza effetto."]],"Ombra|Arti dell’Ombra":[["","Puoi spendere 2 punti ki per lanciare Oscurità, Passo Senza Tracce, Silenzio o Scurovisione senza componenti materiali. Impari anche il trucchetto Illusione Minore."]],"Ombra|Passo dell’Ombra":[["","Azione bonus: se sei in luce fioca o buio, ti teletrasporti fino a 18 m in uno spazio libero visibile anch’esso in luce fioca o buio. Hai vantaggio al primo attacco in mischia prima della fine del turno."]],"Ombra|Manto di Ombre":[["","Azione: se sei in luce fioca o buio diventi invisibile finché non attacchi, lanci un incantesimo o ti trovi in luce intensa."]],"Ombra|Opportunista":[["","Reazione: quando una creatura entro 1,5 m da te viene colpita da un attacco di un’altra creatura, la attacchi in mischia."]],"Quattro Elementi|Discepolo degli Elementi":[["","Conosci Sintonia Elementale e una disciplina elementale. Ne impari un’altra ai livelli 6, 11 e 17 e puoi sostituirne una a ogni nuova disciplina. Ogni disciplina costa punti ki. Dal livello 5, per le discipline che lanciano incantesimi puoi spendere ki aggiuntivi: l’incantesimo sale di 1 livello per ogni ki extra. Il massimo di ki per incantesimo (costo base incluso) è 3 ai livelli 5–8, 4 ai 9–12, 5 ai 13–16, 6 ai 17–20."],["Sintonia Elementale (0)","Azione: controlli brevemente le forze elementali vicine con un effetto a scelta: un effetto sensoriale innocuo (acqua, aria, fuoco, terra); accendere o spegnere una torcia, una candela o un piccolo fuoco; raffreddare o riscaldare fino a 0,5 kg di materiale non vivente per 1 ora; generare terra, fuoco, acqua o foschia in un cubo di 30 cm che assume una forma a tua scelta per 1 minuto."],["Colpo della Cenere Turbinante (2 ki)","Lanci Mani Brucianti."],["Forma del Fiume Fluente (1 ki)","Azione: scegli un’area d’acqua o di ghiaccio non più grande di 9 m per lato entro 36 m. Puoi trasformare l’acqua in ghiaccio e viceversa e modellare il ghiaccio, alzarlo, abbassarlo, scavare canali, erigere o abbattere muri o colonne. I cambiamenti non possono superare la metà della dimensione più grande dell’area e non puoi usarli per intrappolare o ferire una creatura."],["Frusta d’Acqua (2 ki + 1 per ki extra)","Azione: una creatura entro 9 m che vedi fa un TS Destrezza. Se fallisce subisce 3d10 danni contundenti (+1d10 per ogni ki aggiuntivo) e puoi farla cadere prona o tirarla fino a 7,5 m verso di te. Se supera il TS subisce metà dei danni e non viene tirata né fatta cadere."],["Pugno dei Quattro Tuoni (2 ki)","Lanci Onda Tonante."],["Pugno dell’Aria Inviolabile (2 ki + 1 per ki extra)","Azione: una creatura entro 9 m fa un TS Forza. Se fallisce subisce 3d10 danni contundenti (+1d10 per ogni ki aggiuntivo) e puoi spingerla fino a 6 m e farla cadere prona. Se supera il TS subisce metà dei danni e non viene spinta né cade."],["Spiriti della Burrasca Impetuosa (2 ki)","Lanci Folata di Vento."],["Zanne del Serpente di Fuoco (1 ki)","Quando usi l’azione di Attacco puoi spendere 1 ki: i tuoi colpi senz’armi hanno portata +3 m per quell’azione e il resto del turno, e infliggono danni da fuoco invece che contundenti. Se spendi 1 ki quando un tale attacco colpisce, infligge 1d10 danni da fuoco extra."]],"Quattro Elementi|Discipline Elementali":[["","Impari una nuova disciplina elementale (puoi sostituirne una). Discipline disponibili ora:"],["Sintonia Elementale (0)","Azione: controlli brevemente le forze elementali vicine con un effetto a scelta: un effetto sensoriale innocuo (acqua, aria, fuoco, terra); accendere o spegnere una torcia, una candela o un piccolo fuoco; raffreddare o riscaldare fino a 0,5 kg di materiale non vivente per 1 ora; generare terra, fuoco, acqua o foschia in un cubo di 30 cm che assume una forma a tua scelta per 1 minuto."],["Colpo della Cenere Turbinante (2 ki)","Lanci Mani Brucianti."],["Forma del Fiume Fluente (1 ki)","Azione: scegli un’area d’acqua o di ghiaccio non più grande di 9 m per lato entro 36 m. Puoi trasformare l’acqua in ghiaccio e viceversa e modellare il ghiaccio, alzarlo, abbassarlo, scavare canali, erigere o abbattere muri o colonne. I cambiamenti non possono superare la metà della dimensione più grande dell’area e non puoi usarli per intrappolare o ferire una creatura."],["Frusta d’Acqua (2 ki + 1 per ki extra)","Azione: una creatura entro 9 m che vedi fa un TS Destrezza. Se fallisce subisce 3d10 danni contundenti (+1d10 per ogni ki aggiuntivo) e puoi farla cadere prona o tirarla fino a 7,5 m verso di te. Se supera il TS subisce metà dei danni e non viene tirata né fatta cadere."],["Gong della Sommità (3 ki)","Lanci Frantumare. Richiede il livello 6."],["Morsa del Vento del Nord (3 ki)","Lanci Blocca Persone. Richiede il livello 6."],["Pugno dei Quattro Tuoni (2 ki)","Lanci Onda Tonante."],["Pugno dell’Aria Inviolabile (2 ki + 1 per ki extra)","Azione: una creatura entro 9 m fa un TS Forza. Se fallisce subisce 3d10 danni contundenti (+1d10 per ogni ki aggiuntivo) e puoi spingerla fino a 6 m e farla cadere prona. Se supera il TS subisce metà dei danni e non viene spinta né cade."],["Spiriti della Burrasca Impetuosa (2 ki)","Lanci Folata di Vento."],["Zanne del Serpente di Fuoco (1 ki)","Quando usi l’azione di Attacco puoi spendere 1 ki: i tuoi colpi senz’armi hanno portata +3 m per quell’azione e il resto del turno, e infliggono danni da fuoco invece che contundenti. Se spendi 1 k scavare canali, erigere o abbattere muri o colonne. I cambiamenti non possono superare la metà della dimensione più grande dell’area e non puoi usarli per intrappolare o ferire una creatura."],["Frusta d’Acqua (2 ki + 1 per ki extra)","Azione: una creatura entro 9 m che vedi fa un TS Destrezza. Se fallisce subisce 3d10 danni contundenti (+1d10 per ogni ki aggiuntivo) e puoi farla cadere prona o tirarla fino a 7,5 m verso di te. Se supera il TS subisce metà dei danni e non viene tirata né fatta cadere."],["Gong della Sommità (3 ki)","Lanci Frantumare. Richiede il livello 6."],["Morsa del Vento del Nord (3 ki)","Lanci Blocca Persone. Richiede il livello 6."],["Onda della Terra Tumultuosa (6 ki)","Lanci Muro di Pietra. Richiede il livello 17."],["Postura della Nebbia (4 ki)","Lanci Forma Gassosa su te stesso. Richiede il livello 11."],["Pugno dei Quattro Tuoni (2 ki)","Lanci Onda Tonante."],["Pugno dell’Aria Inviolabile (2 ki + 1 per ki extra)","Azione: una creatura entro 9 m fa un TS Forza. Se fallisce subisce 3d10 danni contundenti (+1d10 per ogni ki aggiuntivo) e puoi spingerla fino a 6 m e farla cadere prona. Se supera il TS subisce metà dei danni e non viene spinta né cade."],["Soffio dell’Inverno (6 ki)","Lanci Cono di Freddo. Richiede il livello 17."],["Spiriti della Burrasca Impetuosa (2 ki)","Lanci Folata di Vento."],["Zanne del Serpente di Fuoco (1 ki)","Quando usi l’azione di Attacco puoi spendere 1 ki: i tuoi colpi senz’armi hanno portata +3 m per quell’azione e il resto del turno, e infliggono danni da fuoco invece che contundenti. Se spendi 1 ki quando un tale attacco colpisce, infligge 1d10 danni da fuoco extra."]],"Cavaliere Mistico|Arma Vincolata":[["","Con un rito di 1 ora (anche in un riposo breve) leghi a te un’arma. Puoi legare fino a 2 armi. Non puoi essere disarmato di quell’arma; se è sullo stesso piano la richiami in mano con un’azione bonus."]],"Necromanzia|Raccolto Macabro":[["","Una volta per turno, quando uccidi una o più creature con un incantesimo di 1° livello o superiore, recuperi PF pari al doppio del livello dell’incantesimo (il triplo se è di negromanzia). Non vale per costrutti e non morti."]],"Necromanzia|Servitori Non Morti":[["","Aggiungi Animare Morti al libro incantesimi. Quando lo lanci puoi animare un cadavere o mucchio d’ossa in più. Le creature animate hanno PF massimi aumentati del livello da mago e aggiungono la competenza ai danni con le armi."]],"Necromanzia|Impervio alla Non Morte":[["","Hai resistenza ai danni necrotici e i tuoi PF massimi non possono essere ridotti."]],"Necromanzia|Comandare Non Morti":[["","Azione: un non morto entro 18 m che vedi fa un TS Carisma. Se lo supera, non puoi riprovare su di lui; se lo fallisce è amichevole e obbedisce ai tuoi comandi finché non usi di nuovo il privilegio. Se ha Intelligenza 8 o più ha vantaggio al TS; se ha Intelligenza 12 o più ripete il TS ogni ora."]],"Necromanzia|Necromante Sapiente":[["","Il tempo e il denaro per copiare nel libro incantesimi un incantesimo di negromanzia sono dimezzati."]],"Berserker|Frenesia":[["","Quando entri in ira puoi entrare in frenesia. Per la durata dell’ira puoi effettuare un singolo attacco con un’arma da mischia come azione bonus in ciascuno dei tuoi turni successivi a quello in cui l’hai attivata. Quando l’ira termina subisci un livello di indebolimento (Appendice A)."]],"Berserker|Ira Incontenibile":[["","Mentre sei in ira non puoi essere affascinato né spaventato. Se lo eri già quando entri in ira, l’effetto è sospeso finché l’ira dura."]],"Berserker|Presenza Intimidatoria":[["","Azione: scegli una creatura entro 9 m che ti vede o sente. Fa un TS Saggezza (CD 8 + competenza + mod CAR) o è spaventata da te fino alla fine del tuo prossimo turno. Nei turni successivi puoi usare un’azione per prolungare l’effetto; termina se la creatura non ti vede o si allontana oltre 18 m. Chi supera il TS è immune per 24 ore."]],"Berserker|Ritorsione":[["","Reazione: quando subisci danni da una creatura entro 1,5 m da te, puoi effettuare un attacco con un’arma da mischia contro di essa."]],"Combattente Totemico|Cercatore di Spiriti":[["","Puoi lanciare Percezione delle Bestie e Parlare con gli Animali, ma solo come rituali."]],"Combattente Totemico|Spirito Totemico":[["","Scegli uno spirito totemico: ottieni il beneficio mentre sei in ira."],["Aquila","Se non indossi armatura pesante, gli attacchi di opportunità contro di te hanno svantaggio e puoi usare Scatto come azione bonus."],["Lupo","I tuoi amici hanno vantaggio ai tiri per colpire in mischia contro creature ostili entro 1,5 m da te."],["Orso","Hai resistenza a tutti i danni tranne psichici."]],"Combattente Totemico|Aspetto della Bestia":[["","Scegli un beneficio magico:"],["Aquila","Vista eccezionale: vedi fino a 1,5 km con chiarezza; la luce fioca non impone svantaggio a Percezione."],["Lupo","Segui le tracce e ti muovi furtivamente a passo veloce; ottieni vantaggio a seguire tracce e a muoverti furtivi in viaggio."],["Orso","La tua capacità di carico raddoppia e hai vantaggio alle prove di Forza per spingere, trascinare, sollevare o spezzare oggetti."]],"Combattente Totemico|Viandante Spirituale":[["","Puoi lanciare Comunione con la Natura come rituale. Una versione spirituale di un animale che hai scelto ti appare per fornirti informazioni."]],"Combattente Totemico|Sintonia Totemica":[["","Scegli un beneficio mentre sei in ira:"],["Aquila","Hai velocità di volo pari alla tua velocità base; funziona per brevi tratti."],["Lupo","Azione bonus: butti a terra prona una creatura Grande o più piccola quando la colpisci con un attacco in mischia."],["Orso","Le creature ostili entro 1,5 m hanno svantaggio ai tiri per colpire contro bersagli diversi da te."]],"Sapienza|Parole Taglienti":[["","Reazione: quando una creatura entro 18 m che vedi effettua un tiro per colpire, una prova di caratteristica o un tiro per i danni, spendi un uso di Ispirazione Bardica e sottrai il risultato del dado dal suo tiro. La creatura è immune se non può sentirti o non può essere affascinata. Puoi decidere dopo il tiro ma prima che il DM dichiari l’esito."]],"Valore|Ispirazione in Combattimento":[["","Una creatura che ha il tuo dado di Ispirazione Bardica può tirarlo e aggiungerlo ai danni di un attacco con arma appena colpito, oppure usare una reazione quando è attaccata e aggiungerlo alla CA contro quell’attacco."]],"Conoscenza|Benedizioni della Conoscenza":[["","Impari due linguaggi a tua scelta. Ottieni competenza in due abilità tra Arcano, Natura, Religione o Storia; il tuo bonus di competenza raddoppia nelle prove effettuate con quelle abilità."]],"Conoscenza|Incanalare Divinità: Conoscenze Secolari":[["","Azione: scegli un’abilità o uno strumento. Per 10 minuti hai competenza in essa. Usa un Incanalare Divinità."]],"Conoscenza|Incanalare Divinità: Lettura del Pensiero":[["","Azione: scegli una creatura entro 18 m che vedi: TS Saggezza. Se lo supera non puoi riusare il privilegio su di essa fino a un riposo lungo. Se fallisce, per 1 minuto leggi i suoi pensieri superficiali finché è entro 18 m; in quel periodo puoi usare un’azione per terminare l’effetto e lanciare Suggestione su di essa senza slot (fallisce automaticamente il TS)."]],"Conoscenza|Incantesimi Potenti":[["","Aggiungi il tuo modificatore di Saggezza ai danni di ogni trucchetto da chierico."]],"Conoscenza|Visioni del Passato":[["","Meditando o pregando almeno 1 minuto ricevi una visione degli eventi recenti legati a un oggetto che impugni o al luogo in cui ti trovi. Puoi meditare per minuti pari al tuo punteggio di Saggezza, mantenendo la concentrazione. Si ricarica con un riposo breve o lungo."],["Lettura di Oggetti","Dopo 1 minuto apprendi come il proprietario lo ha ottenuto e perduto e l’evento recente più importante che lo ha coinvolto. Con 1 minuto in più per ogni proprietario precedente (entro un numero di giorni pari alla tua Saggezza) apprendi le stesse cose su di loro."],["Lettura del Luogo","Ricevi una visione degli eventi recenti nei dintorni (cubo di 15 m) fino a un numero di giorni pari alla tua Saggezza; ogni minuto ti rivela un evento significativo, dal più recente."]],"Guerra|Sacerdote di Guerra":[["","Quando usi l’azione di Attacco puoi effettuare un attacco con un’arma come azione bonus. Usi pari al tuo modificatore di Saggezza (minimo 1) per riposo lungo."]],"Guerra|Incanalare Divinità: Colpo Guidato":[["","Quando effettui un tiro per colpire puoi usare Incanalare Divinità per ottenere +10 al tiro. Scegli dopo aver visto il tiro, ma prima che il DM dichiari se colpisce o manca."]],"Guerra|Incanalare Divinità: Benedizione del Dio della Guerra":[["","Quando una creatura entro 9 m effettua un tiro per colpire puoi usare la reazione e Incanalare Divinità per darle +10 al tiro, dopo averlo visto e prima che il DM dichiari l’esito."]],"Guerra|Colpo Divino":[["","Una volta per turno, quando colpisci con un’arma, infliggi 1d8 danni extra dello stesso tipo di quelli dell’arma (2d8 dal livello 14)."]],"Guerra|Avatar della Battaglia":[["","Hai resistenza ai danni contundenti, perforanti e taglienti delle armi non magiche."]],"Inganno|Benedizione dell’Ingannatore":[["","Azione: tocchi una creatura consenziente diversa da te e le dai vantaggio alle prove di Destrezza (Furtività). Dura 1 ora o finché non usi di nuovo il privilegio."]],"Inganno|Incanalare Divinità: Invocare Duplicato":[["","Azione: crei un’illusione perfetta di te in uno spazio libero entro 9 m, per 1 minuto o finché perdi la concentrazione. Come azione bonus la muovi fino a 9 m (resta entro 36 m da te). Puoi lanciare incantesimi come se fossi nel suo spazio, ma con i tuoi sensi. Se tu e il duplicato siete entro 1,5 m da una creatura che lo vede, hai vantaggio ai tiri per colpire contro di essa."]],"Inganno|Incanalare Divinità: Manto di Ombre":[["","Azione: diventi invisibile fino alla fine del tuo turno successivo. Torni visibile se attacchi o lanci un incantesimo."]],"Inganno|Colpo Divino":[["","Una volta per turno, quando colpisci con un’arma, infliggi 1d8 danni da veleno extra (2d8 dal livello 14)."]],"Inganno|Duplicato Migliorato":[["","Quando usi Invocare Duplicato puoi creare fino a quattro duplicati invece di uno. Come azione bonus puoi muovere qualsiasi numero di duplicati fino a 9 m, entro 36 m da te."]],"Luce|Lampo di Interdizione":[["","Reazione, quando sei attaccato da una creatura entro 9 m che vedi: infliggi svantaggio al suo tiro per colpire. Un attaccante che non può essere accecato è immune. Usi pari al tuo modificatore di Saggezza (minimo 1) per riposo lungo."]],"Luce|Incanalare Divinità: Fulgore dell’Alba":[["","Azione, brandendo il simbolo sacro: ogni oscurità magica entro 9 m è dissolta. Ogni creatura ostile entro 9 m fa un TS Costituzione: se fallisce subisce 2d10 + livello da chierico danni radiosi, se supera la metà. Non colpisce chi ha copertura totale."]],"Luce|Lampo Migliorato":[["","Puoi usare Lampo di Interdizione anche quando una creatura entro 9 m che vedi attacca una creatura diversa da te."]],"Luce|Incantesimi Potenti":[["","Aggiungi il tuo modificatore di Saggezza ai danni di ogni trucchetto da chierico."]],"Luce|Corona di Luce":[["","Azione: attivi un’aura di luce solare che dura 1 minuto o finché la congedi con un’altra azione. Emetti luce intensa entro 18 m e fioca per altri 9 m. I nemici nella luce intensa hanno svantaggio ai TS contro incantesimi che infliggono danni da fuoco o radiosi."]],"Natura|Accolito della Natura":[["","Impari un trucchetto da druido a tua scelta e ottieni competenza in una tra Addestrare Animali, Natura o Sopravvivenza."]],"Natura|Incanalare Divinità: Charme su Animali e Vegetali":[["","Azione, brandendo il simbolo sacro: ogni bestia o creatura vegetale entro 9 m che ti vede fa un TS Saggezza. Se fallisce è affascinata per 1 minuto o finché subisce danni, ed è amichevole verso di te e le creature che designi."]],"Natura|Mitigare Elementi":[["","Quando tu o una creatura entro 9 m subite danni da acido, freddo, fulmine, fuoco o tuono, puoi usare la reazione per darle resistenza a quel tipo di danni."]],"Natura|Colpo Divino":[["","Una volta per turno, quando colpisci con un’arma, infliggi 1d8 danni extra da freddo, fulmine o fuoco a tua scelta (2d8 dal livello 14)."]],"Natura|Maestro della Natura":[["","Quando creature sono affascinate da Charme su Animali e Vegetali, con un’azione bonus nel tuo turno puoi comandare verbalmente ciascuna di esse, decidendo cosa farà nel suo prossimo turno."]],"Tempesta|Collera della Tempesta":[["","Reazione, quando una creatura entro 1,5 m che vedi ti colpisce con un attacco: fa un TS Destrezza; se fallisce subisce 2d8 danni da fulmine o tuono (a tua scelta), se supera la metà. Usi pari al tuo modificatore di Saggezza (minimo 1) per riposo lungo."]],"Tempesta|Incanalare Divinità: Collera Distruttiva":[["","Quando tiri per infliggere danni da fulmine o tuono puoi usare Incanalare Divinità per infliggere il massimo dei danni invece di tirare."]],"Tempesta|Colpo del Tuono e del Fulmine":[["","Quando infliggi danni da fulmine a una creatura di taglia Grande o inferiore, puoi anche spingerla fino a 3 m lontano da te."]],"Tempesta|Colpo Divino":[["","Una volta per turno, quando colpisci con un’arma, infliggi 1d8 danni da tuono extra (2d8 dal livello 14)."]],"Tempesta|Nato dalla Tempesta":[["","Hai una velocità di volare pari alla tua attuale velocità base a terra ogni volta che non ti trovi sottoterra o al chiuso."]],"Vita|Discepolo della Vita":[["","Quando usi un incantesimo di 1° livello o superiore per ripristinare PF, la creatura recupera PF aggiuntivi pari a 2 + il livello dell’incantesimo."]],"Vita|Incanalare Divinità: Preservare Vita":[["","Azione, brandendo il simbolo sacro: ripristini PF pari a 5 × il tuo livello da chierico, divisi tra le creature entro 9 m che scegli. Non puoi riportare una creatura oltre metà del suo massimo di PF. Non funziona su costrutti e non morti."]],"Vita|Guaritore Benedetto":[["","Quando lanci un incantesimo di 1° livello o superiore che ripristina PF a una creatura diversa da te, recuperi anche tu PF pari a 2 + il livello dell’incantesimo."]],"Vita|Colpo Divino":[["","Una volta per turno, quando colpisci con un’arma, infliggi 1d8 danni radiosi extra (2d8 dal livello 14)."]],"Vita|Guarigione Suprema":[["","Quando dovresti tirare dadi per ripristinare PF con un incantesimo, usi invece il valore massimo possibile di ogni dado (es. 2d6 = 12)."]],"Terra|Recupero Naturale":[["","Durante un riposo breve scegli quali slot spesi recuperare: il loro livello totale deve essere pari o inferiore a metà del tuo livello da druido (arrotondato per eccesso) e nessuno slot può essere di 6° livello o superiore. Non puoi riusarlo finché non completi un riposo lungo. Esempio: un druido di 4° livello recupera uno slot di 2° o due slot di 1°."]],"Terra|Incantesimi del Circolo":[["","Ai livelli 3, 5, 7 e 9 accedi agli incantesimi del circolo legati al territorio in cui sei diventato druido. Una volta ottenuto, un incantesimo del circolo è sempre preparato, non conta nel numero di incantesimi preparabili ed è considerato da druido per te. Elenco per territorio:"],["Artico","3°: blocca persone, crescita di spine · 5°: lentezza, tempesta di nevischio · 7°: libertà di movimento, tempesta di ghiaccio · 9°: comunione con la natura, cono di freddo"],["Costa","3°: immagine speculare, passo velato · 5°: camminare sull’acqua, respirare sott’acqua · 7°: controllare acqua, libertà di movimento · 9°: evoca elementale, scrutare"],["Deserto","3°: sfocatura, silenzio · 5°: creare cibo e acqua, protezione dall’energia · 7°: inaridire, terreno illusorio · 9°: muro di pietra, piaga degli insetti"],["Foresta","3°: movimenti del ragno, pelle coriacea · 5°: crescita vegetale, invocare il fulmine · 7°: divinazione, libertà di movimento · 9°: comunione con la natura, traslazione arborea"],["Montagna","3°: crescita di spine, movimenti del ragno · 5°: fondersi nella pietra, fulmine · 7°: pelle di pietra, scolpire pietra · 9°: muro di pietra, passapareti"],["Palude","3°: freccia acida di Melf, oscurità · 5°: camminare sull’acqua, nube maleodorante · 7°: libertà di movimento, localizza creatura · 9°: piaga degli insetti, scrutare"],["Prateria","3°: invisibilità, passare senza tracce · 5°: luce diurna, velocità · 7°: divinazione, libertà di movimento · 9°: piaga degli insetti, sogno"],["Underdark","3°: movimenti del ragno, ragnatela · 5°: forma gassosa, nube maleodorante · 7°: invisibilità superiore, scolpire pietra · 9°: nube mortale, piaga degli insetti"]],"Terra|Andatura sul Territorio":[["","Muoversi in terreno difficile non magico non costa movimento extra. Puoi attraversare vegetali non magici senza rallentare e senza subire danni da spine o aculei. Hai vantaggio ai TS contro vegetali creati o manipolati magicamente per ostacolare il movimento (come Intralciare)."]],"Terra|Interdizione della Natura":[["","Non puoi essere affascinato o spaventato da elementali o folletti e sei immune ai veleni e alle malattie."]],"Terra|Rifugio della Natura":[["","Quando una bestia o una creatura vegetale ti attacca, deve fare un TS Saggezza contro la CD dei tuoi incantesimi. Se fallisce, deve scegliere un bersaglio diverso, altrimenti l’attacco manca automaticamente. Se lo supera, è immune a questo effetto per 24 ore. La creatura è consapevole dell’effetto prima di attaccare."]],"Luna|Forma Selvatica da Combattimento":[["","Puoi usare Forma Selvatica come azione bonus invece che come azione. Mentre sei trasformato puoi usare un’azione bonus per spendere uno slot incantesimo e recuperare 1d8 PF per ogni livello dello slot."]],"Mistificatore Arcano|Gioco di Prestigio della Mano Magica":[["","Quando lanci Mano Magica puoi rendere la mano spettrale invisibile e farle svolgere questi compiti: riporre un oggetto impugnato in un contenitore indossato o trasportato da un’altra creatura; recuperare un oggetto da un tale contenitore; usare i tuoi arnesi da scasso per scassinare serrature e disarmare trappole a distanza. Puoi farlo senza essere notato con una prova di Destrezza (Rapidità di Mano) contrapposta a Saggezza (Percezione) della creatura. Puoi usare l’azione bonus di Azione Scaltra per controllare la mano."]],"Mistificatore Arcano|Ingannatore Versatile":[["","Come azione bonus nel tuo turno puoi designare una creatura entro 1,5 m dalla mano spettrale di Mano Magica. Hai vantaggio ai tiri per colpire contro quella creatura fino alla fine del turno."]]};
Object.assign(DET,{"Signore Fatato|Presenza Fatata": [["", "A partire dal 1° livello, il patrono ti conferisce la capacità di emanare la presenza seducente e inquietante tipica dei folletti. Con un’azione, puoi obbligare ogni creatura in un cubo con spigolo di 3 metri originato da te a effettuare un tiro salvezza su Saggezza contro la CD degli incantesimi da warlock. Le creature che falliscono il tiro salvezza sono tutte affascinate o spaventate da te (a tua scelta) fino alla fine del tuo turno successivo."], ["", "Una volta utilizzato questo privilegio, non puoi più utilizzarlo finché non completi un riposo breve o lungo."], ["Incantesimi ampliati", "1°: luminescenza, sonno · 2°: allucinazione di forza, calmare emozioni · 3°: crescita vegetale, intermittenza · 4°: dominare bestie, invisibilità superiore · 5°: dominare persone, sembrare"]], "Signore Fatato|Fuga Velata": [["", "A partire dal 6° livello, puoi svanire in uno sbuffo di nebbia in risposta a un effetto dannoso. Quando subisci danni, puoi usare la tua reazione per diventare invisibile e teletrasportarti di un massimo di 18 metri fino a uno spazio libero che tu sia in grado di vedere. Rimani invisibile fino all’inizio del tuo turno successivo o finché non attacchi o lanci un incantesimo."], ["", "Una volta utilizzato questo privilegio, non puoi più utilizzarlo finché non completi un riposo breve o lungo."]], "Signore Fatato|Difese Seducenti": [["", "A partire dal 10° livello, il patrono ti insegna come ritorcere le magie di influenza mentale dei tuoi nemici contro loro stessi. Non puoi essere affascinato e, quando un’altra creatura tenta di affascinarti, puoi usare la tua reazione per ritorcere l’effetto contro quella creatura. La creatura deve superare un tiro salvezza su Saggezza contro la CD degli incantesimi da warlock, altrimenti sarà affascinata da te per 1 minuto o finché non subisce danni."]], "Signore Fatato|Delirio Oscuro": [["", "A partire dal 14° livello, puoi trascinare una creatura in un reame illusorio. Con un’azione, scegli una creatura situata entro 18 metri da te e che tu sia in grado di vedere. Quella creatura deve effettuare un tiro salvezza su Saggezza contro la CD degli incantesimi da warlock. Se lo fallisce, diventa affascinata o spaventata da te (a tua scelta) per 1 minuto o finché la tua concentrazione non si interrompe (come se ti stessi concentrando su un incantesimo). Questo effetto termina anticipatamente se la creatura subisce danni."], ["", "Finché questa illusione non termina, la creatura crede di essersi smarrita in un reame nebbioso, il cui aspetto è deciso da te. La creatura è in grado di vedere e sentire soltanto se stessa, te e l’illusione."], ["", "Prima di utilizzare di nuovo questo privilegio, devi completare un riposo breve o lungo."]], "Immondo|Benedizione dell’Oscuro": [["", "A partire dal 1° livello, quando porti una creatura ostile a 0 punti ferita, ottieni un ammontare di punti ferita temporanei pari al tuo modificatore di Carisma + il tuo livello da warlock (fino a un minimo di 1)."], ["Incantesimi ampliati", "1°: comando, mani brucianti · 2°: cecità/sordità, raggio rovente · 3°: nube maledorante, palla di fuoco · 4°: muro di fuoco, scudo di fuoco · 5°: colpo infuocato, santificare"]], "Immondo|Fortuna dell’Oscuro": [["", "A partire dal 6° livello, puoi appellarti al tuo patrono per alterare il fato in tuo favore. Quando effettui una prova di caratteristica o un tiro salvezza, puoi utilizzare questo privilegio per aggiungere un d10 al tuo tiro. Puoi farlo dopo aver visto il tiro iniziale, ma prima che qualsiasi effetto del tiro sia applicato."], ["", "Una volta utilizzato questo privilegio, non puoi più utilizzarlo finché non completi un riposo breve o lungo."]], "Immondo|Resilienza Immonda": [["", "A partire dal 10° livello, puoi scegliere un tipo di danno quando completi un riposo breve o lungo. Ottieni resistenza a quel tipo di danno finché non ne scegli uno diverso tramite questo privilegio. I danni delle armi magiche o delle armi argentate ignorano questa resistenza."]], "Immondo|Scagliare all’Inferno": [["", "A partire dal 14° livello, quando colpisci una creatura con un attacco con un’arma, puoi utilizzare questo privilegio per trascinare istantaneamente il bersaglio sui piani inferiori. La creatura scompare e sfreccia attraverso un territorio da incubo."], ["", "Alla fine del turno successivo del warlock, il bersaglio torna nello spazio che occupava in precedenza, o nello spazio libero più vicino. Se il bersaglio non è un immondo, subisce 10d10 danni psichici in quanto resta sconvolto da questa esperienza terrificante."], ["", "Una volta utilizzato questo privilegio, non puoi più utilizzarlo finché non completi un riposo lungo."]], "Grande Antico|Mente Risvegliata": [["", "A partire dal 1° livello, puoi usare le tue conoscenze aliene per sfiorare le menti delle altre creature. Puoi parlare telepaticamente con qualsiasi creatura che si trovi entro 9 metri da te e che tu sia in grado di vedere. Non è necessario che condivida un linguaggio con la creatura affinché quest’ultima capisca ciò che enunci telepaticamente, ma la creatura deve essere in grado di capire almeno un linguaggio."], ["Incantesimi ampliati", "1°: risata incontenibile di Tasha, sussurri dissonanti · 2°: allucinazione di forza, individuazione dei pensieri · 3°: chiaroveggenza, inviare · 4°: dominare bestie, tentacoli neri di Evard · 5°: dominare persone, telecinesi"]], "Grande Antico|Interdizione Entropica": [["", "Al 6° livello, impari a proteggerti magicamente dagli attacchi e a trasformare il colpo fallito di un nemico in un colpo di fortuna per te. Quando una creatura effettua un tiro per colpire contro di te, puoi usare la tua reazione per infliggere svantaggio a quel tiro. Se l’attacco lo manca, il successivo tiro per colpire del warlock contro la creatura dispone di vantaggio purché tu lo effettui entro la fine del tuo turno successivo."], ["", "Una volta utilizzato questo privilegio, non puoi più utilizzarlo finché non completi un riposo breve o lungo."]], "Grande Antico|Scudo del Pensiero": [["", "A partire dal 10° livello, i tuoi pensieri non possono essere letti tramite telepatia o mezzi di altro tipo, a meno che tu non lo consenta. Inoltre, disponi di resistenza ai danni psichici, e ogni volta che una creatura ti infligge danni psichici, essa subisce lo stesso ammontare di danni."]], "Grande Antico|Creare Servitore": [["", "Al 14° livello, ottieni la capacità di contaminare la mente di un umanoide con la magia aliena del tuo patrono. Puoi usare la tua azione per toccare un umanoide incapacitato. Quella creatura diventa affascinata da te finché su di essa non viene lanciato un incantesimo rimuovi maledizione, la condizione non viene rimossa, o tu non utilizzi di nuovo questo privilegio."], ["", "Puoi comunicare telepaticamente con la creatura affascinata fintanto che entrambi vi trovate sullo stesso piano di esistenza."]], "Sapienza|Competenze Bonus": [["", "Quando un bardo si unisce al Collegio della Sapienza al 3° livello, ottiene competenza in tre abilità a sua scelta."]], "Sapienza|Segreti Magici Aggiuntivi": [["", "Al 6° livello, impari due incantesimi a tua scelta da qualsiasi classe. Ogni incantesimo scelto deve essere di un livello che tu sia in grado di lanciare, come indicato dalla tabella “Bardo”, oppure deve essere un trucchetto. Gli incantesimi scelti contano come incantesimi da bardo, ma non contano al fine di determinare il numero di incantesimi da bardo conosciuti."]], "Sapienza|Abilità Impareggiabile": [["", "A partire dal 14° livello, quando effettui una prova di caratteristica, puoi spendere un utilizzo di Ispirazione Bardica. Se lo fai, tira un dado di Ispirazione Bardica e aggiungi il risultato ottenuto alla tua prova di caratteristica. Puoi scegliere di farlo dopo aver tirato il dado per la prova di caratteristica, ma prima che il DM dichiari se la prova abbia avuto successo o meno."]], "Valore|Competenze Bonus": [["", "Quando un bardo si unisce al Collegio del Valore al 3° livello, ottiene competenza nelle armature medie, negli scudi e nelle armi da guerra."]], "Valore|Attacco Extra": [["", "A partire dal 6° livello, puoi attaccare due volte anziché una, ogni volta che effettui l’azione di Attacco nel tuo turno."]], "Valore|Magia da Battaglia": [["", "Al 14° livello, hai padroneggiato l’arte di intessere incantesimi e di utilizzare le armi in un’unica pratica armonizzata. Quando usi la tua azione per lanciare un incantesimo da bardo, puoi effettuare un attacco con un’arma come azione bonus."]], "Luna|Forme del Circolo": [["", "I riti del circolo conferiscono al druido la capacità di assumere forme bestiali più pericolose. A partire dal 2° livello, il druido può utilizzare Forma Selvatica per trasformarsi in una bestia con un grado di sfida massimo pari a 1 (deve ignorare la colonna “GS Max” nella tabella “Forme Bestiali” ma deve rispettare le altre limitazioni riportate in quella tabella)."], ["", "A partire dal 6° livello, può trasformarsi in una bestia con un grado di sfida pari al proprio livello da druido diviso 3, arrotondato per difetto."]], "Luna|Colpo Primordiale": [["", "A partire dal 6° livello, gli attacchi del druido in forma bestiale sono considerati magici al fine di oltrepassare la resistenza e l’immunità agli attacchi e ai danni non magici."]], "Luna|Forma Selvatica Elementale": [["", "Al 10° livello, il druido può spendere due utilizzi di Forma Selvatica simultaneamente per trasformarsi in un elementale dell’acqua, un elementale dell’aria, un elementale del fuoco o un elementale della terra."]], "Luna|Mille Forme": [["", "Al 14° livello, il druido ha imparato a usare la magia per alterare la sua forma fisica in modo più sottile e può lanciare l’incantesimo alterare se stesso a volontà."]], "Furfante|Mani Veloci": [["", "A partire dal 3° livello, puoi usare l’azione bonus conferitati da Azione Scaltra per effettuare una prova di Destrezza (Rapidità di Mano), usare i tuoi arnesi da scasso per disattivare una trappola o scassinare una serratura, o effettuare un’azione di Usare un Oggetto."]], "Furfante|Lavoro al Secondo Piano": [["", "Quando scegli questo archetipo al 3° livello, diventi in grado di scalare più velocemente rispetto al normale; scalare non ti richiede più un movimento extra."], ["", "Inoltre, quando effettui un salto in lungo con rincorsa, la distanza che copri aumenta di 30 cm per ogni punto del tuo modificatore di Destrezza."]], "Furfante|Furtività Suprema": [["", "A partire dal 9° livello, hai vantaggio a una prova di Destrezza (Furtività) se ti muovi non più della metà della tua velocità in quello stesso turno."]], "Furfante|Usare Oggetto Magico": [["", "Giunto al 13° livello, hai imparato come funziona la magia quanto basta da improvvisare un utilizzo di quegli oggetti che non sono destinati a te. Ignori tutti i requisiti di classe, razza e livello quando usi gli oggetti magici."]], "Furfante|Riflessi da Furfante": [["", "Una volta giunto al 17° livello, diventi particolarmente abile nel tendere imboscate e nello sfuggire rapidamente ai pericoli. Puoi effettuare due turni durante il primo round di ogni combattimento. Effettui il tuo primo turno alla tua normale iniziativa e il secondo turno alla tua iniziativa meno 10. Non puoi utilizzare questo privilegio se sei sorpreso."]], "Assassino|Competenze Bonus": [["", "Quando scegli questo archetipo al 3° livello, ottieni competenza nei trucchi per il camuffamento e nelle sostanze da avvelenatore."]], "Assassino|Assassinare": [["", "A partire dal 3° livello, risulti particolarmente letale quando cogli i tuoi nemici alla sprovvista e disponi di vantaggio ai tiri per colpire contro qualsiasi creatura che non abbia ancora effettuato un turno in combattimento. Inoltre, ogni colpo da te messo a segno contro una creatura sorpresa è considerato un colpo critico."]], "Assassino|Maestro Infiltrato": [["", "A partire dal 9° livello, puoi creare infallibilmente delle identità fittizie per te stesso. Devi utilizzare sette giorni e 25 mo per stabilire la storia, la professione e le affiliazioni dell’identità in questione. Non puoi stabilire un’identità che appartenga a qualcun altro. Potresti per esempio procurarti degli abiti adeguati, una lettera di presentazione e un certificato apparentemente legittimo per spacciarti per un membro di un casato mercantile di una remota città, in modo da potersi insinuare nella cerchia delle frequentazioni di altri ricchi mercanti."], ["", "Da allora in poi, quando adotti la nuova identità come travestimento, le altre creature ti riterranno quella persona finché non offrirai loro dei motivi validi per dubitare di te."]], "Assassino|Impostore": [["", "Al 13° livello, ottieni la capacità di imitare infallibilmente la parlata, la calligrafia e il modo di fare di un’altra persona. Devi trascorrere almeno tre ore a studiare queste tre componenti comportamentali del soggetto, ascoltandolo parlare, studiando la sua calligrafia e osservandone i modi di fare."], ["", "L’inganno è impossibile da discernere per un osservatore casuale. Se una creatura sospettosa ha ragione di credere che ci sia qualcosa che non va, hai vantaggio a qualsiasi prova di Carisma (Inganno) da te effettuata per evitare di essere scoperto."]], "Assassino|Colpo Mortale": [["", "A partire dal 17° livello, diventi un maestro nell’impartire la morte istantaneamente. Quando attacchi e colpisci una creatura sorpresa, quella creatura deve effettuare un tiro salvezza su Costituzione (CD 8 + il tuo modificatore di Destrezza + il tuo bonus di competenza). Se lo fallisce, raddoppi i danni del tuo attacco contro di essa."]], "Mistificatore Arcano|Incantesimi": [["", "Quando arrivi al 3° livello, ottieni la capacità di lanciare incantesimi. Vedi il capitolo 10 per le regole generali relative agli incantesimi e il capitolo 11 per la lista degli incantesimi da mago."], ["Trucchetti", "Impari tre trucchetti: mano magica e altri due trucchetti a tua scelta dalla lista degli incantesimi da mago. Apprendi un trucchetto da mago aggiuntivo a tua scelta al 10° livello."], ["Slot incantesimo", "Ti serve uno slot di livello pari o superiore a quello dell’incantesimo. Slot di 1° livello: 2 al 3° livello, 3 al 4°–6°, 4 dal 7°. Slot di 2°: 2 al 7°–9°, 3 dal 10°. Slot di 3°: 2 al 13°–15°, 3 dal 16°. Slot di 4°: 1 al 19° e al 20°. Recuperi tutti gli slot spesi con un riposo lungo."], ["Incantesimi conosciuti", "Conosci 3 incantesimi da mago di 1° livello a tua scelta, due dei quali devono essere di ammaliamento o illusione. Totale conosciuti: 3 (3°), 4 (4°), 5 (7°), 6 (8°), 7 (10°), 8 (11°), 9 (13°), 10 (14°), 11 (16°), 12 (19°), 13 (20°). Ogni nuovo incantesimo deve essere di ammaliamento o illusione e di un livello di cui possiedi slot; quelli appresi all’8°, 14° e 20° livello possono appartenere a qualsiasi scuola. A ogni nuovo livello puoi sostituire uno degli incantesimi conosciuti."], ["Caratteristica da incantatore", "Intelligenza. CD del tiro salvezza = 8 + bonus di competenza + modificatore di Intelligenza; modificatore di attacco = bonus di competenza + modificatore di Intelligenza."]], "Mistificatore Arcano|Imboscata Magica": [["", "A partire dal 9° livello, se sei nascosto da una creatura quando lanci un incantesimo su di essa, quella creatura subisce svantaggio a ogni tiro salvezza che effettua contro quell’incantesimo in quel turno."]], "Mistificatore Arcano|Ladro di Incantesimi": [["", "Al 17° livello, ottieni la capacità di rubare magicamente a un altro incantatore le conoscenze richieste per lanciare un incantesimo."], ["", "Immediatamente dopo che una creatura ha lanciato un incantesimo che bersaglia te o ti include nella sua area di effetto, puoi usare la tua reazione per obbligare la creatura a effettuare un tiro salvezza con il modificatore della caratteristica da incantatore della creatura. La CD è pari alla CD del tiro salvezza dei tuoi incantesimi. Se lo fallisce, neghi l’effetto dell’incantesimo contro di te e ruba la conoscenza dell’incantesimo, se il livello di quell’incantesimo è pari almeno al 1° ed è un livello che tu sia in grado di lanciare (non è necessario che si tratti di un incantesimo da mago). Per le 8 ore successive, conosci l’incantesimo e puoi lanciarlo usando i tuoi slot incantesimo. La creatura non può lanciare quell’incantesimo finché le 8 ore non sono trascorse."], ["", "Una volta utilizzato questo privilegio, non puoi più utilizzarlo finché non completi un riposo lungo."]]});

async function shrink(file){
  const bm=await createImageBitmap(file),k=Math.min(1,800/Math.max(bm.width,bm.height));
  const cv=document.createElement("canvas");cv.width=Math.round(bm.width*k);cv.height=Math.round(bm.height*k);
  cv.getContext("2d").drawImage(bm,0,0,cv.width,cv.height);
  return{d:cv.toDataURL("image/jpeg",.75),w:cv.width,h:cv.height};
}
async function shrinkSq(file){
  const bm=await createImageBitmap(file),m=Math.min(bm.width,bm.height),N=Math.min(360,m);
  const cv=document.createElement("canvas");cv.width=N;cv.height=N;
  cv.getContext("2d").drawImage(bm,(bm.width-m)/2,(bm.height-m)/4>0?Math.max(0,(bm.height-m)/4):0,m,m,0,0,N,N);
  return cv.toDataURL("image/jpeg",.82);
}

async function cloudBoot(){

  const{u,f,auth,db}=CLOUD.fb;CLOUD.booted=true;
  u.onAuthStateChanged(auth,async user=>{
    CLOUD.ready=true;
    if(VISTA){if(!user){document.getElementById("app").replaceChildren(h("div",{class:"list"},h("h2",{},"Accedi prima come master"),h("p",{class:"status"},"Apri il Diario in un’altra scheda, entra con l’account del master e poi riapri questa scheda.")));return}

      f.onSnapshot(f.collection(db,"campaign","main","cards"),snap=>{CLOUD.cards=[];snap.forEach(d=>CLOUD.cards.push(Object.assign({id:d.id},d.data())));if(window.vistaBar){try{const v=JSON.parse(localStorage.getItem("dnd-vista-"+VISTA)||"null");const c=CLOUD.cards.find(x=>x.id===VISTA);if(v&&c&&v.who!==c.ownerName){v.who=c.ownerName;localStorage.setItem("dnd-vista-"+VISTA,JSON.stringify(v));vistaBar()}}catch(e){}}},()=>{});
      return}
    if(!user){cloudStop();CLOUD.user=null;sel=null;loadLocal();render();return}
    CLOUD.user=user;try{localStorage.setItem("dnd-last-uid",user.uid)}catch(e){}

async function cloudAuth(name,pw,isNew){const{u,f,auth,db}=await cloudLoad();const slug=cloudSlug(name);
