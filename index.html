<!DOCTYPE html>
<html lang="it">
<head>

<title>Diario di campagna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;700&family=Alegreya+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#eceee4;--panel:#fbfbf6;--ink:#1d2b2a;--mute:#5c6b67;--line:#c8d0bf;--acc:#6e2a38;--acc-ink:#fff;--brass:#8a6c1f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#131b1b;--panel:#1c2727;--ink:#e6e9df;--mute:#97a49f;--line:#2f3e3d;--acc:#d98a9a;--acc-ink:#1a1010;--brass:#d0b25a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#131b1b;--panel:#1c2727;--ink:#e6e9df;--mute:#97a49f;--line:#2f3e3d;--acc:#d98a9a;--acc-ink:#1a1010;--brass:#d0b25a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Alegreya Sans",system-ui,sans-serif}
h1,h2,h3{font-family:Alegreya,Georgia,serif;margin:0;line-height:1.15}
header{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;padding:20px 20px 0;max-width:1000px;margin:0 auto}
h1{font-size:2rem}
.sub{color:var(--mute);font-size:.9rem;flex-basis:100%}
nav{display:flex;gap:4px;margin-left:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;font:inherit;font-weight:500;color:var(--mute);padding:6px 10px;cursor:pointer}
nav button[aria-selected=true]{color:var(--ink);border-color:var(--brass)}
main{max-width:1000px;margin:0 auto;padding:16px 20px 60px;display:grid;gap:20px;align-items:start}
@media(min-width:760px){main.two{grid-template-columns:250px 1fr}}
button,input,textarea,select{font:inherit;color:inherit}
.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn.ghost{background:none;color:var(--mute);border:1px solid var(--line)}
.btn.danger{color:var(--acc);border-color:var(--acc)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.list{display:flex;flex-direction:column;gap:8px}
.rowc{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:stretch}
.item{display:flex;gap:10px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer;min-width:0}
.item[aria-current=true]{border-color:var(--brass);box-shadow:inset 4px 0 0 var(--brass)}
.item b{font-family:Alegreya,serif;font-size:1.15rem;display:block}
.item span{color:var(--mute);font-size:.9rem}
.th{width:38px;height:38px;border-radius:50%;object-fit:cover;flex:none;background:var(--line)}
.sheet,.note{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px;display:grid;gap:14px}
label{display:grid;gap:3px;color:var(--mute);font-size:.9rem}
input,textarea,select{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:7px 9px;width:100%;color:var(--ink)}
textarea{min-height:110px;resize:vertical;line-height:1.5}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.ritr{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ritr .pic{width:104px;height:104px;border-radius:50%;border:3px solid var(--brass);overflow:hidden;display:grid;place-items:center;background:var(--panel);cursor:pointer;padding:0;color:var(--brass);box-shadow:0 0 0 3px var(--panel),0 0 0 4px color-mix(in srgb,var(--brass) 55%,transparent)}
.ritr .pic img{width:100%;height:100%;object-fit:cover;display:block}
.ritr .pic .ic{width:48px;height:48px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center;display:grid;gap:2px}
.stat input{text-align:center;font-family:Alegreya,serif;font-weight:700}
.stat .t{font-family:Alegreya,serif;font-size:1.6rem;font-weight:700}
.stat .m{font-family:Alegreya,serif;font-size:1.2rem;font-weight:700;color:var(--brass)}
.stat small{color:var(--mute);min-height:1.2em}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:.95rem}
.sk{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:2px 16px}
.sk label{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:1rem}
.sk input{width:auto}
.sk b{margin-left:auto;font-family:Alegreya,serif}
.link{display:grid;grid-template-columns:1fr 1.6fr auto auto;gap:6px;align-items:center}
@media(max-width:560px){.link{grid-template-columns:1fr 1fr}}
.link a{color:var(--acc);font-weight:500}
.gal{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px}
.gal figure{margin:0;display:grid;gap:4px;width:140px}
.gal img{width:140px;height:140px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.slotrow{display:flex;gap:8px;align-items:center;margin:4px 0;flex-wrap:wrap}
.slotrow span{min-width:170px}
.pip{width:24px;height:24px;border-radius:50%;border:2px solid var(--brass);background:var(--brass);cursor:pointer;padding:0}
.pip[aria-pressed=true]{background:none}
.meter{position:relative;display:flex;height:16px}
.zone{opacity:.6}.zone.g{background:#4f8a5b}.zone.y{background:#c08a2a}.zone.r{background:#b2483c}
.zone:nth-child(1){border-radius:8px 0 0 8px}.zone:nth-child(3){border-radius:0 8px 8px 0}
.mark{position:absolute;top:-4px;bottom:-4px;width:4px;background:var(--ink);border-radius:2px;transform:translateX(-2px)}
.verdict{font-weight:500}
.irow{display:grid;grid-template-columns:1fr 70px 84px 90px auto;gap:6px;align-items:center}
@media(max-width:560px){.irow{grid-template-columns:1fr 60px 76px}}
.eq{display:grid;grid-template-columns:1fr 90px 1fr;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px}
.hero{grid-column:2;grid-row:1/3;font-size:64px;text-align:center}
.slot{display:grid;gap:3px;justify-items:center;text-align:center;border:1px dashed var(--brass);border-radius:8px;padding:8px;background:var(--panel)}
.slot .ico{font-size:28px}
@media(max-width:560px){.eq{grid-template-columns:1fr 1fr}.hero{grid-column:1/3;grid-row:auto}}
.feat{display:grid;grid-template-columns:84px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.feat b{font-family:Alegreya,serif}.feat.now b{color:var(--brass)}
summary{cursor:pointer;font-family:Alegreya,serif;font-size:1.3rem}
main{padding-bottom:110px}
#bnav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
#bnav[hidden]{display:none}
#bnav button{flex:1;background:none;border:0;padding:8px 4px;color:var(--mute);font:inherit;font-size:.8rem;cursor:pointer;display:grid;justify-items:center;gap:2px}
#bnav button[aria-current=true]{color:var(--brass);font-weight:700}
#bnav .ni{font-size:1.5rem;line-height:1}
.resc{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:8px;background:var(--panel)}
.rbar{height:12px;border-radius:6px;background:var(--line);overflow:hidden}.rbar i{display:block;height:100%;background:var(--brass)}
.fbtn{background:none;border:0;border-bottom:1px dashed var(--brass);padding:0;color:var(--ink);font:inherit;cursor:pointer}
.chip.fbtn{border:1px solid var(--line);padding:3px 12px;border-radius:999px}
.qbox{display:grid;gap:3px;justify-items:center}.qrow{display:flex;gap:4px;align-items:center}.qrow input{width:4.2em;text-align:center}.qrow .btn{padding:4px 8px;min-width:0}
.cbl{display:flex;gap:6px;align-items:center;font-size:.85rem;color:var(--ink)}.cbl input{width:auto}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal[hidden]{display:none}
.acct{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem}.acct b{color:var(--brass)}.acct .grow{flex:1}
.htabs{display:grid;grid-template-columns:1fr 1fr;gap:6px}.htabs button[aria-current="true"]{background:var(--brass);color:var(--panel);border-color:var(--brass)}
.login label{display:grid;gap:4px}.login input{font-size:1.05rem}
.ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.ccard{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:start;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--ink);font:inherit}
.ccard.own{border-color:var(--brass)}button.ccard{cursor:pointer}
.ccard .cimg{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--line);border:2px solid var(--brass)}
.ccard .ci{display:grid;gap:3px;min-width:0}.ccard small{color:var(--mute)}
.hpb{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.hpb i{display:block;height:100%}
.cchips{display:flex;gap:4px;flex-wrap:wrap}.cchips span{font-size:.75rem;border:1px solid var(--line);border-radius:999px;padding:1px 7px}
.owner{font-size:.85rem;color:var(--mute);margin:8px 0 0}
.vista header,.vista #bk,.cloud #bk{display:none!important}
#vbar{position:sticky;top:0;z-index:40;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--brass);padding:8px 12px;font-size:.9rem}
#vbar b{color:var(--brass)}
.tdot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--mute);margin-right:6px;vertical-align:middle}
.tdot.on{background:#3fa66a;box-shadow:0 0 0 3px rgba(63,166,106,.25)}
.tavcode{font:700 1.8rem/1.2 ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase;text-align:center;width:100%}
#tavtoast{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:80;background:var(--panel);color:var(--ink);border:1px solid var(--brass);border-radius:10px;padding:10px 14px;box-shadow:0 6px 24px rgba(0,0,0,.35);max-width:90vw;font-weight:600}
#tavtoast[hidden]{display:none}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;max-width:520px;width:100%;max-height:80vh;overflow:auto;padding:18px;display:grid;gap:10px}
.mbox p{margin:0}
.status{color:var(--mute);font-size:.85rem;min-height:1.2em}
.empty{color:var(--mute);padding:20px;border:1px dashed var(--line);border-radius:8px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar .grow{flex:1;min-width:140px}
.cover{display:block;width:100%;height:min(52vw,300px);object-fit:cover;object-position:50% 25%;border-radius:10px;border:1px solid var(--line)}
[hidden]{display:none!important}
.vit{position:sticky;top:0;z-index:15;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:8px 0;display:grid;gap:6px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.vit .r{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.vit .big{font-weight:700;font-size:1.05rem}
.vit .btn{padding:2px 10px;min-height:0;font-size:.9rem}
.vit .vc{display:flex;gap:4px;flex-wrap:wrap}.vit .vc:empty{display:none}
.vit .chip{font-size:.8rem;padding:1px 8px}

.ic{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em;flex:none}
.ni .ic{width:1.55rem;height:1.55rem}
.btn .ic{margin-right:4px}
.vit .big{display:inline-flex;align-items:center;gap:5px}
.vit .big .ic{color:var(--acc)}
/* equipaggiamento: chiaro = pergamena (A), scuro = medaglioni (B) */
.eq{align-items:stretch;background:var(--panel);border:1px solid var(--brass);border-radius:10px;padding:16px;box-shadow:inset 0 0 38px color-mix(in srgb,var(--brass) 16%,transparent)}
.slot{border:1.5px solid var(--brass);border-radius:4px;background:color-mix(in srgb,var(--panel) 65%,var(--bg));position:relative;color:var(--acc);padding:12px 8px 10px}
.slot:before,.slot:after{content:"❖";position:absolute;left:50%;transform:translateX(-50%);font-size:9px;line-height:1;color:var(--brass);background:var(--panel);padding:0 5px;top:-6px}
.slot:after{top:auto;bottom:-6px}
.slot small{color:var(--brass);text-transform:uppercase;letter-spacing:.05em;font-size:.72rem}
.slot .ico{font-size:inherit}
.slot .ring{display:grid;place-items:center;width:44px;height:44px}
.slot .ring .ic{width:34px;height:34px;stroke-width:1.5}
.slot select{font-size:.88rem;text-overflow:ellipsis}
@media(max-width:560px){.eq .hero{order:-1;grid-column:1/3;grid-row:auto}.hero .ic{width:64px;height:64px}}
.hero{color:var(--brass);opacity:.55;display:grid;place-items:center}
.hero .ic{width:72px;height:96px;stroke-width:1.1}
:root[data-mode="dark"] .eq{box-shadow:none}
:root[data-mode="dark"] .slot{border:0;background:none;padding:6px 4px}
:root[data-mode="dark"] .slot:before,:root[data-mode="dark"] .slot:after{display:none}
:root[data-mode="dark"] .slot .ring{width:64px;height:64px;border-radius:50%;border:2px solid var(--brass);box-shadow:0 0 0 3px var(--panel),0 0 0 4px color-mix(in srgb,var(--brass) 60%,transparent);color:var(--brass);background:radial-gradient(circle,color-mix(in srgb,var(--panel) 70%,var(--bg)),var(--bg))}
:root[data-mode="dark"] .slot .ring .ic{width:32px;height:32px}
:root[data-mode="dark"] .slot small{color:var(--mute)}
/* aspetto */
.sw{display:grid;gap:4px;justify-items:center;background:none;border:2px solid transparent;border-radius:10px;padding:4px;cursor:pointer;color:var(--ink);font-size:.78rem}
.sw i{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);display:block}
.sw[aria-pressed=true]{border-color:var(--brass)}
.swr{display:flex;gap:6px;flex-wrap:wrap}
.cpk{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--mute)}
.cpk input{width:44px;height:34px;padding:0;border:1px solid var(--line);background:none}
.themebtn .ic{width:20px;height:20px}
.bkb .ic{color:var(--brass)}
.themebtn{position:absolute;top:12px;right:14px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--mute);cursor:pointer;font-size:1.1rem;line-height:1;padding:0;opacity:.85}
.themebtn:hover{opacity:1}
header{position:relative;padding-right:56px}
#bk{max-width:1000px;margin:10px auto 0;padding:0 20px}
.bkb{background:var(--panel);border:1px solid var(--brass);border-radius:8px;padding:10px 12px;display:grid;gap:8px;font-size:.95rem}
.bkb p{margin:0}
</style>

};

const AB=["FOR","DES","COS","INT","SAG","CAR"];

// Dati dal Manuale del giocatore 5e (cap. 2 Razze, cap. 3 Classi, cap. 4 Background, cap. 7 Caratteristiche)
const R={Elfo:{v:9,b:{DES:2},s:{"Elfo alto":{b:{INT:1}},"Elfo dei boschi":{b:{SAG:1},v:10.5},"Elfo oscuro (drow)":{b:{CAR:1}}}},

 bersaglio ha resistenza ai danni contundenti, perforanti e taglienti non magici."],"Tempesta di Ghiaccio":["Invocazione",4,"1 azione","90 m","Istantanea","DES","Grandine in un cilindro: 2d8 contundenti + 4d6 freddo; metà con TS superato; il terreno diventa difficile."],"Comunione con la Natura":["Divinazione",5,"1 minuto (rituale)","Incantatore","Istantanea","—","Ottieni tre informazioni sul territorio circostante (acqua, creature, piante, ecc.)."],"Traslazione Arborea":["Evocazione",5,"1 azione","Incantatore","Concentrazione, 1 minuto","—","Entri in un albero ed esci da un altro albero dello stesso tipo entro grande distanza."],"Anatema":["Ammaliamento",1,"1 azione","9 m","Concentrazione, 1 minuto","CAR","Fino a tre bersagli sottraggono 1d4 ai tiri per colpire e ai tiri salvezza."],"Marchio del Cacciatore":["Divinazione",1,"1 azione bonus","27 m","Concentrazione, 1 ora","—","Il bersaglio marchiato subisce 1d6 danni extra dai tuoi attacchi con arma ed è più facile da trovare."],"Blocca Persone":["Ammaliamento",2,"1 azione","18 m","Concentrazione, 1 minuto","SAG","Un umanoide resta paralizzato; ripete il TS alla fine di ogni suo turno."],"Velocità":["Trasmutazione",3,"1 azione","9 m","Concentrazione, 1 minuto","—","Il bersaglio ha velocità doppia, +2 CA, vantaggio ai TS di Destrezza e un’azione extra limitata; alla fine è affaticato per un turno."],"Esilio":["Abiurazione",4,"1 azione","18 m","Concentrazione, 1 minuto","CAR","Il bersaglio viene mandato su un altro piano; se l’incantesimo dura l’intera durata, le creature extraplanari non tornano."],"Porta Dimensionale":["Evocazione",4,"1 azione","150 m","Istantanea","—","Ti teletrasporti in un punto entro gittata, portando con te una creatura consenziente."],"Blocca Mostri":["Ammaliamento",5,"1 azione","27 m","Concentrazione, 1 minuto","SAG","Come Blocca Persone, ma funziona su qualsiasi creatura."],"Scrutare":["Divinazione",5,"10 minuti","Incantatore","Concentrazione, 10 minuti","SAG","Spii una creatura specifica a distanza tramite un sensore magico."]},DESC={"Forma Selvatica migliorata":"Puoi trasformarti in bestie più potenti: dal livello 4 anche con velocità di nuotare (GS massimo 1/2), dal livello 8 anche con velocità di volare (GS massimo 1). Il GS massimo e la durata sono quelli della tabella della Forma Selvatica.","Maestro dell'Occulto":"Meditando 1 minuto (riposo breve) puoi recuperare tutti gli slot di Magia del Patto spesi tra riposi brevi. Si ricarica con un riposo lungo.","Aumento dei Punteggi di Caratteristica":"Ricevi 2 punti da distribuire tra i punteggi (massimo 20): scrivili in “Aumenti di livello”.","Incantesimi":"Lanci incantesimi usando gli slot. La caratteristica da incantatore è Intelligenza (mago), Carisma (stregone, paladino, bardo, warlock) o Saggezza (chierico, druido, ranger).","Attacco Extra":"Con l’azione di Attacco puoi attaccare due volte invece di una (il guerriero ne ottiene di più ai livelli 11 e 20).","Elusione":"Nei TS di Destrezza per dimezzare i danni, con successo non subisci danni e con fallimento ne subisci la metà.","Stile di Combattimento":"Scegli uno stile di combattimento: vedi la sezione dedicata sopra.","Recuperare Energie":"Azione bonus: recuperi 1d10 + livello da guerriero PF. Si ricarica con un riposo breve o lungo.","Azione Impetuosa":"Nel tuo turno compi un’azione aggiuntiva. Si ricarica con un riposo breve o lungo (2 usi dal liv. 17, uno per turno).","Archetipo Marziale":"Al liv. 3 scegli la sottoclasse del guerriero.","Indomito":"Ripeti un tiro salvezza fallito e usi il nuovo risultato. Si ricarica con un riposo lungo.","Recupero Arcano":"Dopo un riposo breve recuperi slot con livelli totali pari a metà del livello da mago (per eccesso), nessuno di 6° o più. Una volta al giorno.","Tradizione Arcana":"Al liv. 2 scegli la scuola di magia.","Maestria negli Incantesimi":"Lanci a volontà, senza slot e al livello base, un incantesimo di 1° e uno di 2° livello del tuo libro.","Incantesimi Personali":"Due incantesimi di 3° livello sono sempre preparati e lanciabili una volta per riposo breve senza slot.","Origine Stregonesca":"Al liv. 1 scegli la fonte della tua magia.","Fonte di Magia":"Hai punti stregoneria pari al livello da stregone: converti slot in punti e viceversa.","Metamagia":"Spendi punti stregoneria per plasmare gli incantesimi: ne impari due al liv. 3, una al 10, una al 17. Di regola usi una sola opzione per incantesimo.","Ripristino Stregonesco":"Con un riposo breve recuperi 4 punti stregoneria.","Percezione del Divino":"Azione: individui celestiali, immondi e non morti entro 18 m. Usi 1 + mod CAR volte per riposo lungo.","Imposizione delle Mani":"Riserva di PF pari a 5 × livello da paladino: con un’azione curi toccando, oppure spendi 5 PF per curare malattia o veleno.","Punizione Divina":"Dopo un colpo in mischia spendi uno slot: 2d8 radiosi (+1d8 per livello di slot oltre il 1°, +1d8 contro immondi e non morti, massimo 5d8).","Salute Divina":"Sei immune alle malattie.","Giuramento Sacro":"Al liv. 3 scegli il tuo giuramento.","Aura di Protezione":"Tu e gli alleati entro 3 m aggiungete il tuo mod CAR (minimo +1) ai tiri salvezza (9 m dal liv. 18).","Aura di Coraggio":"Tu e gli alleati entro 3 m non potete essere spaventati (9 m dal liv. 18).","Punizione Divina Migliorata":"Tutti i tuoi colpi in mischia con arma infliggono +1d8 danni radiosi.","Tocco Purificatore":"Azione: termini un incantesimo su di te o su una creatura consenziente. Usi mod CAR volte per riposo lungo.","Aure Migliorate":"Le aure del paladino arrivano a 9 m.","Nemico Prescelto":"Scegli un tipo di nemico: vantaggio per rintracciarlo e ricordare informazioni su di esso; impari un linguaggio.","Esploratore Nato":"Scegli un terreno prediletto: benefici di viaggio, esplorazione e ricerca di cibo.","Archetipo Ranger":"Al liv. 3 scegli la sottoclasse del ranger.","Consapevolezza Primordiale":"Spendi uno slot per percepire la presenza di certi tipi di creature nelle vicinanze.","Andatura sul Territorio":"Il terreno difficile non vegetale non ti rallenta e le piante non ti ostacolano.","Nascondersi in Piena Vista":"Con 1 minuto ti mimetizzi: +10 a Furtività finché non ti muovi o agisci.","Svanire":"Nascondersi è un’azione bonus; non puoi essere seguito con mezzi non magici.","Sensi Ferini":"Attaccare creature che non vedi non ti dà svantaggio e conosci la loro posizione entro 9 m.","Sterminatore di Nemici":"Una volta per turno aggiungi il mod SAG a un tiro per colpire o per i danni contro il tuo nemico prescelto.","Nemico Prescelto Migliorato":"Scegli un ulteriore tipo di nemico prescelto.","Esploratore Nato Migliorato":"Scegli un ulteriore terreno prediletto.","Difesa Senza Armatura":"Senza armatura né scudo la tua CA è 10 + mod DES + mod SAG (il barbaro usa COS).","Arti Marziali":"Con colpi senz’armi e armi da monaco usi DES al posto di FOR, hai danni marziali crescenti e un attacco senz’armi come azione bonus.","Ki":"Punti ki pari al livello da monaco: Raffica di Colpi, Passo del Vento e Difesa Paziente. Si ricaricano con un riposo breve o lungo.","Movimento Senza Armatura":"Velocità maggiore senza armatura né scudo, in aumento col livello.","Tradizione Monastica":"Al liv. 3 scegli la sottoclasse del monaco.","Deviare Proiettili":"Reazione: riduci i danni di un attacco a distanza di 1d10 + DES + livello da monaco; puoi rilanciare il proiettile con 1 ki.","Caduta Lenta":"Reazione: riduci i danni da caduta di 5 × livello da monaco.","Colpo Stordente":"Spendi 1 ki dopo un colpo: il bersaglio supera un TS COS o è stordito fino al tuo prossimo turno.","Colpi Ki Potenziati":"I tuoi colpi senz’armi contano come magici.","Mente Lucida":"Azione: termini un effetto di charme o paura su di te.","Movimento Senza Armatura Migliorato":"Ti muovi su superfici verticali e liquidi senza cadere.","Purezza del Corpo":"Sei immune a malattie e veleni.","Lingua del Sole e della Luna":"Comprendi tutti i linguaggi parlati.","Anima Adamantina":"Competenza in tutti i tiri salvezza; con 1 ki ripeti un TS fallito.","Corpo Senza Tempo":"Non invecchi magicamente e non hai bisogno di cibo né acqua.","Corpo Vuoto":"4 ki: invisibile per 1 minuto e resistenza a tutti i danni tranne quelli da forza.","Perfezione Interiore":"Tirando l’iniziativa senza ki ne recuperi 4.","Ira":"Azione bonus, non con armatura pesante: per 1 minuto hai vantaggio alle prove e ai TS di Forza, un bonus ai danni delle armi da mischia con Forza (+2, +3 dal liv. 9, +4 dal 16) e resistenza ai danni contundenti, perforanti e taglienti. Non puoi lanciare incantesimi né concentrarti. Finisce se non attacchi né subisci danni.","Attacco Irruento":"Al primo attacco del turno puoi attaccare con vantaggio ai tiri per colpire con Forza, ma fino al tuo prossimo turno gli attacchi contro di te hanno vantaggio.","Percezione del Pericolo":"Vantaggio ai TS di Destrezza contro effetti che vedi (trappole, incantesimi); non vale se sei accecato, assordato o incapacitato.","Cammino Primordiale":"Al liv. 3 scegli la sottoclasse del barbaro.","Movimento Veloce":"+3 m di velocità se non indossi armatura pesante.","Istinto Ferino":"Vantaggio ai tiri per l’iniziativa; se sei sorpreso puoi agire normalmente se entri subito in ira.","Critico Brutale":"Nei colpi critici in mischia tiri un dado di danno extra (2 dal liv. 13, 3 dal 17).","Ira Implacabile":"Se scendi a 0 PF in ira, TS COS CD 10: con successo resti a 1 PF. La CD aumenta di 5 a ogni uso successivo (si azzera con un riposo).","Ira Persistente":"L’ira finisce prima del tempo solo se perdi i sensi o la termini tu.","Potenza Indomabile":"Se il totale di una prova di Forza è inferiore al tuo punteggio di Forza, usi quel punteggio.","Campione Primordiale":"Forza e Costituzione aumentano di 4 (massimo 24).","Ispirazione Bardica":"Azione bonus: un alleato entro 18 m che ti sente ottiene un dado (d6, poi d8, d10, d12) da aggiungere a una prova, a un tiro per colpire o a un TS entro 10 minuti.","Factotum":"Aggiungi metà del bonus di competenza alle prove di abilità senza competenza.","Canto di Riposo":"Se alla fine di un riposo breve tu o le creature amiche che sentono la tua esibizione recuperate PF spendendo almeno un Dado Vita, ognuno recupera 1d6 PF extra (d8 dal 9° livello, d10 dal 13°, d12 dal 17°).","Collegio Bardico":"Al liv. 3 scegli la sottoclasse del bardo.","Maestria":"Raddoppi il bonus di competenza in due abilità a tua scelta (altre due più avanti). Il ladro può scegliere anche gli attrezzi da scasso.","Fonte di Ispirazione":"Recuperi tutti gli usi di Ispirazione Bardica anche con un riposo breve.","Controfascino":"Azione: fino alla fine del tuo prossimo turno tu e gli alleati entro 9 m avete vantaggio ai TS contro spaventato e affascinato.","Segreti Magici":"Impari incantesimi di qualsiasi classe, che contano come incantesimi da bardo.","Ispirazione Superiore":"Tirando l’iniziativa senza usi di Ispirazione Bardica ne recuperi uno.","Dominio Divino":"Al liv. 1 scegli il dominio del chierico: ti dà incantesimi sempre preparati e privilegi.","Incanalare Divinità":"Usi le opzioni di Scacciare Non Morti e quelle del tuo dominio. Si ricarica con un riposo breve o lungo.","Distruggere Non Morti":"I non morti con GS sotto una soglia (1/2 al liv. 5, 1 all’8, 2 all’11, 3 al 14, 4 al 17) che falliscono contro Scacciare Non Morti vengono distrutti.","Intervento Divino":"Azione: chiedi aiuto alla divinità. Tiri d100: se il risultato è pari o inferiore al tuo livello da chierico, l’aiuto arriva. Se funziona non puoi riprovare per 7 giorni.","Intervento Divino Migliorato":"Al liv. 20 l’Intervento Divino riesce sempre.","Druidico":"Conosci il linguaggio segreto dei druidi e puoi lasciare messaggi nascosti.","Forma Selvatica":"Azione: ti trasformi in una bestia che hai già visto. Limiti di GS, nuoto e volo crescono col livello; dura metà livello da druido in ore. Hai 2 usi per riposo breve o lungo.","Circolo Druidico":"Al liv. 2 scegli la sottoclasse del druido.","Forma Selvatica Migliorata":"I limiti di GS e le capacità di movimento della Forma Selvatica aumentano.","Incantesimi Bestiali":"Puoi lanciare incantesimi mentre sei in Forma Selvatica, ignorando le componenti verbali e somatiche.","Arcidruido":"Usi Forma Selvatica senza limiti e ignori le componenti verbali, somatiche e materiali senza costo degli incantesimi.","Druido|Corpo Senza Tempo":"Invecchi di 1 anno ogni 10 che passano.","Attacco Furtivo":"Una volta per turno infliggi danni extra (1d6, +1d6 ogni 2 livelli) con un’arma accurata o a distanza se hai vantaggio, oppure se un nemico del bersaglio è entro 1,5 m da lui e non sei in svantaggio.","Gergo Ladresco":"Conosci il gergo segreto dei ladri e puoi lasciare messaggi in codice.","Azione Scaltra":"Azione bonus: Scatto, Disimpegno o Nascondersi.","Archetipo Ladresco":"Al liv. 3 scegli la sottoclasse del ladro.","Schivata Prodigiosa":"Reazione: dimezzi i danni di un attacco di una creatura che vedi.","Dote Affidabile":"Nelle prove con competenza, un d20 inferiore a 10 conta come 10.","Percezione Cieca":"Se puoi sentire, percepisci le creature nascoste o invisibili entro 3 m.","Mente Sfuggente":"Competenza nei tiri salvezza di Saggezza.","Inafferrabile":"Nessun tiro per colpire ha vantaggio contro di te finché non sei incapacitato.","Colpo di Fortuna":"Un attacco fallito diventa un colpo a segno, oppure una prova fallita diventa 20. Si ricarica con un riposo breve o lungo.","Patrono Ultraterreno":"Al liv. 1 scegli il tuo patrono (sottoclasse del warlock).","Magia del Patto":"Pochi slot, tutti dello stesso livello (che cresce col livello), ricaricati dal riposo breve. Il Carisma è la caratteristica da incantatore.","Suppliche Occulte":"Doni magici personalizzabili: ne scegli 2 al liv. 2 e altre più avanti.","Dono del Patto":"Al liv. 3 scegli il Patto della Catena, della Lama o del Tomo.","Arcanum Mistico":"Un incantesimo di 6°–9° livello (uno per livello) lanciabile una volta per riposo lungo senza slot.","Maestro dell’Occulto":"1 minuto di supplica: recuperi tutti gli slot del patto, una volta per riposo lungo."},DESCO={"Metamagia":[["Incantesimo Celato","1 punto stregoneria: lanci senza componenti verbali né somatiche."],["Incantesimo Distante","1 punto: raddoppi la gittata (da 1,5 m in su); un incantesimo a contatto arriva a 9 m."],["Incantesimo Esteso","1 punto: raddoppi la durata (da 1 minuto in su), fino a 24 ore."],["Incantesimo Intensificato","3 punti: un bersaglio ha svantaggio al primo TS contro l’incantesimo."],["Incantesimo Potenziato","1 punto: ripeti i dadi di danno, in numero pari al tuo mod CAR (minimo 1). Si può usare insieme a un’altra opzione."],["Incantesimo Preciso","1 punto: scegli fino a mod CAR creature (minimo 1) che superano automaticamente il TS contro l’incantesimo."],["Incantesimo Raddoppiato","Punti pari al livello dell’incantesimo (1 per un trucchetto): bersagli una seconda creatura entro gittata. Solo per incantesimi a bersaglio singolo."],["Incantesimo Rapido","2 punti: un incantesimo con tempo di lancio di 1 azione diventa un’azione bonus."]]},RT={"Elfo":[["Scurovisione","Vedi in luce fioca entro 18 m come in luce intensa, e al buio come in luce fioca (senza colori)."],["Sensi Acuti","Competenza nell’abilità Percezione."],["Retaggio Fatato","Vantaggio ai TS contro l’essere affascinato; la magia non può addormentarti."],["Trance","Mediti 4 ore invece di dormire 8 per ottenere i benefici di un riposo lungo."]],"Elfo alto":[["Addestramento nelle Armi Elfiche","Competenza con spada lunga, spada corta, arco corto e arco lungo."],["Trucchetto","Conosci un trucchetto da mago (Intelligenza)."],["Linguaggio Extra","Conosci un linguaggio a scelta."]],"Elfo dei boschi":[["Addestramento nelle Armi Elfiche","Competenza con spada lunga, spada corta, arco corto e arco lungo."],["Piede Lesto","Velocità base di 10,5 m."],["Maschera della Selva","Puoi nasconderti anche con una copertura leggera come foschia, foglie o neve."]],"Elfo oscuro (drow)":[["Scurovisione Superiore","La tua scurovisione arriva a 36 m."],["Sensibilità alla Luce del Sole","Svantaggio ai tiri per colpire e alle prove di Percezione basate sulla vista alla luce del sole."],["Magia Drow","Conosci il trucchetto Luci Danzanti; ai livelli superiori ottieni altri incantesimi."],["Addestramento nelle Armi Drow","Competenza con stocco, spada corta e balestra a mano."]],"Halfling":[["Fortunato","Con un 1 naturale su un d20 ritiri il dado e usi il nuovo risultato."],["Coraggioso","Vantaggio ai TS contro la condizione di spaventato."],["Agilità Halfling","Puoi muoverti attraverso lo spazio di creature più grandi di te."]],"Halfling piedelesto":[["Furtività Innata","Puoi nasconderti dietro una creatura di taglia superiore alla tua."]],"Halfling tozzo":[["Resilienza del Tozzi","Vantaggio ai TS contro il veleno e resistenza ai danni da veleno."]],"Nano":[["Scurovisione","Vedi in luce fioca entro 18 m come in luce intensa, e al buio come in luce fioca."],["Resilienza Nanica","Vantaggio ai TS contro il veleno e resistenza ai danni da veleno."],["Addestramento Nanico al Combattimento","Competenza con ascia da battaglia, ascia, martello leggero e martello da guerra."],["Competenza negli Strumenti","Competenza in uno strumento da artigiano a scelta."],["Esperto di Pietre","Competenza raddoppiata nelle prove di Storia legate alla pietra."]],"Nano delle colline":[["Robustezza Nanica","I tuoi PF massimi aumentano di 1 e di 1 per ogni livello."]],"Nano delle montagne":[["Addestramento nelle Armature Naniche","Competenza nelle armature leggere e medie."]],"Umano":[["Linguaggio Extra","Conosci un linguaggio a scelta oltre al Comune; nessun altro tratto speciale."]],"Dragonide":[["Discendenza Draconica","Scegli un drago: determina il tipo di danno del soffio e la tua resistenza."],["Arma a Soffio","Azione: soffio ad area (TS DES o COS) con danni crescenti col livello; poi riposo breve o lungo."],["Resistenza ai Danni","Resistenza al tipo di danno della tua discendenza."]],"Gnomo":[["Scurovisione","Vedi in luce fioca entro 18 m come in luce intensa, const SUB={"Guerriero":{"label":"Archetipo Marziale","lv":3,"opts":{"Campione":[[3,"Critico Migliorato","I colpi con armi sono critici con 19-20."],[7,"Atleta Straordinario","Metà bonus di competenza alle prove di FOR, DES e COS senza competenza; salto in lungo maggiore."],[10,"Stile di Combattimento Aggiuntivo","Scegli una seconda opzione di Stile di Combattimento."],[15,"Critico Superiore","I colpi con armi sono critici con 18-20."],[18,"Sopravvissuto","A inizio turno, sotto metà PF, recuperi 5 + mod COS PF."]],"Maestro di Battaglia":[[3,"Superiorità in Combattimento","Dadi di superiorità e manovre. CD delle manovre: 8 + competenza + FOR o DES (a tua scelta). Una manovra costa un dado. Manovre conosciute: 3 al liv. 3, 5 al 7, 7 al 10, 9 al 15. «+dado ai danni» = aggiungi il dado ai danni dell’attacco.",[["Attacco Provocatorio","+dado ai danni; il bersaglio fa un TS SAG: se fallisce ha svantaggio ai tiri per colpire contro chiunque non sia tu, fino alla fine del tuo prossimo turno."],["Attacco con Affondo","Aumenti di 1,5 m la portata per un attacco in mischia; se colpisce, +dado ai danni."],["Attacco con Finta","Azione bonus: scegli una creatura entro 1,5 m; hai vantaggio al tuo prossimo tiro per colpire contro di essa in questo turno e, se colpisce, +dado ai danni."],["Attacco Sbilanciante","+dado ai danni; un bersaglio Grande o inferiore fa un TS FOR o cade prono."],["Colpo del Comandante","Rinunci a uno dei tuoi attacchi e usi un’azione bonus: un alleato che ti vede o sente usa la reazione per attaccare con un’arma, aggiungendo il dado ai danni."],["Colpo Distraente","+dado ai danni; il prossimo attacco di un altro attaccante contro quel bersaglio ha vantaggio, se avviene prima dell’inizio del tuo prossimo turno."],["Attacco con Manovra","+dado ai danni; un alleato che ti vede o sente può usare la reazione per muoversi fino a metà velocità senza provocare attacchi di opportunità dal bersaglio."],["Attacco Minaccioso","+dado ai danni; il bersaglio fa un TS SAG o è spaventato fino alla fine del tuo prossimo turno."],["Parata","Reazione: quando una creatura ti infligge danni con un attacco in mischia, riduci i danni di dado + mod DES."],["Attacco Preciso","Aggiungi il dado a un tuo tiro per colpire, prima o dopo averlo tirato ma prima di applicare gli effetti dell’attacco."],["Attacco con Spinta","+dado ai danni; un bersaglio Grande o inferiore fa un TS FOR o è spinto fino a 4,5 m lontano da te."],["Incoraggiamento","Azione bonus: un alleato che ti vede o sente ottiene PF temporanei pari al dado + mod CAR."],["Replica","Reazione: quando una creatura ti manca con un attacco in mischia, la attacchi con un’arma da mischia; se colpisce, +dado ai danni."],["Attacco con Spazzata","Dopo un colpo in mischia, un’altra creatura entro 1,5 m dal bersaglio e alla tua portata subisce danni pari al dado, se il tiro per colpire originale la colpirebbe."],["Scarto Elusivo","Quando ti muovi, tiri il dado e aggiungi il risultato alla CA finché non smetti di muoverti."],["Attacco Disarmante","+dado ai danni; il bersaglio fa un TS FOR o lascia cadere un oggetto a tua scelta che sta impugnando."]]],[3,"Studioso di Guerra","Competenza in un tipo di strumenti da artigiano."],[7,"Conosci il Tuo Nemico","Osservando una creatura per 1 minuto ne scopri alcune caratteristiche rispetto alle tue."],[7,"Superiorità in Combattimento","Salgono a 5 dadi di superiorità e 5 manovre conosciute."],[10,"Superiorità in Combattimento Migliorata","I dadi diventano d10 e conosci 7 manovre."],[15,"Implacabile","Tirando l’iniziativa senza dadi di superiorità ne recuperi uno; salgono a 6 dadi e 9 manovre."],[18,"Superiorità in Combattimento Migliorata","I dadi di superiorità diventano d12."]],"Cavaliere Mistico":[[3,"Incantesimi","Lanci incantesimi da mago (Intelligenza), perlopiù di abiurazione e invocazione."],[3,"Arma Vincolata","Leghi con un rituale fino a 2 armi: non puoi essere disarmato e le richiami con un’azione bonus."],[7,"Magia da Guerra","Dopo un trucchetto, tento usa 3d20."]],"Evocazione":[[2,"Evocatore Sapiente","Copiare nel libro incantesimi di evocazione costa la metà di tempo e denaro."],[2,"Evocazione Minore","Azione: crei un oggetto inanimato che dura 1 ora."],[6,"Trasposizione Benevola","Teletrasporto fino a 9 m o scambio di posto con una creatura volontaria."],[10,"Evocazione Focalizzata","La concentrazione sulle evocazioni non si rompe a causa dei danni."],[14,"Evocazioni Perduranti","Le creature evocate ottengono 30 PF temporanei."]],"Illusione":[[2,"Illusionista Sapiente","Copiare nel libro incantesimi di illusione costa la metà di tempo e denaro."],[2,"Illusione Minore Migliorata","Impari Illusione Minore e puoi creare suono e immagine insieme."],[6,"Illusioni Duttili","Azione: modifichi un’illusione che stai già sostenendo."],[10,"Sosia Illusorio","Reazione: un duplicato fa mancare un attacco contro di te."],[14,"Realtà Illusoria","Azione bonus: un oggetto illusorio diventa reale per 1 minuto."]],"Invocazione":[[2,"Invocatore Sapiente","Copiare nel libro incantesimi di invocazione costa la metà di tempo e denaro."],[2,"Plasmare Incantesimi","Gli alleati scelti superano automaticamente i TS dei tuoi incantesimi di invocazione e non subiscono danni."],[6,"Trucchetto Potente","I trucchetti che colpiscono con un TS infliggono comunque metà danni."],[10,"Invocazione Potente","Aggiungi il mod INT ai danni dei tuoi incantesimi di invocazione."],[14,"Saturazione Magica","Un incantesimo da mago di 1°–5° livello infligge il massimo dei danni; i lanci successivi infliggono danni a te."]],"Trasmutazione":[[2,"Trasmutatore Sapiente","Copiare nel libro incantesimi di trasmutazione costa la metà di tempo e denaro."],[2,"Alchimia Minore","Trasformi temporaneamente un oggetto non magico in un altro materiale."],[6,"Pietra del Trasmutatore","Crei una pietra con benefici (scurovisione, velocità, COS o resistenza)."],[10,"Muta Forma","Metamorfosi sempre nel libro e lanciabile su di te senza slot."],[14,"Maestro Trasmutatore","Consumi la pietra per un effetto potente (ringiovanimento, trasformazione, panacea, resurrezione)."]],"Necromanzia":[[2,"Necromante Sapiente","Copiare nel libro incantesimi di negromanzia costa la metà di tempo e denaro."],[2,"Raccolto Macabro","Uccidendo con un incantesimo recuperi PF pari al doppio del livello dell’incantesimo (3× per la negromanzia)."],[6,"Servitori Non Morti","Aggiungi Animare Morti al libro e animi un cadavere in più; i non morti creati hanno più PF e danni."],[10,"Impervio alla Non Morte","Resistenza ai danni necrotici; i tuoi PF massimi non possono essere ridotti."],[14,"Comandare Non Morti","Prendi il controllo di un non morto di altri (TS CAR)."]]}},"Stregone":{"label":"Origine Stregonesca","lv":1,"opts":{"Discendenza Draconica":[[1,"Antenato Draconico","Scegli un drago: definisce il tipo di danno dei tuoi privilegi; parli Draconico.",[["Draghi e tipo di danno","Argento: freddo. Bianco: freddo. Blu: fulmine. Bronzo: fulmine. Nero: acido. Oro: fuoco. Ottone: fuoco. Rame: acido. Rosso: fuoco. Verde: veleno."]]],[1,"Resilienza Draconica","+1 PF per livello e CA base 13 + DES senza armatura."],[6,"Affinità Elementale","Aggiungi il mod CAR ai danni del tuo elemento; 1 punto stregoneria per resistenza a quel tipo."],[14,"Ali di Drago","Azione bonus: ali che ti danno velocità di volo."],[18,"Presenza Draconica","5 punti stregoneria: aura che affascina o spaventa chi ti sta intorno."]],"Magia Selvaggia":[[1,"Impulso di Magia Selvaggia","Dopo un incantesimo il DM può chiederti un d20: con 1 tiri sulla tabella degli impulsi."],[1,"Onde di Caos","Vantaggio a un tiro; si ricarica con riposo lungo o dopo un impulso."],[6,"Piegare la Fortuna","Reazione, 2 punti stregoneria: ±1d4 al tiro di un’altra creatura."],[14,"Caos Controllato","Sulla tabella degli impulsi tiri due volte e scegli."],[18,"Bombardamento Magico","Se ottieni il massimo su un dado di danno, lo ritiri e usi il nuovo risultato."]]}},"Paladino":{"label":"Giuramento Sacro","lv":3,"opts":{"Devozione":[[3,"Arma Consacrata","Incanalare Divinità: aggiungi il mod CAR ai tiri per colpire con un’arma per 1 minuto."],[3,"Scacciare i Sacrileghi","Incanalare Divinità: scacci non morti e immondi entro 9 m (TS Saggezza)."],[3,"Incantesimi del giuramento","Protezione dal Bene e dal Male, Santuario."],[5,"Incantesimi del giuramento","Ristorare Inferiore, Zona di Verità."],[7,"Aura di Devozione","Tu e gli alleati entro 3 m non potete essere affascinati (9 m dal liv. 18)."],[9,"Incantesimi del giuramento","Dissolvi Magie, Faro di Speranza."],[13,"Incantesimi del giuramento","Guardiano della Fede, Libertà di Movimento."],[15,"Purezza di Spirito","Sei sempre sotto l’effetto di Protezione dal Bene e dal Male."],[17,"Incantesimi del giuramento","Colpo Infuocato, Comunione."],[20,"Nube Sacra","Per 1 minuto aura di luce solare con danni radiosi ai nemici."]],"Antichi":[[3,"Collera della Natura","Incanalare Divinità: rampicanti trattengono una creatura entro 3 m (TS Forza o Destrezza)."],[3,"Scacciare gli Infedeli","Incanalare Divinità: scacci fate e immondi entro 9 m (TS Saggezza)."],[3,"Incantesimi del giuramento","Colpo Intrappolante, Parlare con gli Animali."],[5,"Incantesimi del giuramento","Bagliore Lunare, Passo Velato."],[7,"Aura di Interdizione","Tu e gli alleati entro 3 m avete resistenza ai danni degli incantesimi (9 m dal liv. 18)."],[9,"Incantesimi del giuramento","Crescita Vegetale, Protezione dall’Energia."],[13,"Incantesimi del giuramento","Pelle di Pietra, Tempesta di Ghiaccio."],[15,"Sentinella Imperitura","Se scendi a 0 PF resti a 1 PF, una volta per riposo lungo; non invecchi."],[17,"Incantesimi del giuramento","Comunione con la Natura, Traslazione Arborea."],[20,"Campione degli Antichi","Per 1 minuto: rigeneri PF, lanci incantesimi come azione bonus, svantaggio ai TS dei nemici vicini."]],"Vendetta":[[3,"Abiurare Nemico","Incanalare Divinità: spaventi una creatura entro 18 m (TS Saggezza) e la blocchi."],[3,"Giuramento di Inimicizia","Incanalare Divinità: vantaggio ai tiri per colpire contro una creatura per 1 minuto."],[3,"Incantesimi del giuramento","Anatema, Marchio del Cacciatore."],[5,"Incantesimi del giuramento","Blocca Persone, Passo Velato."],[7,"Vendicatore Implacabile","Dopo un attacco di opportunità ti muovi di metà velocità senza provocare."],[9,"Incantesimi del giuramento","Protezione dall’Energia, Velocità."],[13,"Incantesimi del giuramento","Esilio, Porta Dimensionale."],[15,"Anima di Vendetta","Reazione: attacco in mischia quando il tuo nemico del Giuramento di Inimicizia attacca."],[17,"Incantesimi del giuramento","Blocca Mostri, Scrutare."],[20,"Angelo Vendicatore","Per 1 ora: ali con volo 18 m e aura che spaventa i nemici."]]}},"Ranger":{"label":"Archetipo Ranger","lv":3,"opts":{"Cacciatore":[[3,"Preda del Cacciatore","Scegli una delle opzioni elencate qui sotto.",[["Devastatore dell’Orda","Una volta per turno, quando attacchi con un’arma, puoi fare un altro attacco con la stessa arma contro una creatura diversa entro 1,5 m dal bersaglio originale e alla portata dell’arma."],["Sterminatore di Colossi","Quando colpisci con un’arma una creatura a cui mancano PF, infliggi 1d8 danni extra. Una volta per turno."],["Uccisore di Giganti","Quando una creatura Grande o più grande entro 1,5 m ti colpisce o ti manca con un attacco, puoi usare la reazione per attaccarla subito, se la vedi."]]],[7,"Tattiche Difensive","Scegli una delle opzioni elencate qui sotto.",[["Difesa dal Multiattacco","Quando una creatura ti colpisce, hai +4 alla CA contro tutti i suoi attacchi successivi per il resto del turno."],["Sfuggire all’Orda","Gli attacchi di opportunità contro di te hanno svantaggio."],["Volontà d’Acciaio","Vantaggio ai tiri salvezza contro l’essere spaventato."]]],[11,"Multiattacco","Scegli una delle opzioni elencate qui sotto.",[["Attacco Turbinante","Con un’azione fai un attacco in mischia contro ogni creatura entro 1,5 m da te, con un tiro per colpire separato per ciascuna."],["Raffica","Con un’azione fa a creatura colpita da un altro entro 1,5 m da te."]],"Quattro Elementi":[[3,"Discepolo degli Elementi","Impari Sintonia Elementale e una disciplina elementale."],[6,"Discipline Elementali","Impari una disciplina elementale in più."],[11,"Discipline Elementali","Impari una disciplina elementale in più."],[17,"Discipline Elementali","Impari una disciplina elementale in più."]]}},"Barbaro":{"label":"Cammino Primordiale","lv":3,"opts":{"Berserker":[[3,"Frenesia","Entrando in ira puoi entrare in frenesia: un attacco in mischia extra come azione bonus ogni turno, ma alla fine dell’ira subisci un livello di indebolimento."],[6,"Ira Incontenibile","Mentre sei in ira non puoi essere affascinato né spaventato."],[10,"Presenza Intimidatoria","Azione: spaventi una creatura entro 9 m (TS Saggezza) per un minuto."],[14,"Ritorsione","Reazione: quando subisci danni da una creatura entro 1,5 m, la attacchi in mischia."]],"Combattente Totemico":[[3,"Cercatore di Spiriti","Lanci Percezione delle Bestie e Parlare con gli Animali, solo come rituali."],[3,"Spirito Totemico","Scegli un animale: Aquila, Lupo o Orso, con un beneficio mentre sei in ira."],[6,"Aspetto della Bestia","Beneficio magico passivo legato a un animale totemico a tua scelta."],[10,"Viandante Spirituale","Lanci Comunione con la Natura come rituale."],[14,"Sintonia Totemica","Beneficio magico potente mentre sei in ira."]]}},"Bardo":{"label":"Collegio Bardico","lv":3,"opts":{"Sapienza":[[3,"Competenze Bonus","Ottieni competenza in tre abilità a tua scelta."],[3,"Parole Taglienti","Reazione, spendi un’Ispirazione Bardica: sottrai il dado a un tiro per colpire, prova o danni di una creatura entro 18 m."],[6,"Segreti Magici Aggiuntivi","Impari due incantesimi da qualsiasi classe."],[14,"Abilità Impareggiabile","Quando fai una prova di caratteristica puoi spendere Ispirazione Bardica: aggiungi il dado al tiro (anche dopo averlo visto)."]],"Valore":[[3,"Competenze Bonus","Ottieni competenza nelle armature medie, negli scudi e
