<html lang="it">

<meta name="mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;700&family=Alegreya+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#eceee4;--panel:#fbfbf6;--ink:#1d2b2a;--mute:#5c6b67;--line:#c8d0bf;--acc:#6e2a38;--acc-ink:#fff;--brass:#8a6c1f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#131b1b;--panel:#1c2727;--ink:#e6e9df;--mute:#97a49f;--line:#2f3e3d;--acc:#d98a9a;--acc-ink:#1a1010;--brass:#d0b25a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#131b1b;--panel:#1c2727;--ink:#e6e9df;--mute:#97a49f;--line:#2f3e3d;--acc:#d98a9a;--acc-ink:#1a1010;--brass:#d0b25a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Alegreya Sans",system-ui,sans-serif}
h1,h2,h3{font-family:Alegreya,Georgia,serif;margin:0;line-height:1.15}
header{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;padding:20px 20px 0;max-width:1000px;margin:0 auto}
h1{font-size:2rem}
.sub{color:var(--mute);font-size:.9rem;flex-basis:100%}
nav{display:flex;gap:4px;margin-left:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;font:inherit;font-weight:500;color:var(--mute);padding:6px 10px;cursor:pointer}
nav button[aria-selected=true]{color:var(--ink);border-color:var(--brass)}
main{max-width:1000px;margin:0 auto;padding:16px 20px 60px;display:grid;gap:20px;align-items:start}
@media(min-width:760px){main.two{grid-template-columns:250px 1fr}}
button,input,textarea,select{font:inherit;color:inherit}
.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn.ghost{background:none;color:var(--mute);border:1px solid var(--line)}
.btn.danger{color:var(--acc);border-color:var(--acc)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.list{display:flex;flex-direction:column;gap:8px}
.rowc{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:stretch}
.item{display:flex;gap:10px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer;min-width:0}
.item[aria-current=true]{border-color:var(--brass);box-shadow:inset 4px 0 0 var(--brass)}
.item b{font-family:Alegreya,serif;font-size:1.15rem;display:block}
.item span{color:var(--mute);font-size:.9rem}
.th{width:38px;height:38px;border-radius:50%;object-fit:cover;flex:none;background:var(--line)}
.sheet,.note{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px;display:grid;gap:14px}
label{display:grid;gap:3px;color:var(--mute);font-size:.9rem}
input,textarea,select{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:7px 9px;width:100%;color:var(--ink)}
textarea{min-height:110px;resize:vertical;line-height:1.5}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center;display:grid;gap:2px}
.stat input{text-align:center;font-family:Alegreya,serif;font-weight:700}
.stat .t{font-family:Alegreya,serif;font-size:1.6rem;font-weight:700}
.stat .m{font-family:Alegreya,serif;font-size:1.2rem;font-weight:700;color:var(--brass)}
.stat small{color:var(--mute);min-height:1.2em}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:.95rem}
.sk{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:2px 16px}
.sk label{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:1rem}
.sk input{width:auto}
.sk b{margin-left:auto;font-family:Alegreya,serif}
.link{display:grid;grid-template-columns:1fr 1.6fr auto auto;gap:6px;align-items:center}
@media(max-width:560px){.link{grid-template-columns:1fr 1fr}}
.link a{color:var(--acc);font-weight:500}
.gal{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px}
.gal figure{margin:0;display:grid;gap:4px;width:140px}
.gal img{width:140px;height:140px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.slotrow{display:flex;gap:8px;align-items:center;margin:4px 0;flex-wrap:wrap}
.slotrow span{min-width:170px}
.pip{width:24px;height:24px;border-radius:50%;border:2px solid var(--brass);background:var(--brass);cursor:pointer;padding:0}
.pip[aria-pressed=true]{background:none}
.meter{position:relative;display:flex;height:16px}
.zone{opacity:.6}.zone.g{background:#4f8a5b}.zone.y{background:#c08a2a}.zone.r{background:#b2483c}
.zone:nth-child(1){border-radius:8px 0 0 8px}.zone:nth-child(3){border-radius:0 8px 8px 0}
.mark{position:absolute;top:-4px;bottom:-4px;width:4px;background:var(--ink);border-radius:2px;transform:translateX(-2px)}
.verdict{font-weight:500}
.irow{display:grid;grid-template-columns:1fr 70px 84px 90px auto;gap:6px;align-items:center}
@media(max-width:560px){.irow{grid-template-columns:1fr 60px 76px}}
.eq{display:grid;grid-template-columns:1fr 90px 1fr;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px}
.hero{grid-column:2;grid-row:1/3;font-size:64px;text-align:center}
.slot{display:grid;gap:3px;justify-items:center;text-align:center;border:1px dashed var(--brass);border-radius:8px;padding:8px;background:var(--panel)}
.slot .ico{font-size:28px}
@media(max-width:560px){.eq{grid-template-columns:1fr 1fr}.hero{grid-column:1/3;grid-row:auto}}
.feat{display:grid;grid-template-columns:84px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.feat b{font-family:Alegreya,serif}.feat.now b{color:var(--brass)}
summary{cursor:pointer;font-family:Alegreya,serif;font-size:1.3rem}
main{padding-bottom:110px}
#bnav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
#bnav[hidden]{display:none}
#bnav button{flex:1;background:none;border:0;padding:8px 4px;color:var(--mute);font:inherit;font-size:.8rem;cursor:pointer;display:grid;justify-items:center;gap:2px}
#bnav button[aria-current=true]{color:var(--brass);font-weight:700}
#bnav .ni{font-size:1.5rem;line-height:1}
.resc{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:8px;background:var(--panel)}
.rbar{height:12px;border-radius:6px;background:var(--line);overflow:hidden}.rbar i{display:block;height:100%;background:var(--brass)}
.fbtn{background:none;border:0;border-bottom:1px dashed var(--brass);padding:0;color:var(--ink);font:inherit;cursor:pointer}
.chip.fbtn{border:1px solid var(--line);padding:3px 12px;border-radius:999px}
.cbl{display:flex;gap:6px;align-items:center;font-size:.85rem;color:var(--ink)}.cbl input{width:auto}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal[hidden]{display:none}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;max-width:520px;width:100%;max-height:80vh;overflow:auto;padding:18px;display:grid;gap:10px}
.mbox p{margin:0}
.status{color:var(--mute);font-size:.85rem;min-height:1.2em}
.empty{color:var(--mute);padding:20px;border:1px dashed var(--line);border-radius:8px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar .grow{flex:1;min-width:140px}
.cover{display:block;width:100%;height:min(52vw,300px);object-fit:cover;object-position:50% 25%;border-radius:10px;border:1px solid var(--line)}
[hidden]{display:none!important}
.vit{position:sticky;top:0;z-index:15;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:8px 0;display:grid;gap:6px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.vit .r{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.vit .big{font-weight:700;font-size:1.05rem}
.vit .btn{padding:2px 10px;min-height:0;font-size:.9rem}
.vit .vc{display:flex;gap:4px;flex-wrap:wrap}.vit .vc:empty{display:none}
.vit .chip{font-size:.8rem;padding:1px 8px}
</style>

const FSD={"Tiro":"Bonus di +2 ai tiri per colpire con le armi a distanza.","Difesa":"Finché indossi un’armatura ottieni +1 alla CA.","Duellare":"Se impugni un’arma da mischia in una mano e nessun’altra arma, +2 ai danni di quell’arma.","Combattere con Armi Possenti":"Con un’arma da mischia a due mani (due mani o versatile) puoi ripetere i dadi di danno che danno 1 o 2.","Protezione":"Reazione: imponi svantaggio all’attacco di una creatura contro un alleato entro 1,5 m da te. Richiede uno scudo.","Combattere con Due Armi":"Quando combatti con due armi aggiungi il modificatore di caratteristica ai danni del secondo attacco."},FS={"Guerriero":{"lv":1,"o":["Tiro","Difesa","Duellare","Combattere con Armi Possenti","Protezione","Combattere con Due Armi"]},"Paladino":{"lv":2,"o":["Difesa","Duellare","Combattere con Armi Possenti","Protezione"]},"Ranger":{"lv":2,"o":["Tiro","Difesa","Duellare","Combattere con Due Armi"]}},SPL={"Protezione dal Bene e dal Male":["Abiurazione",1,"1 azione","Contatto","Concentrazione, 10 minuti","—","Il bersaglio è protetto da aberrazioni, celestiali, elementali, fate, immondi e non morti: svantaggio ai loro attacchi, niente charme, paura o possessione."],"Santuario":["Abiurazione",1,"1 azione bonus","9 m","1 minuto","SAG (dell’attaccante)","Chi vuole attaccare il protetto deve superare il TS o scegliere un altro bersaglio. Finisce se il protetto attacca o lancia un incantesimo offensivo."],"Ristorare Inferiore":["Abiurazione",2,"1 azione","Contatto","Istantanea","—","Termina una malattia o una condizione: accecato, assordato, paralizzato o avvelenato."],"Zona di Verità":["Ammaliamento",2,"1 azione","18 m","10 minuti","CAR","Chi fallisce non può mentire deliberatamente nella zona; tu sai chi ha superato il TS."],"Dissolvi Magie":["Abiurazione",3,"1 azione","36 m","Istantanea","—","Termina gli incantesimi di 3° livello o inferiore su un bersaglio; per quelli superiori serve una prova di caratteristica."],"Faro di Speranza":["Abiurazione",3,"1 azione","9 m","Concentrazione, 1 minuto","—","Le creature scelte hanno vantaggio ai TS di Saggezza e a quelli contro la morte, e recuperano il massimo dei PF dalle cure."],"Guardiano della Fede":["Evocazione",4,"1 azione","9 m","8 ore","DES","Un guardiano spettrale infligge 20 danni radiosi (metà con TS superato) ai nemici che si avvicinano; scompare dopo 60 danni."],"Libertà di Movimento":["Abiurazione",4,"1 azione","Contatto","1 ora","—","Il bersaglio ignora terreno difficile e le magie che lo rallentano, paralizzano o trattengono."],"Colpo Infuocato":["Invocazione",5,"1 azione","18 m","Istantanea","DES","Colonna di fuoco divino in un cilindro: 4d6 fuoco + 4d6 radioso; metà danni con TS superato."],"Comunione":["Divinazione",5,"1 minuto (rituale)","Incantatore","1 minuto","—","Poni tre domande a una divinità o ai suoi servitori: risposte sì, no o forse."],"Colpo Intrappolante":["Evocazione",1,"1 azione bonus","Incantatore","Concentrazione, 1 minuto","FOR","Il prossimo colpo con arma imprigiona il bersaglio con rampicanti: trattenuto e 1d6 perforanti a turno."],"Parlare con gli Animali":["Divinazione",1,"1 azione (rituale)","Incantatore","10 minuti","—","Comprendi le bestie e comunichi con loro."],"Bagliore Lunare":["Invocazione",2,"1 azione","36 m","Concentrazione, 1 minuto","COS","Raggio di luce lunare: 2d10 radiosi a chi entra o inizia il turno nell’area; metà con TS superato."],"Passo Velato":["Evocazione",2,"1 azione bonus","Incantatore","Istantanea","—","Ti teletrasporti fino a 9 m in uno spazio libero che vedi."],"Crescita Vegetale":["Trasmutazione",3,"1 azione (o 8 ore)","45 m","Istantanea","—","In 1 azione rende molto difficile attraversare la vegetazione; in 8 ore arricchisce il raccolto."],"Protezione dall’Energia":["Abiurazione",3,"1 azione","Contatto","Concentrazione, 1 ora","—","Il bersaglio ha resistenza a un tipo di danno: acido, freddo, fuoco, fulmine o tuono."],"Pelle di Pietra":["Abiurazione",4,"1 azione","Contatto","Concentrazione, 1 ora","—","Il bersaglio ha resistenza ai danni contundenti, perforanti e taglienti non magici."],"Tempesta di Ghiaccio":["Invocazione",4,"1 azione","90 m","Istantanea","DES","Grandine in un cilindro: 2d8 contundenti + 4d6 freddo; metà con TS superato; il terreno diventa difficile."],"Comunione con la Natura":["Divinazione",5,"1 minuto (rituale)","Incantatore","Istantanea","—","Ottieni tre informazioni sul territorio circostante (acqua, creature, piante, ecc.)."],"Traslazione Arborea":["Evocazione",5,"1 azione","Incantatore","Concentrazione, 1 minuto","—","Entri in un albero ed esci da un altro albero dello stesso tipo entro grande distanza."],"Anatema":["Ammaliamento",1,"1 azione","9 m","Concentrazione, 1 minuto","CAR","Fino a tre bersagli sottraggono 1d4 ai tiri per colpire e ai tiri salvezza."],"Marchio del Cacciatore":["Divinazione",1,"1 azione bonus","27 m","Concentrazione, 1 ora","—","Il bersaglio marchiato subisce 1d6 danni extra dai tuoi attacchi con arma ed è più facile da trovare."],"Blocca Persone":["Ammaliamento",2,"1 azione","18 m","Concentrazione, 1 minuto","SAG","Un umanoide resta paralizzato; ripete il TS alla fine di ogni suo turno."],"Velocità":["Trasmutazione",3,"1 azione","9 m","Concentrazione, 1 minuto","—","Il bersaglio ha velocità doppia, +2 CA, vantaggio ai TS di Destrezza e un’azione extra limitata; alla fine è affaticato per un turno."],"Esilio":["Abiurazione",4,"1 azione","18 m","Concentrazione, 1 minuto","CAR","Il bersaglio viene mandato su un altro piano; se l’incantesimo dura l’intera durata, le creature extraplanari non tornano."],"Porta Dimensionale":["Evocazione",4,"1 azione","150 m","Istantanea","—","Ti teletrasporti in un punto entro gittata, portando con te una creatura consenziente."],"Blocca Mostri":["Ammaliamento",5,"1 azione","27 m","Concentrazione, 1 minuto","SAG","Come Blocca Persone, ma funziona su qualsiasi creatura."],"Scrutare":["Divinazione",5,"10 minuti","Incantatore","Concentrazione, 10 minuti","SAG","Spii una creatura specifica a distanza tramite un sensore magico."]},DESC={"Forma Selvatica migliorata":"Puoi trasformarti in bestie più potenti: dal livello 4 anche con velocità di nuotare (GS massimo 1/2), dal livello 8 anche con velocità di volare (GS massimo 1). Il GS massimo e la durata sono quelli della tabella della Forma Selvatica.","Maestro dell'Occulto":"Meditando 1 minuto (riposo breve) puoi recuperare tutti gli slot di Magia del Patto spesi tra riposi brevi. Si ricarica con un riposo lungo.","Aumento dei Punteggi di Caratteristica":"Ricevi 2 punti da distribuire tra i punteggi (massimo 20): scrivili in “Aumenti di livello”.","Incantesimi":"Lanci incantesimi usando gli slot. La caratteristica da incantatore è Intelligenza (mago), Carisma (stregone, paladino, bardo, warlock) o Saggezza (chierico, druido, ranger).","Attacco Extra":"Con l’azione di Attacco puoi attaccare due volte invece di una (il guerriero ne ottiene di più ai livelli 11 e 20).","Elusione":"Nei TS di Destrezza per dimezzare i danni, con successo non subisci danni e con fallimento ne subisci la metà.","Stile di Combattimento":"Scegli uno stile di combattimento: vedi la sezione dedicata sopra.","Recuperare Energie":"Azione bonus: recuperi 1d10 + livello da guerriero PF. Si ricarica con un riposo breve o lungo.","Azione Impetuosa":"Nel tuo turno compi un’azione aggiuntiva. Si ricarica con un riposo breve o lungo (2 usi dal liv. 17, uno per turno).","Archetipo Marziale":"Al liv. 3 scegli la sottoclasse del guerriero.","Indomito":"Ripeti un tiro salvezza fallito e usi il nuovo risultato. Si ricarica con un riposo lungo.","Recupero Arcano":"Dopo un riposo breve recuperi slot con livelli totali pari a metà del livello da mago (per eccesso), nessuno di 6° o più. Una volta al giorno.","Tradizione Arcana":"Al liv. 2 scegli la scuola di magia.","Maestria negli Incantesimi":"Lanci a volontà, senza slot e al livello base, un incantesimo di 1° e uno di 2° livello del tuo libro.","Incantesimi Personali":"Due incantesimi di 3° livello sono sempre preparati e lanciabili una volta per riposo breve senza slot.","Origine Stregonesca":"Al liv. 1 scegli la fonte della tua magia.","Fonte di Magia":"Hai punti stregoneria pari al livello da stregone: converti slot in punti e viceversa.","Metamagia":"Spendi punti stregoneria per plasmare gli incantesimi: ne impari due al liv. 3, una al 10, una al 17. Di regola usi una sola opzione per incantesimo.","Ripristino Stregonesco":"Con un riposo breve recuperi 4 punti stregoneria.","Percezione del Divino":"Azione: individui celestiali, immondi e non morti entro 18 m. Usi 1 + mod CAR volte per riposo lungo.","Imposizione delle Mani":"Riserva di PF pari a 5 × livello da paladino: con un’azione curi toccando, oppure spendi 5 PF per curare malattia o veleno.","Punizione Divina":"Dopo un colpo in mischia spendi uno slot: 2d8 radiosi (+1d8 per livello di slot oltre il 1°, +1d8 contro immondi e non morti, massimo 5d8).","Salute Divina":"Sei immune alle malattie.","Giuramento Sacro":"Al liv. 3 scegli il tuo giuramento.","Aura di Protezione":"Tu e gli alleati entro 3 m aggiungete il tuo mod CAR (minimo +1) ai tiri salvezza (9 m dal liv. 18).","Aura di Coraggio":"Tu e gli alleati entro 3 m non potete essere spaventati (9 m dal liv. 18).","Punizione Divina Migliorata":"Tutti i tuoi colpi in mischia con arma infliggono +1d8 danni radiosi.","Tocco Purificatore":"Azione: termini un incantesimo su di te o su una creatura consenziente. Usi mod CAR volte per riposo lungo.","Aure Migliorate":"Le aure del paladino arrivano a 9 m.","Nemico Prescelto":"Scegli un tipo di nemico: vantaggio per rintracciarlo e ricordare informazioni su di esso; impari un linguaggio.","Esploratore Nato":"Scegli un terreno prediletto: benefici di viaggio, esplorazione e ricerca di cibo.","Archetipo Ranger":"Al liv. 3 scegli la sottoclasse del ranger.","Consapevolezza Primordiale":"Spendi uno slot per percepire la presenza di certi tipi di creature nelle vicinanze.","Andatura sul Territorio":"Il terreno difficile non vegetale non ti rallenta e le piante non ti ostacolano.","Nascondersi in Piena Vista":"Con 1 minuto ti mimetizzi: +10 a Furtività finché non ti muovi o agisci.","Svanire":"Nascondersi è un’azione bonus; non puoi essere seguito con mezzi non magici.","Sensi Ferini":"Attaccare creature che non vedi non ti dà svantaggio e conosci la loro posizione entro 9 m.","Sterminatore di Nemici":"Una volta per turno aggiungi il mod SAG a un tiro per colpire o per i danni contro il tuo nemico prescelto.","Nemico Prescelto Migliorato":"Scegli un ulteriore tipo di nemico prescelto.","Esploratore Nato Migliorato":"Scegli un ulteriore terreno prediletto.","Difesa Senza Armatura":"Senza armatura né scudo la tua CA è 10 + mod DES + mod SAG (il barbaro usa COS).","Arti Marziali":"Con colpi senz’armi e armi da monaco usi DES al posto di FOR, hai danni marziali crescenti e un attacco senz’armi come azione bonus.","Ki":"Punti ki pari al livello da monaco: Raffica di Colpi, Passo del Vento e Difesa Paziente. Si ricaricano con un riposo breve o lungo.","Movimento Senza Armatura":"Velocità maggiore senza armatura né scudo, in aumento col livello.","Tradizione Monastica":"Al liv. 3 scegli la sottoclasse del monaco.","Deviare Proiettili":"Reazione: riduci i danni di un attacco a distanza di 1d10 + DES + livello da monaco; puoi rilanciare il proiettile con 1 ki.","Caduta Lenta":"Reazione: riduci i danni da caduta di 5 × livello da monaco.","Colpo Stordente":"Spendi 1 ki dopo un colpo: il bersaglio supera un TS COS o è stordito fino al tuo prossimo turno.","Colpi Ki Potenziati":"I tuoi colpi senz’armi contano come magici.","Mente Lucida":"Azione: termini un effetto di charme o paura su di te.","Movimento Senza Armatura Migliorato":"Ti muovi su superfici verticali e liquidi senza cadere.","Purezza del Corpo":"Sei immune a malattie e veleni.","Lingua del Sole e della Luna":"Comprendi tutti i linguaggi parlati.","Anima Adamantina":"Competenza in tutti i tiri salvezza; con 1 ki ripeti un TS fallito.","Corpo Senza Tempo":"Non invecchi magicamente e non hai bisogno di cibo né acqua.","Corpo Vuoto":"4 ki: invisibile per 1 minuto e resistenza a tutti i danni tranne quelli da forza.","Perfezione Interiore":"Tirando l’iniziativa senza ki ne recuperi 4.","Ira":"Azione bonus, non con armatura pesante: per 1 minuto hai vantaggio alle prove e ai TS di Forza, un bonus ai danni delle armi da mischia con Forza (+2, +3 dal liv. 9, +4 dal 16) e resistenza ai danni contundenti, perforanti e taglienti. Non puoi lanciare incantesimi né concentrarti. Finisce se non attacchi né subisci danni.","Attacco Irruento":"Al primo attacco del turno puoi attaccare con vantaggio ai tiri per colpire con Forza, ma fino al tuo prossimo turno gli attacchi contro di te hanno vantaggio.","Percezione del Pericolo":"Vantaggio ai TS di Destrezza contro effetti che vedi (trappole, incantesimi); non vale se sei accecato, assordato o incapacitato.","Cammino Primordiale":"Al liv. 3 scegli la sottoclasse del barbaro.","Movimento Veloce":"+3 m di velocità se non indossi armatura pesante.","Istinto Ferino":"Vantaggio ai tiri per l’iniziativa; se sei sorpreso puoi agire normalmente se entri subito in ira.","Critico Brutale":"Nei colpi critici in mischia tiri un dado di danno extra (2 dal liv. 13, 3 dal 17).","Ira Implacabile":"Se scendi a 0 PF in ira, TS COS CD 10: con successo resti a 1 PF. La CD aumenta di 5 a ogni uso successivo (si azzera con un riposo).","Ira Persistente":"L’ira finisce prima del tempo solo se perdi i sensi o la termini tu.","Potenza Indomabile":"Se il totale di una prova di Forza è inferiore al tuo punteggio di Forza, usi quel punteggio.","Campione Primordiale":"Forza e Costituzione aumentano di 4 (massimo 24).","Ispirazione Bardica":"Azione bonus: un alleato entro 18 m che ti sente ottiene un dado (d6, poi d8, d10, d12) da aggiungere a una prova, a un tiro per colpire o a un TS entro 10 minuti.","Factotum":"Aggiungi metà del bonus di competenza alle prove di abilità senza competenza.","Canto di Riposo":"Durante un riposo breve, tu e gli alleati che ti ascoltano recuperate un dado extra ai Dadi Vita spesi (d6, poi d8, d10, d12).","Collegio Bardico":"Al liv. 3 scegli la sottoclasse del bardo.","Maestria":"Raddoppi il bonus di competenza in due abilità a tua scelta (altre due più avanti). Il ladro può scegliere anche gli attrezzi da scasso.","Fonte di Ispirazione":"Recuperi tutti gli usi di Ispirazione Bardica anche con un riposo breve.","Controfascino":"Azione: fino alla fine del tuo prossimo turno tu e gli alleati entro 9 m avete vantaggio ai TS contro spaventato e affascinato.","Segreti Magici":"Impari incantesimi di qualsiasi classe, che contano come incantesimi da bardo.","Ispirazione Superiore":"Tirando l’iniziativa senza usi di Ispirazione Bardica ne recuperi uno.","Dominio Divino":"Al liv. 1 scegli il dominio del chierico: ti dà incantesimi sempre preparati e privilegi.","Incanalare Divinità":"Usi le opzioni di Scacciare Non Morti e quelle del tuo dominio. Si ricarica con un riposo breve o lungo.","Distruggere Non Morti":"I non morti con GS sotto una soglia (1/2 al liv. 5, 1 all’8, 2 all’11, 3 al 14, 4 al 17) che falliscono contro Scacciare Non Morti vengono distrutti.","Intervento Divino":"Azione: chiedi aiuto alla divinità. Tiri d100: se il risultato è pari o inferiore al tuo livello da chierico, l’aiuto arriva. Se funziona non puoi riprovare per 7 giorni.","Intervento Divino Migliorato":"Al liv. 20 l’Intervento Divino riesce sempre.","Druidico":"Conosci il linguaggio segreto dei druidi e puoi lasciare messaggi nascosti.","Forma Selvatica":"Azione: ti trasformi in una bestia che hai già visto. Limiti di GS, nuoto e volo crescono col livello; dura metà livello da druido in ore. Hai 2 usi per riposo breve o lungo.","Circolo Druidico":"Al liv. 2 scegli la sottoclasse del druido.","Forma Selvatica Migliorata":"I limiti di GS e le capacità di movimento della Forma Selvatica aumentano.","Incantesimi Bestiali":"Puoi lanciare incantesimi mentre sei in Forma Selvatica, ignorando le componenti verbali e somatiche.","Arcidruido":"Usi Forma Selvatica senza limiti e ignori le componenti verbali, somatiche e materiali senza costo degli incantesimi.","Druido|Corpo Senza Tempo":"Invecchi di 1 anno ogni 10 che passano.","Attacco Furtivo":"Una volta per turno infliggi danni extra (1d6, +1d6 ogni 2 livelli) con un’arma accurata o a distanza se hai vantaggio, oppure se un nemico del bersaglio è entro 1,5 m da lui e non sei in svantaggio.","Gergo Ladresco":"Conosci il gergo segreto dei ladri e puoi lasciare messaggi in codice.","Azione Scaltra":"Azione bonus: Scatto, Disimpegno o Nascondersi.","Archetipo Ladresco":"Al liv. 3 scegli la sottoclasse del ladro.","Schivata Prodigiosa":"Reazione: dimezzi i danni di un attacco di una creatura che vedi.","Dote Affidabile":"Nelle prove con competenza, un d20 inferiore a 10 conta come 10.","Percezione Cieca":"Se puoi sentire, percepisci le creature nascoste o invisibili entro 3 m.","Mente Sfuggente":"Competenza nei tiri salvezza di Saggezza.","Inafferrabile":"Nessun tiro per colpire ha vantaggio contro di te finché non sei incapacitato.","Colpo di Fortuna":"Un attacco fallito diventa un colpo a segno, oppure una prova fallita diventa 20. Si ricarica con un riposo breve o lungo.","Patrono Ultraterreno":"Al liv. 1 scegli il tuo patrono (sottoclasse del warlock).","Magia del Patto":"Pochi slot, tutti dello stesso livello (che cresce col livello), ricaricati dal riposo breve. Il Carisma è la caratteristica da incantatore.","Suppliche Occulte":"Doni magici personalizzabili: ne scegli 2 al liv. 2 e altre più avanti.","Dono del Patto":"Al liv. 3 scegli il Patto della Catena, della Lama o del Tomo.","Arcanum Mistico":"Un incantesimo di 6°–9° livello (uno per livello) lanciabile una volta per riposo lungo senza slot.","Maestro dell’Occulto":"1 minuto di supplica: recuperi tutti gli slot del patto, una volta per riposo lungo."},DESCO={"Metamagia":[["Incantesimo Celato","1 punto stregoneria: lanci senza componenti verbali né somatiche."],["Incantesimo Distante","1 punto: raddoppi la gittata (da 1,5 m in su); un incantesimo a contatto arriva a 9 m."],["Incantesimo Esteso","1 punto: raddoppi la durata (da 1 minuto in su), fino a 24 ore."],["Incantesimo Intensificato","3 punti: un bersaglio ha svantaggio al primo TS contro l’incantesimo."],["Incantesimo Potenziato","1 punto: ripeti i dadi di danno, in numero pari al tuo mod CAR (minimo 1). Si può usare insieme a un’altra opzione."],["Incantesimo Preciso","1 punto: scegli fino a mod CAR creature (minimo 1) che superano automaticamente il TS contro l’incantesimo."],["Incantesimo Raddoppiato","Punti pari al livello dell’incantesimo (1 per un trucchetto): bersagli una seconda creatura entro gittata. Solo per incantesimi a bersaglio singolo."],["Incantesimo Rapido","2 punti: un incantesimo con tempo di lancio di 1 azione diventa un’azione bonus."]]},RT={"Elfo":[["Scurovisione","Vedi in luce fioca entro 18 m come in luce intensa, e al buio come in luce fioca (senza colori)."],["Sensi Acuti","Competenza nell’abilità Percezione."],["Retaggio Fatato","Vantaggio ai TS contro l’essere affascinato; la magia non può addormentarti."],["Trance","Mediti 4 ore invece di dormire 8 per ottenere i benefici di un riposo lungo."]],"Elfo alto":[["Addestramento nelle Armi Elfiche","Competenza con spada lunga, spada corta, arco corto e arco lungo."],["Trucchetto","Conosci un trucchetto da mago (Intelligenza)."],["Linguaggio Extra","Conosci un linguaggio a scelta."]],"Elfo dei boschi":[["Addestramento nelle Armi Elfiche","Competenza con spada lunga, spada corta, arco corto e arco lungo."],["Piede Lesto","Velocità base di 10,5 m."],["Maschera della Selva","Puoi nasconderti anche con una copertura leggera come foschia, foglie o neve."]],"Elfo oscuro (drow)":[["Scurovisione Superiore","La tua scurovisione arriva a 36 m."],["Sensibilità alla Luce del Sole","Svantaggio ai tiri per colpire e alle prove di Percezione basate sulla vista alla luce del sole."],["Magia Drow","Conosci il trucchetto Luci Danzanti; ai livelli superiori ottieni altri incantesimi."],["Addestramento nelle Armi Drow","Competenza con stocco, spada corta e balestra a mano."]],"Halfling":[["Fortunato","Con un 1 naturale su un d20 ritiri il dado e usi il nuovo risultato."],["Coraggioso","Vantaggio ai TS contro la condizione di spaventato."],["Agilità Halfling","Puoi muoverti attraverso lo spazio di creature più grandi di te."]],"Halfling piedelesto":[["Furtività Innata","Puoi nasconderti dietro una creatura di taglia superiore alla tua."]],"Halfling tozzo":[["Resilienza del Tozzi","Vantaggio ai TS contro il veleno e resistenza ai danni da veleno."]],"Nano":[["Scurovisione","Vedi in luce fioca entro 18 m come in luce intensa, e al buio come in luce fioca."],["Resilienza Nanica","Vantaggio ai TS contro il veleno e resistenza ai danni da veleno."],["Addestramento Nanico al Combattimento","Competenza con ascia da battaglia, ascia, martello leggero e martello da guerra."],["Competenza negli Strumenti","Competenza in uno strumento da artigiano a scelta."],["Esperto di Pietre","Competenza raddoppiata nelle prove di Storia legate alla pietra."]],"Nano delle colline":[["Robustezza Nanica","I tuoi PF massimi aumentano di 1 e di 1 per ogni livello."]],"Nano delle montagne":[["Addestramento nelle Armature Naniche","Competenza nelle armature leggere e medie."]],"Umano":[["Linguaggio Extra","Conosci un linguaggio a scelta oltre al Comune; nessun altro tratto speciale."]],"Dragonide":[["Discendenza Draconica","Scegli un drago: determina il tipo di danno del soffio e la tua resistenza."],["Arma a Soffio","Azione: soffio ad area (TS DES o COS) con danni crescenti col livello; poi riposo breve o lungo."],["Resistenza ai Danni","Resistenza al tipo di danno della tua discendenza."]],"Gnomo":[["Scurovisione","Vedi in luce fioca entro 18 m come in luce intensa, e al buio come in luce fioca."],["Astuzia Gnomesca","Vantaggio ai TS di Intellig  è spaventato fino alla fine del tuo prossimo turno."],["Parata","Reazione: quando una creatura ti infligge danni con un attacco in mischia, riduci i danni di dado + mod DES."],["Attacco Preciso","Aggiungi il dado a un tuo tiro per colpire, prima o dopo averlo tirato ma prima di applicare gli effetti dell’attacco."],["Attacco con Spinta","+dado ai danni; un bersaglio Grande o inferiore fa un TS FOR o è spinto fino a 4,5 m lontano da te."],["Incoraggiamento","Azione bonus: un alleato che ti vede o sente ottiene PF temporanei pari al dado + mod CAR."],["Replica","Reazione: quando una creatura ti manca con un attacco in mischia, la attacchi con un’arma da mischia; se colpisce, +dado ai danni."],["Attacco con Spazzata","Dopo un colpo in mischia, un’altra creatura entro 1,5 m dal bersaglio e alla tua portata subisce danni pari al dado, se il tiro per colpire originale la colpirebbe."],["Scarto Elusivo","Quando ti muovi, tiri il dado e aggiungi il risultato alla CA finché non smetti di muoverti."],["Attacco Disarmante","+dado ai danni; il bersaglio fa un TS FOR o lascia cadere un oggetto a tua scelta che sta impugnando."]]],[3,"Studioso di Guerra","Competenza in un tipo di strumenti da artigiano."],[7,"Conosci il Tuo Nemico","Osservando una creatura per 1 minuto ne scopri alcune caratteristiche rispetto alle tue."],[7,"Superiorità in Combattimento","Salgono a 5 dadi di superiorità e 5 manovre conosciute."],[10,"Superiorità in Combattimento Migliorata","I dadi diventano d10 e conosci 7 manovre."],[15,"Implacabile","Tirando l’iniziativa senza dadi di superiorità ne recuperi uno; salgono a 6 dadi e 9 manovre."],[18,"Superiorità in Combattimento Migliorata","I dadi di superiorità diventano d12."]],"Cavaliere Mistico":[[3,"Incantesimi","Lanci incantesimi da mago (Intelligenza), perlopiù di abiurazione e invocazione."],[3,"Legame con l’Arma","Leghi con un rituale fino a 2 armi: non puoi essere disarmato e le richiami con un’azione bonus."],[7,"Magia da Guerra","Dopo un trucchet guerra."],[3,"Ispirazione in Combattimento","Una creatura ispirata aggiunge il dado ai danni di un’arma, oppure alla CA contro un attacco (reazione)."],[6,"Attacco Extra","Con l’azione di Attacco puoi attaccare due volte."],[14,"Magia da Battaglia","Dopo aver lanciato un incantesimo con l’azione puoi attaccare con un’arma come azione bonus."]]}},"Chierico":{"label":"Dominio Divino","lv":1,"opts":{"Conoscenza":[[1,"Benedizioni della Conoscenza","Impari due linguaggi e ottieni competenza (raddoppiata) in due abilità tra Arcano, Natura, Religione, Storia."],[1,"Incantesimi del dominio","Comando, Identificare"],[2,"Incanalare Divinità: Conoscenza Secolare","Azione: scegli un’abilità o strumento e ottieni competenza per 10 minuti."],[3,"Incantesimi del dominio","Presagio, Suggestione"],[5,"Incantesimi del dominio","Parlare con i Morti"],[6,"Incanalare Divinità: Leggere i Pensieri","Leggi i pensieri di una creatura (TS Saggezza) e puoi lanciare Suggestione senza slot."],[7,"Incantesimi del dominio","Occhio Arcano, Confusione"],[8,"Incantesimi Potenti","Aggiungi il mod SAG ai danni dei trucchetti da chierico."],[9,"Incantesimi del dominio","Scrutare"],[17,"Visioni del Passato","Meditando 1 minuto ricevi visioni di un oggetto o di un luogo del passato."]],"Guerra":[[1,"Competenze Bonus","Ottieni competenza nelle armi da guerra e nelle armature pesanti."],[1,"Sacerdote di Guerra","Azione bonus: dopo l’azione di Attacco, un attacco extra. Usi: mod SAG per riposo lungo."],[1,"Incantesimi del dominio","Favore Divino, Scudo della Fede"],[2,"Incanalare Divinità: Attacco Guidato","Reazione/azione: +10 a un tiro per colpire."],[3,"Incantesimi del dominio","Arma Magica, Arma Spirituale"],[5,"Incantesimi del dominio","Spiriti Guardiani"],[6,"Incanalare Divinità: Benedizione del Dio della Guerra","Un alleato ottiene +10 a un tiro per colpire."],[7,"Incantesimi del dominio","Libertà di Movimento, Pelle di Pietra"],[8,"Colpo Divino","Una volta per turno +1d8 ai danni dell’arma (2d8 dal livello 14)."],[9,"Incantesimi del dominio","Blocca Mostri"]],"Inganno":[[1,"Benedizione dell’Ingannatore","Azione: concedi vantaggio alle prove di Furtività a una creatura toccata, per 1 ora."],[1,"Incantesimi del dominio","Charme su Persone, Camuffare Se Stesso"],[2,"Incanalare Divinità: Invocare Duplicato","Azione: crei un’illusione di te stesso per 1 minuto."],[3,"Incantesimi del dominio","Immagine Speculare, Passare Senza Tracce"],[5,"Incantesimi del dominio","Dissolvi Magie"],[6,"Incanalare Divinità: Mantello di Ombre","Azione: diventi invisibile fino al tuo prossimo turno."],[7,"Incantesimi del dominio","Porta Dimensionale"],[8,"Colpo Divino","Una volta per turno +1d8 danni da veleno (2d8 dal livello 14)."],[9,"Incantesimi del dominio","Modificare Memoria"],[17,"Duplicato Migliorato","Puoi creare fino a quattro duplicati."]],"Luce":[[1,"Trucchetto Bonus","Impari il trucchetto Luce."],[1,"Lampo di Interdizione","Reazione: svantaggio all’attacco di una creatura entro 9 m; usi pari al mod SAG per riposo lungo."],[1,"Incantesimi del dominio","Mani Brucianti, Fuoco Fatato"],[2,"Incanalare Divinità: Radiosità dell’Alba","Azione: luce che dissipa l’oscurità magica e infligge 2d10 + livello da chierico danni radiosi (TS COS dimezza) alle creature entro 9 m."],[3,"Incantesimi del dominio","Raggio Rovente"],[5,"Incantesimi del dominio","Palla di Fuoco"],[6,"Lampo Migliorato","Puoi usare Lampo di Interdizione anche su un alleato."],[7,"Incantesimi del dominio","Guardiano della Fede, Muro di Fuoco"],[8,"Incantesimi Potenti","Aggiungi il mod SAG ai danni dei trucchetti da chierico."],[9,"Incantesimi del dominio","Colpo Infuocato, Scrutare"],[17,"Corona di Luce","Azione: aura di luce solare per 1 minuto; i nemici entro 18 m hanno svantaggio ai TS contro i tuoi incantesimi di fuoco o radiosi."]],"Natura":[[1,"Accolito della Natura","Impari un trucchetto da druido e competenza in una abilità (Addestrare Animali, Natura, Sopravvivenza)."],[1,"Competenza Bonus","Ottieni competenza nelle armature pesanti."],[1,"Incantesimi del dominio","Amicizia con gli Animali, Parlare con gli Animali"],[2,"Incanalare Divinità: Charme su Animali e Vegetali","Azione: affascini bestie e vegetali entro 9 m (TS Saggezza)."],[3,"Incantesimi del dominio","Pelle Coriacea"],[5,"Incantesimi del dominio","Crescita Vegetale"],[6,"Mitigare Elementi","Reazione: dai a te o a un alleato resistenza ad acido, freddo, fuoco, fulmine o tuono."],[7,"Incantesimi del dominio","Dominare Bestie"],[8,"Colpo Divino","Una volta per turno +1d8 danni da freddo, fuoco o fulmine (2d8 dal livello 14)."],[9,"Incantesimi del dominio","Piaga di Insetti"],[17,"Maestro della Natura","Comandi le creature affascinate da Charme su Animali e Vegetali."]],"Tempesta":[[1,"Competenze Bonus","Ottieni competenza nelle armi da guerra e nelle armature pesanti."],[1,"Collera della Tempesta","Reazione: quando una creatura entro 1,5 m ti colpisce, infligge 2d8 tuono o fulmine (TS DES dimezza). Usi pari al mod SAG per riposo lungo."],[1,"Incantesimi del dominio","Nube di Nebbia, Onda Tonante"],[2,"Incanalare Divinità: Collera Distruttiva","Massimizzi i danni da tuono o fulmine di un tuo effetto invece di tirare."],[3,"Incantesimi del dominio","Folata di Vento, Frantumare"],[5,"Incantesimi del dominio","Invocare Fulmine, Tempesta di Nevischio"],[6,"Colpo Divino","Una volta per turno +1d8 danni da tuono (2d8 dal livello 14)."],[7,"Incantesimi del dominio","Controllare Acqua, Tempesta di Ghiaccio"],[9,"Incantesimi del dominio","Ondata Distruttiva, Piaga di Insetti"],[17,"Nato dalla Tempesta","Hai velocità di volo pari alla tua velocità a terra quando sei all’aperto."]],"Vita":[[1,"Competenza Bonus","Ottieni competenza nelle armature pesanti."],[1,"Discepolo della Vita","Gli incantesimi di cura recuperano 2 + livello dell’incantesimo PF in più."],[1,"Incantesimi del dominio","Benedizione, Cura Ferite"],[2,"Incanalare Divinità: Preservare la Vita","Azione: distribuisci 5 × livello da chierico PF a creature entro 9 m (fino a metà del loro massimo)."],[3,"Incantesimi del dominio","Ristorare Inferiore, Arma Spirituale"],[5,"Incantesimi del dominio","Faro di Speranza"],[6,"Guaritore Benedetto","Quando curi un altro, recuperi anche tu 2 + livello dell’incantesimo PF."],[7,"Incantesimi del dominio","Guardiano della Fede"],[8,"Colpo Divino","Una volta per turno +1d8 danni radiosi (2d8 dal livello 14)."],[9,"Incantesimi del dominio","Cura Ferite di Massa"],[17,"Guarigione Suprema","Quando tiri i dadi per curare, usi il valore massimo."]]}},"Druido":{"label":"Circolo Druidico","lv":2,"opts":{"Terra":[[2,"Trucchetto Bonus","Impari un trucchetto da druido a tua scelta."],[2,"Recupero Naturale","Dopo un riposo breve recuperi slot per un totale di metà livello da druido (per eccesso), nessuno di 6° o più. Una volta per riposo lungo."],[3,"Incantesimi del Circolo","Scegli un terreno (artico, deserto, foresta, montagna, palude, praterìa, Underdark): ottieni incantesimi sempre preparati ai livelli 3, 5, 7, 9."],[6,"Andatura sul Territorio","Il terreno difficile non vegetale non ti rallenta e le piante non ti ostacolano."],[10,"Interdizione della Natura","Non puoi essere affascinato né spaventato da elementali e fate, e sei immune a veleno e malattie."],[14,"Rifugio della Natura","Le bestie e le piante ostili sono costrette a un TS Saggezza prima di attaccarti."]],"Luna":[[2,"Forma Selvatica da Combattimento","Usi Forma Selvatica come azione bonus; mentre sei trasformato puoi spendere slot per recuperare 1d8 PF per livello dello slot."],[2,"Forme del Circolo","Puoi trasformarti in bestie con GS fino a 1 (livello 6: GS pari a livello/3)."],[6,"Attacco Primordiale","I tuoi attacchi in forma di bestia contano come magici."],[10,"Forma Selvatica Elementale","Spendi due usi di Forma Selvatica per trasformarti in un elementale dell’aria, della terra, del fuoco o dell’acqua."],[14,"Mille Forme","Lanci Alterare Se Stesso a volontà."]]}},"Ladro":{"label":"Archetipo Ladresco","lv":3,"opts":{"Ladro":[[3,"Mani Veloci","Con l’Azione Scaltra: Rapidità di Mano, uso di arnesi da scasso, uso di un oggetto."],[3,"Lavoro al Secondo Piano","Scalare non costa movimento extra; il salto in lungo aumenta di un numero di metri pari al mod DES."],[9,"Furtività Suprema","Se ti muovi a metà velocità o meno ottieni vantaggio alle prove di Furtività."],[13,"Usare Oggetto Magico","Ignori i requisiti di classe, razza e livello per usare oggetti magici."],[17,"Riflessi da Furfante","Nel primo round di ogni combattimento hai due turni (iniziativa e iniziativa − 10)."]],"Assassino":[[3,"Competenze Bonus","Ottieni competenza nel kit da camuffamento e nel kit da avvelenatore."],[3,"Assassinare","Vantaggio contro le creature che non hanno ancora agito; i tuoi colpi sui sorpresi sono critici."],[9,"Maestro Infiltrato","Crei identità false e ottieni nuove identità con 7 giorni e 25 mo."],[13,"Impostore","Imiti il discorso, la scrittura e il comportamento di una persona dopo 3 ore di studio."],[17,"Colpo Mortale","Se colpisci un sorpreso, TS Costituzione o danni doppi."]],"Mistificatore Arcano":[[3,"Incantesimi","Lanci incantesimi da mago (Intelligenza), solo di ammaliamento e illusione per la maggior parte; 3 trucchetti e incantesimi conosciuti come da tabella."],[3,"Gioco di Prestigio della Mano Magica","Mano Magica invisibile; con un’azione bonus la usi per rubare, riporre o aprire."],[9,"Imboscata Magica","Se sei nascosto a una creatura, ha svantaggio ai TS contro i tuoi incantesimi."],[13,"Mistificatore Versatile","Azione bonus: sposti Mano Magica su un bersaglio per dare vantaggio ai tuoi attacchi."],[17,"Ladro di Incantesimi","Reazione: annulli un incantesimo lanciato contro di te e lo rubi (riposo lungo)."]]}},"Warlock":{"label":"Patrono Ultraterreno","lv":1,"opts":{"Signore Fatato":[[1,"Presenza Fatata","Azione: cubo di 3 m, TS Saggezza o affascinate/spaventate fino alla fine del tuo prossimo turno. Riposo breve o lungo."],[6,"Fuga Velata","Reazione quando subisci danni: ti teletrasporti fino a 18 m e diventi invisibile. Riposo breve o lungo."],[10,"Difese Seducenti","Non puoi essere affascinato; se qualcuno ci prova puoi ritorcere l’effetto con una reazione (TS Saggezza)."],[14,"Delirio Oscuro","Azione: una creatura entro 18 m (TS Saggezza) è affascinata o spaventata per 1 minuto. Riposo breve o lungo."]],"Immondo":[[1,"Benedizione dell’Oscuro","Quando riduci una creatura ostile a 0 PF ottieni PF temporanei pari al mod CAR + livello da warlock."],[6,"Fortuna dell’Oscuro","Quando fai una prova o un TS, aggiungi 1d10. Riposo breve o lungo."],[10,"Resilienza Immonda","Dopo ogni riposo scegli un tipo di danno: resistenza finché non lo cambi (ignorata da armi magiche o argentate)."],[14,"Scagliare all’Inferno","Quando colpisci con un attacco, il bersaglio sparisce nel piano inferiore e subisce 10d10 danni psichici se non è un immondo. Riposo lungo."]],"Grande Antico":[[1,"Mente Risvegliata","Parli telepaticamente con creature entro 9 m che vedi."],[6,"Interdizione Entropica","Reazione: svantaggio all’attacco di un nemico; se fallisce, il prossimo attacco contro di lui ha vantaggio. Riposo breve o lungo."],[10,"Scudo del Pensiero","I tuoi pensieri non possono essere letti; resistenza ai danni psichici e riflessione dei danni."],[14,"Creare Servitore","Azione: trasformi un umanoide (TS Saggezza) in tuo servitore per un anno. Riposo lungo."]]}}};
const DET={"Campione|Critico Migliorato":[["","I tuoi attacchi con un’arma mettono a segno un colpo critico con un 19 o un 20 sul d20."]],"Campione|Atleta Straordinario":[["","Aggiungi metà del tuo bonus di competenza (per eccesso) a ogni prova di Forza, Destrezza o Costituzione in cui non sei già competente."],["","Il salto in lungo con rincorsa aumenta di 30 cm per ogni punto del tuo modificatore di Forza."]],"Campione|Stile di Combattimento Aggiuntivo":[["","Scegli un secondo stile di combattimento tra quelli del guerriero. Lo selezioni nella scheda, sezione “Stile di combattimento”."]],"Campione|Critico Superiore":[["","I tuoi attacchi con un’arma mettono a segno un colpo critico con un risultato da 18 a 20 sul d20."]],"Campione|Sopravvissuto":[["","All’inizio di ogni tuo turno recuperi 5 + il tuo modificatore di Costituzione in PF, se hai meno della metà dei PF massimi. Non funziona a 0 PF."]],"Maestro di Battaglia|Superiorità in Combattimento":[["","Hai 4 dadi di superiorità (d8) e conosci 3 manovre. Puoi usare una sola manovra per attacco. Ogni dado speso si recupera con un riposo breve o lungo."],["Progressione","Livello 7: 5 dadi e 5 manovre. Livello 10: 7 manovre. Livello 15: 6 dadi e 9 manovre. A ogni nuova manovra puoi sostituirne una già conosciuta."],["CD dei tiri salvezza","8 + bonus di competenza + modificatore di Forza o Destrezza (a tua scelta)."],["Attacco Adescante","Dopo un colpo, il bersaglio fa un TS Saggezza o ha svantaggio ai tiri per colpire contro chiunque tranne te, fino alla fine del tuo prossimo turno. Aggiungi il dado ai danni."],["Attacco con Affondo","Con un attacco in mischia aumenti la portata di 1,5 m; se colpisci aggiungi il dado ai danni."],["Attacco con Finta","Azione bonus: scegli una creatura entro 1,5 m. Hai vantaggio al prossimo attacco contro di lei in questo turno; se colpisci aggiungi il dado ai danni."],["Attacco con Manovra","Dopo un colpo, aggiungi il dado ai danni e un alleato che ti vede o sente può usare la reazione per muoversi fino a metà velocità senza provocare attacchi di opportunità dal bersaglio."],["Attacco con Spazzata","Dopo un colpo in mischia, un’altra creatura entro 1,5 m dal bersaglio e nella tua portata subisce danni pari al dado (stesso tipo), se il tiro l’avrebbe colpita."],["Attacco con Spinta","Dopo un colpo, aggiungi il dado ai danni; un bersaglio Grande o più piccolo fa un TS Forza o viene spinto fino a 4,5 m."],["Attacco Disarmante","Dopo un colpo, aggiungi il dado ai danni; il bersaglio fa un TS Forza o lascia cadere un oggetto che scegli."],["Attacco Minaccioso","Dopo un colpo, aggiungi il dado ai danni; il bersaglio fa un TS Saggezza o è spaventato da te fino alla fine del tuo prossimo turno."],["Attacco Preciso","Prima o dopo un tiro per colpire con un’arma, aggiungi il dado al tiro."],["Attacco Sbilanciante","Dopo un colpo, aggiungi il dado ai danni; un bersaglio Grande o più piccolo fa un TS Forza o cade prono."],["Colpo del Comandante","Rinunci a un attacco e usi un’azione bonus: un alleato che ti vede o sente usa la reazione per attaccare con un’arma, aggiungendo il dado ai danni."],["Colpo Distraente","Dopo un colpo, aggiungi il dado ai danni; il prossimo attacco di un altro alleato contro il bersaglio ha vantaggio (entro l’inizio del tuo prossimo turno)."],["Incoraggiamento","Azione bonus: un alleato che ti vede o sente ottiene PF temporanei pari al dado + il tuo modificatore di Carisma."],["Parata","Reazione: quando una creatura ti infligge danni in mischia, li riduci di dado + modificatore di Destrezza."],["Replica","Reazione: se una creatura ti manca in mischia, la attacchi con un’arma da mischia; se colpisci aggiungi il dado ai danni."],["Scarto Elusivo","Quando ti muovi, tira il dado e aggiungi il risultato alla CA finché non smetti di muoverti."]],"Maestro di Battaglia|Studioso di Guerra":[["","Ottieni competenza in un tipo di strumenti da artigiano a tua scelta."]],"Maestro di Battaglia|Conosci il Tuo Nemico":[["","Se osservi o interagisci con una creatura per almeno 1 minuto fuori dal combattimento, il DM ti dice se è pari, superiore o inferiore a te in due di questi tratti a tua scelta: Forza, Destrezza, Costituzione, Classe Armatura, PF attuali, livelli di classe totali, livelli da guerriero."]],"Maestro di Battaglia|Superiorità in Combattimento Migliorata":[["","Al livello 10 i dadi di superiorità diventano d10, al livello 18 diventano d12."]],"Maestro di Battaglia|Implacabile":[["","Quando tiri l’iniziativa e non hai dadi di superiorità, ne recuperi uno."]],"Cavaliere Mistico|Incantesimi":[["","Lanci incantesimi da mago usando l’Intelligenza (CD = 8 + competenza + mod INT). Conosci 2 trucchetti (3 dal livello 10) e incantesimi di 1° livello o superiore memorizzati, senza libro. Gli slot si recuperano con un riposo lungo."],["Limiti di scuola","Gli incantesimi che impari devono essere di abiurazione o invocazione, tranne quelli ottenuti ai livelli 8, 14 e 20."],["Tabella","Slot e incantesimi conosciuti per livello sono nella tabella del Cavaliere Mistico del Manuale del giocatore."]],"Cavaliere Mistico|Legame con l’Arma":[["","Con un rito di 1 ora (anche in un riposo breve) leghi a te un’arma. Puoi legare fino a 2 armi. Non puoi essere disarmato di quell’arma; se è sullo stesso piano la richiami in mano con un’azione bonus."]],"Cavaliere Mistico|Magia da Guerra":[["","Dopo aver lanciato un trucchetto con l’azione puoi effettuare un attacco con un’arma come azione bonus."]],"Cavaliere Mistico|Colpo Mistico":[["","Quando colpisci una creatura con un’arma, essa ha svantaggio al prossimo tiro salvezza contro un tuo incantesimo prima della fine del tuo prossimo turno."]],"Cavaliere Mistico|Carica Arcana":[["","Quando usi Azione Impetuosa puoi teletrasportarti fino a 9 m in uno spazio libero che vedi, prima o dopo l’azione aggiuntiva."]],"Cavaliere Mistico|Magia da Guerra Migliorata":[["","Dopo aver lanciato un incantesimo con l’azione puoi effettuare un attacco con un’arma come azione bonus."]],"Abiurazione|Interdizione Arcana":[["","Quando lanci un’abiurazione di 1° livello o superiore crei un’interdizione che dura fino al riposo lungo. Ha PF pari a 2 × livello da mago + mod INT e assorbe i danni al posto tuo; i danni in eccesso passano a te."],["Ricarica","Ogni volta che lanci un’abiurazione di 1° livello o superiore, l’interdizione recupera PF pari al doppio del livello dell’incantesimo. Puoi crearne una nuova solo dopo un riposo lungo."]],"Abiurazione|Interdizione Proiettata":[["","Reazione: quando una creatura entro 9 m che vedi subisce danni, la tua Interdizione Arcana assorbe quei danni. Se i danni superano i PF dell’interdizione, il resto va alla creatura."]],"Abiurazione|Abiurazione Migliorata":[["","Aggiungi il bonus di competenza alle prove di caratteristica per Controincantesimo e Dissolvi Magie."]],"Abiurazione|Resistenza agli Incantesimi":[["","Hai vantaggio ai tiri salvezza contro gli incantesimi e resistenza ai danni degli incantesimi."]],"Ammaliamento|Sguardo Ipnotico":[["","Azione: scegli una creatura entro 1,5 m che ti vede o sente. Fa un TS Saggezza (CD incantesimi) o è affascinata fino alla fine del tuo prossimo turno, con velocità 0 e incapacitata. Nei turni successivi usi l’azione per mantenere l’effetto; termina se ti allontani oltre 1,5 m, se la creatura non ti vede o sente, o se subisce danni. Una creatura è colpita una volta per riposo lungo."]],"Ammaliamento|Fascino Istintivo":[["","Reazione: quando una creatura entro 9 m ti attacca, può essere costretta a un TS Saggezza; se lo fallisce sceglie un altro bersaglio entro portata (o l’attacco fallisce). Una creatura è colpita una volta per riposo lungo; le creature immuni all’essere affascinate sono immuni."]],"Ammaliamento|Ammaliamento Condiviso":[["","Quando lanci un incantesimo di ammaliamento di 1° livello o superiore che ha un solo bersaglio, puoi scegliere un secondo bersaglio entro 9 m dal primo."]],"Ammaliamento|Alterare Ricordi":[["","Quando affascini una creatura con un ammaliamento, puoi far sì che non si accorga di essere stata affascinata. Con un’azione puoi anche farle dimenticare parte del tempo trascorso (TS Intelligenza; durata di ricordi cancellati pari a 1 + mod INT ore)."]],"Divinazione|Portento":[["","Dopo ogni riposo lungo tiri 2d20 e annoti i risultati. Prima di un tiro per colpire, prova o TS tuo o di una creatura che vedi, puoi sostituire il d20 con uno dei risultati del Portento (una volta ciascuno). I tiri non usati si perdono al riposo lungo successivo."]],"Divinazione|Divinazione Esperta":[["","Quando lanci una divinazione di 2° livello o superiore recuperi uno slot incantesimo di livello inferiore di almeno 1 livello, fino al 5° livello."]],"Divinazione|Terzo Occhio":[["","Azione: ottieni un beneficio a scelta fino al prossimo riposo breve o lungo: scurovisione fino a 18 m, vista eterea fino a 18 m, lettura (comprendi qualunque scrittura) oppure vedere invisibilità fino a 3 m."]],"Divinazione|Portento Superiore":[["","Il Portento usa 3d20 invece di 2d20."]],"Evocazione|Evocazione Minore":[["","Azione: crei un oggetto inanimato non magico in uno spazio libero entro 3 m. Non più grande di 90 cm per lato e 4,5 kg; dura 1 ora o finché non subisce danni."]],"Evocazione|Trasposizione Benevola":[["","Azione: ti teletrasporti fino a 9 m in uno spazio libero visibile, oppure scambi posto con una creatura Piccola o Media consenziente entro 9 m. Dopo l’uso devi lanciare un’evocazione di 1° livello o superiore o fare un riposo lungo."]],"Evocazione|Evocazione Focalizzata":[["","Se ti concentri su un’evocazione, i danni non spezzano la concentrazione."]],"Evocazione|Evocazioni Perduranti":[["","Le creature che evochi con un incantesimo di evocazione ottengono 30 PF temporanei."]],"Illusione|Illusione Minore Migliorata":[["","Impari Illusione Minore (o un altro trucchetto da mago se già la conosci). Quando la lanci puoi creare insieme suono e immagine."]],"Illusione|Illusioni Duttili":[["","Quando lanci un’illusione con durata di almeno 1 minuto, puoi usare l’azione per modificarla finché la sostieni."]],"Illusione|Sosia Illusorio":[["","Reazione: quando una creatura ti attacca, crei un duplicato illusorio e l’attacco fallisce automaticamente. Si ricarica con un riposo breve o lungo."]],"Illusione|Realtà Illusoria":[["","Azione bonus mentre ti concentri su un’illusione di 1° livello o superiore: un oggetto inanimato non magico che fa parte dell’illusione diventa reale per 1 minuto. Non può infliggere danni né ferire direttamente."]],"Invocazione|Plasmare Incantesimi":[["","Quando lanci un’invocazione che colpisce un’area, scegli un numero di creature che vedi pari a 1 + livello dell’incantesimo: superano automaticamente il tiro salvezza e non subiscono danni."]],"Invocazione|Trucchetto Potente":[["","I trucchetti con un tiro salvezza infliggono metà danni anche se il bersaglio supera il tiro, e nessun effetto aggiuntivo."]],"Invocazione|Invocazione Potente":[["","Aggiungi il tuo modificatore di Intelligenza ai danni di qualsiasi incantesimo da mago di invocazione."]],"Invocazione|Saturazione Magica":[["","Quando lanci un incantesimo da mago di 1°-5° livello che infligge danni, puoi infliggere il massimo dei danni. La prima volta non hai conseguenze. Dal secondo uso prima di un riposo lungo subisci 2d12 danni necrotici per livello dell’incantesimo (+1d12 per livello a ogni uso successivo). Questi danni ignorano resistenze e immunità."]],"Negromanzia|Raccolto Macabro":[["","Una volta per turno, quando uccidi una o più creature con un incantesimo di 1° livello o superiore, recuperi PF pari al doppio del livello dell’incantesimo (il triplo se è di negromanzia). Non vale per costrutti e non morti."]],"Negromanzia|Servitori Non Morti":[["","Aggiungi Animare Morti al libro incantesimi. Quando lo lanci puoi animare un cadavere o mucchio d’ossa in più. Le creature animate hanno PF massimi aumentati del livello da mago e aggiungono la competenza ai danni con le armi."]],"Negromanzia|Impervio alla Non Morte":[["","Hai resistenza ai danni necrotici e i tuoi PF massimi non possono essere ridotti."]],"Negromanzia|Comandare Non Morti":[["","Azione: un non morto entro 18 m che vedi fa un TS Carisma. Se lo supera, non puoi riprovare su di lui; se lo fallisce è amichevole e obbedisce ai tuoi comandi finché non usi di nuovo il privilegio. Se ha Intelligenza 8 o più ha vantaggio al TS; se ha Intelligenza 12 o più ripete il TS ogni ora."]],"Trasmutazione|Alchimia Minore":[["","Per ogni 10 minuti di rito puoi trasformare 30 cm cubi di materiale non magico tra legno, pietra (non gemme), ferro, rame e argento. Dopo 1 ora o se perdi la concentrazione, torna com’era."]],"Trasmutazione|Pietra del Trasmutatore":[["","Con 8 ore di lavoro crei una pietra. Chi la porta ottiene un beneficio a tua scelta: scurovisione 18 m, +3 m di velocità, competenza nei TS Costituzione, oppure resistenza ad acido, freddo, fuoco, fulmine o tuono. Quando lanci una trasmutazione di 1° livello o superiore puoi cambiare il beneficio."]],"Trasmutazione|Muta Forma":[["","Aggiungi Metamorfosi al libro incantesimi. Puoi lanciarlo su te stesso senza slot, una volta per riposo breve o lungo, solo trasformandoti in una bestia di GS 1 o inferiore."]],"Trasmutazione|Maestro Trasmutatore":[["","Azione: consumi la tua Pietra del Trasmutatore per un effetto a scelta: Trasformazione Maggiore, Panacea (rimuove maledizioni, malattie, veleni e ripristina tutti i PF), Ripristino della Vita (come Rianimare Morti senza slot) o Ripristino della Giovinezza (riduci l’età di 3d10 anni)."]],"Abiurazione|Abiuratore Sapiente":[["","Il tempo e il denaro per copiare nel libro incantesimi un incantesimo di abiurazione sono dimezzati."]],"Ammaliamento|Ammaliatore Sapiente":[["","Il tempo e il denaro per copiare nel libro incantesimi un incantesimo di ammaliamento sono dimezzati."]],"Divinazione|Divinatore Sapiente":[["","Il tempo e il denaro per copiare nel libro incantesimi un incantesimo di divinazione sono dimezzati."]],"Evocazione|Evocatore Sapiente":[["","Il tempo e il denaro per copiare nel libro incantesimi un incantesimo di evocazione sono dimezzati."]],"Illusione|Illusionista Sapiente":[["","Il tempo e il denaro per copiare nel libro incantesimi un incantesimo di illusione sono dimezzati."]],"Invocazione|Invocatore Sapiente":[["","Il tempo e il denaro per copiare nel libro incantesimi un incantesimo di invocazione sono dimezzati."]],"Negromanzia|Negromante Sapiente":[["","Il tempo e il denaro per copiare nel libro incantesimi un incantesimo di negromanzia sono dimezzati."]],"Trasmutazione|Trasmutatore Sapiente":[["","Il tempo e il denaro per copiare nel libro incantesimi un incantesimo di trasmutazione sono dimezzati."]],"Discendenza Draconica|Antenato Draconico":[["","Scegli un drago come antenato: determina il tipo di danno dei tuoi privilegi. Parli, leggi e scrivi in Draconico e raddoppi la competenza nelle prove di Carisma con i draghi."],["Argento / Bianco","Freddo"],["Blu / Bronzo","Fulmine"],["Nero / Rame","Acido"],["Oro / Ottone / Rosso","Fuoco"],["Verde","Veleno"]],"Discendenza Draconica|Resilienza Draconica":[["","I tuoi PF massimi aumentano di 1 per ogni livello da stregone. Senza armatura la tua CA è 13 + modificatore di Destrezza."]],"Discendenza Draconica|Affinità Elementale":[["","Quando lanci un incantesimo che infligge danni del tipo del tuo antenato, aggiungi il modificatore di Carisma ai danni. Puoi spendere 1 punto stregoneria per ottenere resistenza a quel tipo per 1 ora."]],"Discendenza Draconica|Ali di Drago":[["","Azione bonus: ti spuntano ali di drago e ottieni velocità di volo pari alla tua velocità attuale. Durano finché non le congedi (azione bonus). Non puoi manifestarle con un’armatura non adatta."]],"Discendenza Draconica|Presenza Draconica":[["","Azione: spendi 5 punti stregoneria per creare un’aura di 18 m che dura 1 minuto (concentrazione). Le creature ostili che iniziano il turno nell’aura o vi entrano fanno un TS Saggezza o sono affascinate o spaventate (a tua scelta). Chi supera il TS è immune per 24 ore."]],"Magia Selvaggia|Impulso di Magia Selvaggia":[["","Una volta per turno, dopo aver lanciato un incantesimo da stregone di 1° livello o superiore, il DM può chiederti di tirare un d20. Con un 1 tiri sulla tabella “Impulsi di Magia Selvaggia” (d100) del Manuale. L’effetto non è influenzato dalla Metamagia e non richiede concentrazione."]],"Magia Selvaggia|Onde di Caos":[["","Ottieni vantaggio a un tiro per colpire, una prova di caratteristica o un tiro salvezza. Si ricarica con un riposo lungo, o quando il DM ti fa tirare sulla tabella degli impulsi dopo un incantesimo di 1° livello o superiore."]],"Magia Selvaggia|Piegare la Fortuna":[["","Reazione: spendi 2 punti stregoneria quando una creatura che vedi tira per colpire, prova o TS. Tira 1d4 e applica il risultato come bonus o penalità al tiro, dopo che ha tirato ma prima degli effetti."]],"Magia Selvaggia|Caos Controllato":[["","Quando tiri sulla tabella degli impulsi, tiri due volte e scegli quale risultato usare."]],"Magia Selvaggia|Bombardamento Magico":[["","Quando tiri i danni di un incantesimo e ottieni il massimo su un dado, puoi ritirare quel dado una volta per turno e aggiungere il nuovo risultato ai danni."]],"Devozione|Arma Consacrata":[["","Azione, spendi un uso di Incanalare Divinità. Per 1 minuto aggiungi il tuo modificatore di Carisma (minimo +1) ai tiri per colpire con un’arma che impugni. L’arma emette luce intensa per 6 m e fioca per altri 6 m, e diventa magica se non lo era. Puoi terminare l’effetto nel tuo turno; finisce se non impugni o porti l’arma o se sei privo di sensi."]],"Devozione|Scacciare i Sacrileghi":[["","Azione, spendi un uso di Incanalare Divinità. Ogni immondo o non morto entro 9 m che ti vede o sente fa un TS Saggezza. Se fallisce è scacciato per 1 minuto o finché non subisce danni: deve allontanarsi il più possibile da te, non può muoversi volontariamente entro 9 m da te, non può fare reazioni e può solo usare Scatto o tentare di liberarsi da effetti che lo bloccano (se non può muoversi usa Schivata)."]],"Devozione|Aura di Devozione":[["","Tu e gli alleati entro 3 m non potete essere affascinati finché sei cosciente. Dal livello 18 il raggio è 9 m."]],"Devozione|Purezza di Spirito":[["","Sei sempre sotto l’effetto di Protezione dal Bene e dal Male."]],"Devozione|Nube Sacra":[["","Azione: per 1 minuto emani luce solare, luce intensa per 9 m e fioca per altri 9 m. I nemici che iniziano il turno nella luce intensa subiscono 10 danni radiosi. Hai vantaggio ai TS contro gli incantesimi di immondi e non morti. Si ricarica con un riposo lungo."]],"Antichi|Collera della Natura":[["","Azione, spendi un uso di Incanalare Divinità. Rampicanti spettrali afferrano una creatura entro 3 m che vedi. La creatura fa un TS Forza o Destrezza (a sua scelta): se fallisce è trattenuta. Ripete il TS alla fine di ogni suo turno; se lo supera si libera e i rampicanti svaniscono."]],"Antichi|Scacciare gli Infedeli":[["","Azione, spendi un uso di Incanalare Divinità. Ogni folletto o immondo entro 9 m che ti sente fa un TS Saggezza. Se fallisce è scacciato per 1 minuto o finché non subisce danni: deve allontanarsi da te il più possibile, non può muoversi volontariamente entro 9 m da te, non può fare reazioni e può solo usare Scatto o tentare di liberarsi da effetti che lo bloccano (se non può muoversi usa Schivata). Se la sua vera forma è nascosta da illusioni o metamorfosi, viene rivelata."]],"Antichi|Aura di Interdizione":[["","Tu e gli alleati entro 3 m avete resistenza ai danni degli incantesimi. Dal livello 18 il raggio è 9 m."]],"Antichi|Sentinella Imperitura":[["","Quando scendi a 0 PF senza morire sul colpo, resti a 1 PF. Una volta per riposo lungo. Inoltre non subisci gli svantaggi dell’età e non puoi essere invecchiato magicamente."]],"Antichi|Campione degli Antichi":[["","Azione: per 1 minuto ti trasformi in una forza antica della natura. All’inizio di ogni tuo turno recuperi 10 PF; gli incantesimi da paladino con tempo di lancio di 1 azione possono essere lanciati con un’azione bonus; i nemici entro 3 m hanno svantaggio ai TS contro i tuoi incantesimi da paladino e le tue opzioni di Incanalare Divinità. Si ricarica con un riposo lungo."]],"Vendetta|Abiurare Nemico":[["","Azione, spendi un uso di Incanalare Divinità. Scegli una creatura entro 18 m che vedi: fa un TS Saggezza (immondi e non morti con svantaggio; immune chi non può essere spaventato). Se fallisce è spaventata per 1 minuto o finché non subisce danni, con velocità 0 e senza bonus alla velocità. Se supera il TS la sua velocità è dimezzata per 1 minuto o finché non subisce danni."]],"Vendetta|Giuramento di Inimicizia":[["","Azione bonus, spendi un uso di Incanalare Divinità. Scegli una creatura entro 3 m che vedi: hai vantaggio ai tiri per colpire contro di lei per 1 minuto o finché scende a 0 PF o perde i sensi."]],"Vendetta|Vendicatore Implacabile":[["","Quando colpisci con un attacco di opportunità puoi muoverti fino a metà della tua velocità subito dopo, come parte della stessa reazione. Questo movimento non provoca attacchi di opportunità."]],"Vendetta|Anima di Vendetta":[["","Reazione: quando una creatura sotto il tuo Giuramento di Inimicizia effettua un attacco, puoi attaccarla con un’arma da mischia se è entro portata."]],"Vendetta|Angelo Vendicatore":[["","Azione: per 1 ora ottieni ali e velocità di volo 18 m. Emani un’aura di minaccia di 9 m: la prima volta che una creatura ostile entra nell’aura o vi inizia il turno in combattimento, fa un TS Saggezza o è spaventata per 1 minuto o finché non subisce danni; i tiri per colpire contro una creatura spaventata hanno vantaggio. Si ricarica con un riposo lungo."]],"Cacciatore|Preda del Cacciatore":[["","Scegli una di queste opzioni:"],["Devastatore dell’Orda","Una volta per turno, quando attacchi con un’arma, puoi attaccare con la stessa arma una creatura diversa entro 1,5 m dal bersaglio originale e nella gittata dell’arma."],["Sterminatore di Colossi","Quando colpisci una creatura con un’arma che ha meno del massimo dei PF, infliggi 1d8 danni extra (una volta per turno)."],["Uccisore di Giganti","Reazione: quando una creatura Grande o più grande entro 1,5 m ti colpisce o ti manca, la attacchi subito dopo, se la vedi."]],"Cacciatore|Tattiche Difensive":[["","Scegli una di queste opzioni:"],["Difesa dal Multiattacco","Quando una creatura ti colpisce, hai +4 alla CA contro gli attacchi successivi di quella creatura per il resto del turno."],["Sfuggire all’Orda","Gli attacchi di opportunità contro di te hanno svantaggio."],["Volontà d’Acciaio","Hai vantaggio ai tiri salvezza contro l’essere spaventato."]],"Cacciatore|Multiattacco":[["","Scegli una di queste opzioni:"],["Raffica","Azione: attacco a distanza contro un qualsiasi numero di creature entro 3 m da un punto che vedi nella gittata. Tiro per colpire separato per ogni bersaglio, con munizioni sufficienti."],["Attacco Turbinante","Azione: un attacco in mischia contro ogni creatura entro 1,5 m da te, con un tiro per colpire separato per ciascuna."]],"Cacciatore|Difesa del Cacciatore Superiore":[["","Scegli una di queste opzioni:"],["Elusione","Nei TS Destrezza per dimezzare i danni non subisci danni se superi il tiro e metà se lo fallisci."],["Opporsi alla Marea","Reazione: quando una creatura ostile ti manca con un attacco in mischia, la costringi a ripetere lo stesso attacco contro un’altra creatura a tua scelta (non lei stessa)."],["Schivata Prodigiosa","Reazione: quando un attaccante che vedi ti colpisce, dimezzi i danni."]],"Signore delle Bestie|Compagno del Ranger":[["","Ottieni una bestia compagna di taglia Media o inferiore con GS 1/4 o meno (esempi: falco, mastino, pantera). Aggiungi il tuo bonus di competenza alla sua CA, ai tiri per colpire, ai danni, ai TS e alle abilità in cui è competente. I suoi PF massimi sono quelli indicati o 4 × il tuo livello da ranger, se maggiori; può spendere Dadi Vita nei riposi brevi."],["Comandi","Agisce nel tuo turno (tua iniziativa). Puoi ordinare dove muoversi (nessuna azione) e con un’azione ordini Aiuto, Attacco, Disimpegno, Scatto o Schivata. Con Attacco Extra attacchi tu stesso mentre ordini l’attacco alla bestia. Se sei incapacitato o assente agisce da sola; usa la reazione senza comando."],["Altro","Viaggi furtivamente a passo normale in compagnia solo della bestia nel tuo terreno prediletto. Se muore, ne leghi un’altra con 8 ore di rito."]],"Signore delle Bestie|Addestramento Straordinario":[["","Nei turni in cui la bestia non attacca, usi un’azione bonus per ordinarle Aiuto, Disimpegno, Scatto o Schivata."]],"Signore delle Bestie|Furia Bestiale":[["","Quando ordini alla bestia di attaccare, effettua due attacchi (o Multiattacco, se lo possiede)."]],"Signore delle Bestie|Condividere Incantesimi":[["","Quando lanci un incantesimo che bersaglia solo te stesso, puoi influenzare anche la bestia compagna se è entro 9 m."]],"Mano Aperta|Tecnica della Mano Aperta":[["","Ogni volta che colpisci con un attacco della Raffica di Colpi puoi imporre un effetto al bersaglio, a scelta:"],["Destrezza","TS Destrezza o cade prono."],["Forza","TS Forza o viene spinto fino a 4,5 m."],["Reazioni","Non può usare reazioni fino alla fine del tuo prossimo turno."]],"Mano Aperta|Integrità del Corpo":[["","Azione: recuperi PF pari a 3 × il tuo livello da monaco. Si ricarica con un riposo lungo."]],"Mano Aperta|Tranquillità":[["","Alla fine di un riposo lungo ottieni l’effetto di Santuario fino al prossimo riposo lungo (CD 8 + competenza + mod SAG). Termina se attacchi o lanci un incantesimo."]],"Mano Aperta|Palmo Tremante":[["","Quando colpisci con un attacco senz’armi puoi spendere 3 punti ki per avviare vibrazioni impercettibili nel bersaglio, che durano un numero di giorni pari al tuo livello da monaco. Con un’azione puoi concluderle se sei sullo stesso piano: il bersaglio fa un TS Costituzione; se fallisce scende a 0 PF, altrimenti subisce 10d10 danni necrotici. Puoi avere un solo bersaglio alla volta e puoi terminare le vibrazioni senza effetto."]],"Ombra|Arti dell’Ombra":[["","Puoi spendere 2 punti ki per lanciare Oscurità, Passo Senza Tracce, Silenzio o Scurovisione senza componenti materiali. Impari anche il trucchetto Illusione Minore."]],"Ombra|Passo dell’Ombra":[["","Azione bonus: se sei in luce fioca o buio, ti teletrasporti fino a 18 m in uno spazio libero visibile anch’esso in luce fioca o buio. Hai vantaggio al primo attacco in mischia prima della fine del turno."]],"Ombra|Manto di Ombre":[["","Azione: se sei in luce fioca o buio diventi invisibile finché non attacchi, lanci un incantesimo o ti trovi in luce intensa."]],"Ombra|Opportunista":[["","Reazione: quando una creatura entro 1,5 m da te viene colpita da un attacco di un’altra creatura, la attacchi in mischia."]],"Quattro Elementi|Discepolo degli Elementi":[["","Conosci Sintonia Elementale e una disciplina elementale. Ne impari un’altra ai livelli 6, 11 e 17 e puoi sostituirne una a ogni nuova disciplina. Ogni disciplina costa punti ki. Per le discipline che lanciano incantesimi puoi spendere ki aggiuntivi per aumentarne il livello (massimo 3 ki aggiuntivi ai livelli 5-8, 4 ai 9-12, 5 ai 13-16, 6 ai 17-20)."],["Sintonia Elementale (0)","Azione: produci un effetto elementale minore (accendere o spegnere una fiamma, muovere aria, terra o acqua, creare un piccolo effetto sensoriale)."],["Colpo della Cenere Turbinante (2 ki)","Lanci Mani Brucianti."],["Pugno dei Quattro Tuoni (2 ki)","Lanci Onda Tonante."],["Pugno dell’Aria Compressa (2 ki + 1 per ki extra)","Azione: una creatura entro 9 m fa un TS Forza o subisce 3d10 danni contundenti, spinta fino a 6 m e prona; +1d10 per ki aggiuntivo."],["Forma del Fiume Fluente (1 ki)","Azione: modifichi acqua e ghiaccio in un’area di 9 m per lato entro 36 m."]],"Quattro Elementi|Discipline Elementali":[["","Impari una nuova disciplina elementale (puoi sostituirne una). Discipline disponibili ora:"],["Sintonia Elementale (0)","Azione: produci un effetto elementale minore (accendere o spegnere una fiamma, muovere aria, terra o acqua, creare un piccolo effetto sensoriale)."],["Colpo della Cenere Turbinante (2 ki)","Lanci Mani Brucianti."],["Gong della Sommità (3 ki)","Lanci Frantumare."],["Morsa del Vento del Nord (3 ki)","Lanci Blocca Persone."],["Pugno dei Quattro Tuoni (2 ki)","Lanci Onda Tonante."],["Pugno dell’Aria Compressa (2 ki + 1 per ki extra)","Azione: una creatura entro 9 m fa un TS Forza o subisce 3d10 danni contundenti, spinta fino a 6 m e prona; +1d10 per ki aggiuntivo."],["Forma del Fiume Fluente (1 ki)","Azione: modifichi acqua e ghiaccio in un’area di 9 m per lato entro 36 m."]],"Quattro Elementi|Discipline Elementali@11":[["","Impari una nuova disciplina elementale (puoi sostituirne una). Discipline disponibili ora:"],["Sintonia Elementale (0)","Azione: produci un effetto elementale minore (accendere o spegnere una fiamma, muovere aria, terra o acqua, creare un piccolo effetto sensoriale)."],["Colpo della Cenere Turbinante (2 ki)","Lanci Mani Brucianti."],["Gong della Sommità (3 ki)","Lanci Frantumare."],["Morsa del Vento del Nord (3 ki)","Lanci Blocca Persone."],["Pugno dei Quattro Tuoni (2 ki)","Lanci Onda Tonante."],["Pugno dell’Aria Compressa (2 ki + 1 per ki extra)","Azione: una creatura entro 9 m fa un TS Forza o subisce 3d10 danni contundenti, spinta fino a 6 m e prona; +1d10 per ki aggiuntivo."],["Forma del Fiume Fluente (1 ki)","Azione: modifichi acqua e ghiaccio in un’area di 9 m per lato entro 36 m."],["Cavalcare il Vento (4 ki)","Lanci Volare su te stesso."],["Fiamma della Fenice (4 ki)","Lanci Palla di Fuoco."],["Postura della Nebbia (4 ki)","Lanci Forma Gassosa su te stesso."]],"Quattro Elementi|Discipline Elementali@17":[["","Impari una nuova disciplina elementale (puoi sostituirne una). Discipline disponibili ora:"],["Sintonia Elementale (0)","Azione: produci un effetto elementale minore (accendere o spegnere una fiamma, muovere aria, terra o acqua, creare un piccolo eff async function shrink(file){
  const bm=await createImageBitmap(file),k=Math.min(1,800/Math.max(bm.width,bm.height));
  const cv=document.createElement("canvas");cv.width=Math.round(bm.width*k);cv.height=Math.round(bm.height*k);
  cv.getContext("2d").drawImage(bm,0,0,cv.width,cv.height);
  return{d:cv.toDataURL("image/jpeg",.75),w:cv.width,h:cv.height};
}
