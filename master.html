<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f0f">
<title>Tavolo del Master</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b0f0f;--panel:#141c1c;--panel2:#1b2626;--ink:#e6e9df;--mute:#97a49f;--line:#33443f;--brass:#d0b25a;--acc:#d98a9a;--pg:#6fcf9f;--al:#8fb0f0;--ne:#d98a9a;--pw:320px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:16px/1.4 "Alegreya Sans",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:Alegreya,Georgia,serif;margin:0}
#view{position:fixed;left:0;top:0;bottom:0;right:var(--pw);overflow:hidden;touch-action:none;cursor:crosshair;background:#070a0a}
body.noini #view{right:0}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#map{display:block;max-width:none;pointer-events:none}
#grid{position:absolute;inset:0;pointer-events:none}
#fog{position:absolute;left:0;top:0;pointer-events:none;opacity:.6}
body.present #fog{opacity:1}
#ring{position:fixed;border:2px solid var(--brass);border-radius:50%;pointer-events:none;display:none;transform:translate(-50%,-50%);box-shadow:0 0 0 1px rgba(0,0,0,.7);z-index:5}
.ic{width:1.3em;height:1.3em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.26em;flex:none}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--brass)}
.btn[aria-pressed=true]{background:var(--brass);color:#1a1405;border-color:var(--brass)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.big{padding:12px 16px;font-size:1.1rem;font-weight:700}
.btn.gold{background:var(--brass);color:#1a1405;border-color:var(--brass);font-weight:700}
.btn.ghost{background:none}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.ui{position:fixed;z-index:10}
#top{left:10px;top:10px;right:calc(var(--pw) + 10px);display:flex;flex-direction:column;gap:6px;pointer-events:none}
body.noini #top{right:10px}
#top>*{pointer-events:auto;align-self:flex-start;max-width:100%}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:rgba(20,28,28,.93);border:1px solid var(--line);border-radius:12px;padding:6px 8px;box-shadow:0 4px 18px rgba(0,0,0,.5)}
.bar .sep{width:1px;align-self:stretch;background:var(--line);margin:0 2px}
.opt{gap:14px}
.opt label{display:flex;align-items:center;gap:7px;color:var(--mute);font-size:.92rem}
.opt input[type=range]{width:130px;accent-color:var(--brass)}
.opt input[type=number]{width:70px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 6px}
.opt input[type=color]{width:38px;height:30px;padding:0;border:1px solid var(--line);background:none;border-radius:6px}
.opt fieldset{border:0;margin:0;padding:0;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.opt fieldset:disabled{opacity:.45}
.msg{color:var(--brass);font-size:.95rem}
body.present #top,body.present .edit-only{display:none!important}
#showui{position:fixed;left:10px;bottom:10px;z-index:11;opacity:.18;display:none}
body.present #showui{display:inline-flex}
#showui:hover{opacity:1}
#empty{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
#empty .card{pointer-events:auto;text-align:center;background:var(--panel);border:1px solid var(--brass);border-radius:14px;padding:28px 32px;max-width:420px;display:grid;gap:12px;box-shadow:0 0 40px rgba(208,178,90,.12)}
#empty h1{font-size:2rem}
#empty p{margin:0;color:var(--mute)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--brass);border-radius:10px;padding:8px 14px;z-index:60;display:none}
/* iniziative */
#ini{position:fixed;right:0;top:0;bottom:0;width:var(--pw);background:var(--panel);border-left:2px solid var(--brass);z-index:12;display:flex;flex-direction:column;box-shadow:-6px 0 24px rgba(0,0,0,.45)}
body.noini #ini{display:none}
#ini2{position:fixed;left:0;top:0;bottom:0;width:var(--pw);background:var(--panel);border-right:2px solid var(--brass);z-index:12;display:none;flex-direction:column;box-shadow:6px 0 24px rgba(0,0,0,.45)}
body.side-l #view{left:var(--pw);right:0}
body.side-b #view{left:var(--pw);right:var(--pw)}
body.side-l #ini{right:auto;left:0;border-left:0;border-right:2px solid var(--brass);box-shadow:6px 0 24px rgba(0,0,0,.45)}
body.side-b #ini2{display:flex}
#sides{display:none;position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:30;gap:4px;background:rgba(20,28,28,.9);border:1px solid var(--line);border-radius:10px;padding:4px;opacity:.22;transition:opacity .2s}
#sides:hover,#sides:focus-within{opacity:1}
body.player #sides{display:flex}
body.player.side-l #sides{left:calc(50% + var(--pw)/2)}
body.player.side-r #sides{left:calc(50% - var(--pw)/2)}
#sides .btn{padding:6px 9px}
#ini header,#ini2 header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
#ini h2,#ini2 h2{font-size:1.5rem;flex:1;color:var(--brass);letter-spacing:.02em}
.round{font-family:Alegreya,serif;font-size:1.15rem;background:var(--bg);border:1px solid var(--brass);border-radius:999px;padding:2px 12px}
.round b{font-size:1.4rem;color:var(--brass)}
#list,#ini2 ol{list-style:none;margin:0;padding:8px;overflow:auto;flex:1;display:grid;gap:6px;align-content:start}
.row{display:grid;grid-template-columns:54px minmax(0,1fr);min-width:0;gap:8px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-left:6px solid var(--c,#888);border-radius:10px;padding:5px 8px;transition:transform .15s}
.row .n{width:100%;height:auto;aspect-ratio:1;border-radius:50%;text-align:center;font-family:Alegreya,serif;font-weight:700;font-size:1.45rem;background:var(--bg);border:2px solid var(--c,#888);color:var(--ink);padding:0}
.row .nm{background:none;border:0;font-family:Alegreya,serif;font-size:1.35rem;font-weight:700;min-width:0;width:100%;padding:2px 0}
.row .sub{grid-column:2;flex-wrap:wrap;display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:0}
.row .sub:empty{display:none}
.row .acts{display:flex;gap:4px;margin-left:auto}
.row .acts .btn{padding:3px 6px}
.row .tag{display:flex;align-items:center;gap:5px;font-size:.76rem;letter-spacing:.07em;text-transform:uppercase;color:var(--brass)}
.row .tag.mute{color:var(--mute)}
.row.hide{opacity:.62;border-style:dashed;border-left-style:solid}
.row.hide .n{border-style:dashed}
#drop{position:fixed;inset:0;z-index:70;background:rgba(10,14,14,.82);display:none;place-items:center;pointer-events:none}
#drop div{border:3px dashed var(--brass);border-radius:18px;padding:40px 54px;font-family:Alegreya,serif;font-size:1.8rem;color:var(--brass);text-align:center;background:var(--panel)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.scard{display:grid;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;align-content:start}
.scard.cur{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass)}
.scard .th{aspect-ratio:4/3;width:100%;border:0;border-radius:6px;background:var(--bg);cursor:pointer;overflow:hidden;display:grid;place-items:center;padding:0;color:var(--mute)}
.scard .th img{width:100%;height:100%;object-fit:cover;display:block}
.scard .acts{display:flex;gap:6px}
.scard input{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0;width:100%;-webkit-user-select:text;user-select:text}
#add .chk{grid-column:1/3;display:flex;align-items:center;gap:8px;color:var(--mute);font-size:.92rem}
#add .chk input{width:auto}
.row.cur{background:linear-gradient(90deg,rgba(208,178,90,.28),var(--panel2));border-color:var(--brass);border-left-color:var(--brass);box-shadow:0 0 0 1px var(--brass),0 0 18px rgba(208,178,90,.35);transform:scale(1.025)}
.row.cur .nm{color:var(--brass);font-size:1.5rem}
.row.dead{opacity:.5;filter:grayscale(1)}
.nmw{display:flex;align-items:center;gap:6px;min-width:0}.nmw .nm{flex:1}.nmw .ic{width:1.5em;height:1.5em;color:var(--mute)}
.nav{display:grid;grid-template-columns:auto 1fr;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
#add{display:grid;grid-template-columns:1fr 54px 90px;gap:6px;padding:10px 12px;border-top:1px solid var(--line)}
#add input,#add select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0;width:100%}
#add .full{grid-column:1/4}
#add .chk{grid-column:1/3;display:flex;align-items:center;gap:8px;color:var(--mute);font-size:.92rem}
#add .chk input{width:auto}
#add button{justify-content:center;padding:6px}
.vide{padding:20px 14px;color:var(--mute);text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.mbox{background:var(--panel);border:1px solid var(--brass);border-radius:12px;width:min(780px,100%);max-height:85vh;overflow:auto;padding:16px;display:grid;gap:10px}
.srow{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center}
.srow input{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;-webkit-user-select:text;user-select:text}
.help{color:var(--mute);font-size:.9rem}
body.player #top,body.player #showui,body.player .nav,body.player .edit-only{display:none!important}
body.player #view{pointer-events:none;cursor:none}
body.player #empty .card{pointer-events:none}
#ptr{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;display:none;z-index:4}
#ptr i{position:absolute;left:-15px;top:-15px;width:30px;height:30px;border-radius:50%;border:3px solid #fff;background:radial-gradient(circle,#fff 0 20%,#ffcf6b 24%,#ff8a1f 70%);box-shadow:0 0 0 2px rgba(0,0,0,.55),0 0 22px 8px rgba(255,170,50,.85)}
#ptr .pg{position:absolute;left:-30px;top:-30px;width:60px;height:60px;border-radius:50%;border:4px solid #ffcf6b;animation:pg .9s ease-out forwards}
@keyframes pg{from{transform:scale(.3);opacity:1}to{transform:scale(3.4);opacity:0}}
.guide{display:grid;gap:14px}
.guide h3{color:var(--brass);font-size:1.15rem;margin-bottom:4px}
.guide p,.guide li{margin:0;color:var(--ink)}
.guide ul{margin:0;padding-left:20px;display:grid;gap:3px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;align-items:center}
.keys span{color:var(--mute)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.stats{grid-column:1/3;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.stats .ic{width:1.05em;height:1.05em;color:var(--mute)}
.stats input.st{width:46px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 4px;text-align:center;font-size:.95rem;-moz-appearance:textfield;appearance:textfield}
.stats input.st::-webkit-inner-spin-button,#add input::-webkit-inner-spin-button{display:none}
.stats .sl{color:var(--mute)}
.stats .btn{padding:3px 9px;font-weight:700}
.stats .dm{display:flex;gap:5px;margin-left:auto}
.hb{grid-column:1/3;height:5px;background:var(--bg);border-radius:3px;overflow:hidden}
.hb i{display:block;height:100%;transition:width .2s}
#add .two{grid-column:1/4;display:flex;gap:6px}
.av{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid var(--c,#888);flex:none;background:var(--bg);display:block}
.row.cur .av{width:46px;height:46px;border-color:var(--brass)}
.avb{padding:0;border:0;background:none;display:block;border-radius:50%;cursor:pointer;flex:none}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.pcard{display:grid;gap:4px;justify-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 6px 8px;position:relative}
.pcard.on{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass)}
.pcard .pimg{width:84px;height:84px;border-radius:50%;object-fit:cover;border:2px solid var(--brass);cursor:pointer;background:var(--bg);padding:0}
.pcard .nm2{font-size:.9rem;text-align:center;word-break:break-word}
.pcard .x{position:absolute;right:3px;top:3px;padding:2px 5px}
.lrow{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:start;padding:6px 8px;border-bottom:1px solid var(--line)}
.lrow time{color:var(--mute);font-variant-numeric:tabular-nums}
.lrow.nota{background:rgba(208,178,90,.1)}
.lrow.nota span:before{content:"Nota · ";color:var(--brass);font-weight:700}
.lrow.mappa span{color:var(--al)}.lrow.pf span{color:var(--ne)}.lrow.scontro span{color:var(--brass)}
.lday{font-family:Alegreya,serif;color:var(--brass);font-size:1.1rem;padding:10px 8px 2px;text-transform:capitalize}
.llist{max-height:48vh;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--bg);-webkit-user-select:text;user-select:text}
.lform{display:flex;gap:6px}.lform input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;-webkit-user-select:text;user-select:text}
#act{position:absolute;inset:0;z-index:20;display:none;pointer-events:none;overflow:hidden}
#act.on{display:block}
#act .shade{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(5,8,10,.42),rgba(5,8,10,.9));opacity:0;transition:opacity .7s}
#act.in .shade{opacity:1}
#act .cast{position:absolute;left:0;right:0;bottom:27%;display:flex;justify-content:center;align-items:flex-end;gap:2vw;padding:0 3vw}
#act .fig{flex:0 1 230px;max-width:21%;min-width:70px;aspect-ratio:3/4;border:3px solid var(--brass);border-radius:999px 999px 14px 14px;overflow:hidden;position:relative;background:#101616;box-shadow:0 14px 44px rgba(0,0,0,.75),0 0 0 4px rgba(0,0,0,.5);opacity:0;transform:translateY(70px) scale(.94);transition:filter .45s,box-shadow .45s}
#act.in .fig{animation:figin .85s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*.2s + .3s)}
#act .fig img{width:100%;height:100%;object-fit:cover;display:block;animation:breath 6s ease-in-out infinite alternate}
#act .fig .pl{position:absolute;left:0;right:0;bottom:0;text-align:center;background:linear-gradient(transparent,rgba(0,0,0,.9));padding:26px 6px 9px;font-family:Alegreya,Georgia,serif;font-weight:700;font-size:clamp(14px,1.7vw,24px);color:var(--brass)}
#act .fig.talk{box-shadow:0 14px 44px rgba(0,0,0,.75),0 0 44px 8px rgba(208,178,90,.6);filter:brightness(1.08)}
#act .fig.dim{filter:brightness(.42) saturate(.55)}
#act .cap{position:absolute;left:50%;bottom:4.5%;width:min(90%,1150px);transform:translate(-50%,16px);background:rgba(12,18,18,.94);border:2px solid var(--brass);border-radius:16px;padding:14px 26px 20px;box-shadow:0 10px 50px rgba(0,0,0,.7);opacity:0;transition:opacity .45s,transform .45s}
#act .cap.on{opacity:1;transform:translate(-50%,0)}
#act .who{font-family:Alegreya,Georgia,serif;color:var(--brass);font-weight:700;font-size:clamp(16px,1.9vw,28px);margin-bottom:2px;letter-spacing:.03em}
#act .cap p{margin:0;font-family:Alegreya,Georgia,serif;font-size:clamp(20px,2.8vw,44px);line-height:1.3;min-height:1.3em;color:var(--ink)}
#act .cap p.typing:after{content:"▍";color:var(--brass);margin-left:2px;animation:bl 1s steps(1) infinite}
@keyframes figin{to{opacity:1;transform:none}}
@keyframes breath{from{transform:scale(1)}to{transform:scale(1.06)}}
@keyframes bl{50%{opacity:0}}
#stagebar{position:fixed;left:calc((100vw - var(--pw))/2);transform:translateX(-50%);bottom:14px;z-index:45;width:min(880px,calc(100vw - var(--pw) - 28px));background:rgba(14,20,20,.97);border:2px solid var(--brass);border-radius:14px;padding:10px 12px;display:grid;gap:8px;box-shadow:0 10px 40px rgba(0,0,0,.7)}
body.noini #stagebar{left:50%;width:min(880px,calc(100vw - 28px))}
#stagebar[hidden],body.player #stagebar{display:none!important}
#stagebar .pv{color:var(--ink);font-family:Alegreya,serif;font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stagebar .row2{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#stagebar input{flex:1;min-width:160px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;-webkit-user-select:text;user-select:text}
.scn{display:grid;grid-template-columns:200px 1fr;gap:14px}
@media(max-width:700px){.scn{grid-template-columns:1fr}}
.scn .lst{display:grid;gap:6px;align-content:start}
.scn .lst .btn{justify-content:flex-start;white-space:normal;text-align:left}
.scn .ed{display:grid;gap:8px;align-content:start}
.scn textarea,.scn .ed input.t{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;-webkit-user-select:text;user-select:text;min-height:0}
.scn textarea{min-height:160px;font-size:1rem;resize:vertical}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:grid;gap:2px;justify-items:center;background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:6px;cursor:pointer;width:84px;font-size:.8rem}
.chip img{width:52px;height:52px;border-radius:50%;object-fit:cover}
.chip[aria-pressed=true]{border-color:var(--brass);background:rgba(208,178,90,.15)}
kbd{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:.85rem}
</style>
</head>
<body>
<div id="view">
  <div id="stage"><img id="map" alt=""><div id="grid"></div><canvas id="fog"></canvas><div id="ptr"><i></i></div></div>
  <div id="act" aria-live="polite"><div class="shade"></div><div class="cast"></div><div class="cap"><div class="who"></div><p></p></div></div>
  <div id="empty"><div class="card"><h1>Tavolo del Master</h1><p>Carica una o più mappe: copriranno tutto lo schermo. Poi aggiungi griglia e nebbia.</p><div><button class="btn gold big" id="e-load"></button></div><p class="help">Trascina qui le immagini, incollale con Ctrl+V o scegli più file insieme.</p></div></div>
</div>
<div id="ring"></div>
<div class="ui" id="top"></div>
<aside id="ini">
  <header><h2>Iniziativa</h2><span class="round">Round <b id="rd">1</b></span></header>
  <ol id="list"></ol>
  <div class="nav"><button class="btn big" id="prev" aria-label="Turno precedente"></button><button class="btn gold big" id="next"></button></div>
  <form id="add" class="edit-only" autocomplete="off">
    <input id="a-name" class="full" placeholder="Nome (es. Goblin)" aria-label="Nome">
    <select id="a-type" aria-label="Tipo"><option value="pg">Eroe</option><option value="ne">Nemico</option><option value="al">Alleato</option></select>
    <input id="a-qty" type="number" min="1" max="20" value="1" aria-label="Quantità" title="Quantità">
    <input id="a-init" type="number" step="any" placeholder="Init." aria-label="Iniziativa" title="Iniziativa">
    <div class="two"><input id="a-hp" type="number" min="0" placeholder="PF" aria-label="Punti ferita" title="Punti ferita"><input id="a-ac" type="number" min="0" placeholder="CA" aria-label="Classe armatura" title="Classe armatura"></div>
    <label class="chk"><input id="a-hide" type="checkbox"><span>Nascosto ai giocatori</span></label>
    <button class="btn gold" type="submit" id="a-btn"></button>
  </form>
  <div class="nav edit-only" style="grid-template-columns:1fr;padding-bottom:0"><button class="btn ghost" id="impro"></button></div>
  <input type="file" id="impf" accept=".json,application/json" hidden>
  <div class="nav edit-only" style="grid-template-columns:1fr 1fr"><button class="btn ghost" id="newfight"></button><button class="btn ghost" id="hideini"></button></div>
</aside>
<button class="btn" id="showui" aria-label="Mostra i comandi"></button>
<div id="toast" role="status"></div>
<aside id="ini2" aria-hidden="true"></aside>
<div id="sides" role="group" aria-label="Dove mostrare le iniziative"></div>
<div id="stagebar" hidden></div>
<div class="modal" id="modal" hidden></div>
<input type="file" id="file" accept="image/*" multiple hidden>
<div id="drop"><div>Rilascia qui le mappe per caricarle</div></div>
<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const h=(t,p={},...k)=>{const e=document.createElement(t);for(const[a,v]of Object.entries(p)){if(a.startsWith("on"))e.addEventListener(a.slice(2),v);else if(a==="kids")e.append(...v);else if(a in e)e[a]=v;else e.setAttribute(a,v)}e.append(...k);return e};
const ICONS={
 image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 9"/>',
 eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
 cloud:'<path d="M7 18a4 4 0 010-8 5.5 5.5 0 0110.6 1.3A3.4 3.4 0 0117 18z"/>',
 cell:'<rect x="5" y="5" width="14" height="14" rx="1"/><path d="M9 12h6M12 9v6"/>',
 move:'<path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/>',
 grid:'<path d="M4 9h16M4 15h16M9 4v16M15 4v16"/><rect x="4" y="4" width="16" height="16" rx="1"/>',
 lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',
 unlock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 017.6-1.7"/>',
 undo:'<path d="M9 7L4 12l5 5"/><path d="M4 12h9a5.5 5.5 0 010 11h-3"/>',
 expand:'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
 folder:'<path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>',
 next:'<path d="M5 5l8 7-8 7zM16 5v14"/>',
 prev:'<path d="M19 5l-8 7 8 7zM8 5v14"/>',
 trash:'<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 panel:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/>',
 skull:'<path d="M12 3a7 7 0 00-4 12.7V19h8v-3.3A7 7 0 0012 3z"/><circle cx="9.5" cy="11" r="1.2"/><circle cx="14.5" cy="11" r="1.2"/>',
 swords:'<g><path d="M9.5 17.5L21 6V3h-3L6.5 14.5"/><path d="M11 19l-6-6"/><path d="M8 16l-4 4"/><path d="M5 21l-2-2"/></g><g transform="translate(24 0) scale(-1 1)"><path d="M9.5 17.5L21 6V3h-3L6.5 14.5"/><path d="M11 19l-6-6"/><path d="M8 16l-4 4"/><path d="M5 21l-2-2"/></g>',
 eyeoff:'<path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0112 5c6.4 0 10 7 10 7a17 17 0 01-3 3.8M6.5 6.6C3.700 8.400 2 12 2 12s3.600 7 10 7c1.700 0 3.200-.4 4.500-1.100"/><path d="M9.900 9.900a3 3 0 004.200 4.200"/>',
 check:'<path d="M5 12l5 5 9-10"/>',
 pin:'<path d="M12 21s-6-5.500-6-10.500a6 6 0 0112 0C18 15.500 12 21 12 21z"/><circle cx="12" cy="10.500" r="2.200"/>',
 help:'<circle cx="12" cy="12" r="9.500"/><path d="M9.300 9.300a2.800 2.800 0 115 1.700c-.8.900-2.300 1.300-2.300 2.800M12 17.200v.1"/>',
 heart:'<path d="M12 20.500S4.500 16 4.500 10.200A4 4 0 0112 8a4 4 0 017.500 2.200C19.500 16 12 20.500 12 20.500z"/>',
 shield:'<path d="M12 3l7 3v6c0 4.500-3 7.500-7 9-4-1.500-7-4.500-7-9V6z"/>',
 sidel:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>',
 sider:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/>',
 sideb:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16M16 4v16"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.400 3.600-7 8-7s8 2.600 8 7"/>',
 book:'<path d="M12 6.500C10 5 7 4.500 4 4.500v14c3 0 6 .5 8 2 2-1.500 5-2 8-2v-14c-3 0-6 .5-8 2z"/><path d="M12 6.500v14"/>',
 film:'<rect x="3" y="8" width="18" height="12" rx="2"/><path d="M3 12h18M6 8l3-4M11 8l3-4M16 8l3-4"/>',
 tv:'<rect x="3" y="4.500" width="18" height="12" rx="2"/><path d="M8 20.500h8M12 16.500v4"/>'
};
const ico=k=>{const e=document.createElementNS("http://www.w3.org/2000/svg","svg");e.setAttribute("viewBox","0 0 24 24");e.setAttribute("class","ic");e.setAttribute("aria-hidden","true");e.innerHTML=ICONS[k]||"";return e};
const PLAYER=new URLSearchParams(location.search).has("giocatori");
let BC=null;try{BC=new BroadcastChannel("tavolo-master")}catch(e){}
const send=m=>{if(BC&&!PLAYER)try{BC.postMessage(m)}catch(e){}};
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lsSet=(k,v)=>{if(PLAYER)return;try{localStorage.setItem(k,v)}catch(e){}};
const toast=(t,ms=2200)=>{const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",ms)};

/* ---------- archivio (IndexedDB) ---------- */
const DB=new Promise((res,rej)=>{try{const r=indexedDB.open("tavolo-master",1);r.onupgradeneeded=()=>r.result.createObjectStore("scenes",{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
const tx=async(m,f)=>{const db=await DB;return new Promise((res,rej)=>{const t=db.transaction("scenes",m),q=f(t.objectStore("scenes"));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})};
const dbAll=()=>tx("readonly",s=>s.getAll()),dbGet=id=>tx("readonly",s=>s.get(id)),dbPut=o=>tx("readwrite",s=>s.put(o)),dbDel=id=>tx("readwrite",s=>s.delete(id));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- stato ---------- */
const view=$("#view"),stage=$("#stage"),mapEl=$("#map"),gridEl=$("#grid"),fogC=$("#fog"),fctx=fogC.getContext("2d"),ring=$("#ring");
const ptrEl=$("#ptr");let pp=null;
function placePtr(){if(!pp){ptrEl.style.display="none";return}ptrEl.style.display="block";ptrEl.style.transform="translate("+pp[0]+"px,"+pp[1]+"px) scale("+(1/zoom)+")"}
function setPtr(x,y,ping){pp=[x,y];placePtr();if(ping){const r=h("span",{class:"pg"});ptrEl.append(r);r.addEventListener("animationend",()=>r.remove())}}
function ptrOff(){pp=null;placePtr()}
const baseC=document.createElement("canvas"),bctx=baseC.getContext("2d");
const FOG="#06090b",FOG0="rgba(6,9,11,0)",MAXFOG=2048,MAXIMG=4096;
let sc=null,iw=0,ih=0,fw=0,fh=0,zoom=1,tx0=0,ty0=0,fitMode="cover",manual=false;
let strokes=[],tool="reveal",brush={d:90,soft:true},spaceDown=false,saveT=0;
const defGrid=()=>({on:false,size:70,ox:0,oy:0,color:"#ffffff",alpha:.5,w:1,locked:false});

/* ---------- scene ---------- */
function readBlob(b){return new Promise((res,rej)=>{const u=URL.createObjectURL(b),im=new Image();im.onload=()=>res({im,u});im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("img"))};im.src=u})}
async function normImage(file){
  const {im,u}=await readBlob(file);let w=im.naturalWidth,hh=im.naturalHeight;
  if(Math.max(w,hh)<=MAXIMG){URL.revokeObjectURL(u);return file}
  const k=MAXIMG/Math.max(w,hh),c=document.createElement("canvas");c.width=Math.round(w*k);c.height=Math.round(hh*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
  return new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",.9));
}
async function thumb(blob){
  try{const {im,u}=await readBlob(blob),k=Math.min(1,240/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.naturalWidth*k));c.height=Math.max(1,Math.round(im.naturalHeight*k));c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);return await new Promise(r=>c.toBlob(r,"image/jpeg",.75))}catch(e){return null}
}
const isImg=f=>/^image\//.test(f.type||"")||/\.(jpe?g|png|webp|gif|avif|bmp)$/i.test(f.name||"");
async function newScenes(files){
  if(PLAYER)return;
  files=[...files].filter(isImg);
  if(!files.length){toast("Scegli un file immagine (JPG, PNG, WebP)",3000);return}
  toast("Carico "+(files.length>1?files.length+" mappe…":"la mappa…"),8000);
  let first=null,n=0,bad=0;
  for(const f of files){
    try{
      const img=await normImage(f),name=(f.name||"Mappa").replace(/\.[^.]+$/,"").slice(0,60)||"Mappa";
      const o={id:uid(),name,img,th:await thumb(img),fog:null,grid:defGrid(),upd:Date.now()+n};
      await dbPut(o);if(!first)first=o;n++;
    }catch(e){bad++}
  }
  if(first){await openScene(first);logEv("Nuova mappa caricata: "+first.name+(n>1?" (e altre "+(n-1)+")":""),"mappa")}
  toast(n?(n===1?"Mappa caricata: "+first.name:n+" mappe caricate: le trovi tutte in “Scene”")+(bad?" ("+bad+" non leggibili)":""):"Immagine non leggibile: prova con JPG, PNG o WebP",4000);
}
const newScene=f=>newScenes([f]);
async function openScene(o){
  sc=o;if(!sc.grid)sc.grid=defGrid();
  const {im,u}=await readBlob(o.img);
  if(mapEl.dataset.u)URL.revokeObjectURL(mapEl.dataset.u);
  mapEl.src=u;mapEl.dataset.u=u;iw=im.naturalWidth;ih=im.naturalHeight;mapEl.width=iw;mapEl.height=ih;
  stage.style.width=iw+"px";stage.style.height=ih+"px";
  const k=Math.min(1,MAXFOG/Math.max(iw,ih));fw=Math.round(iw*k);fh=Math.round(ih*k);
  for(const c of[fogC,baseC]){c.width=fw;c.height=fh}
  fogC.style.width=iw+"px";fogC.style.height=ih+"px";
  bctx.globalCompositeOperation="source-over";bctx.clearRect(0,0,fw,fh);
  let loaded=false;
  if(o.fog){try{const bm=await createImageBitmap(o.fog);bctx.drawImage(bm,0,0,fw,fh);loaded=true}catch(e){}}
  if(!loaded){bctx.fillStyle=FOG;bctx.fillRect(0,0,fw,fh)}
  strokes=[];renderFog();applyGrid();$("#empty").style.display="none";if(!o.th)thumb(o.img).then(t=>{if(t){o.th=t;dbPut(o).catch(()=>{})}});
  manual=false;fit(fitMode);lsSet("tavolo-scene",sc.id);drawBars();syncAll();
}
function scheduleSave(){clearTimeout(saveT);saveT=setTimeout(saveNow,700)}
function saveNow(){
  if(!sc||PLAYER)return;sc.upd=Date.now();
  fogC.toBlob(b=>{if(b)sc.fog=b;dbPut(sc).catch(()=>toast("Salvataggio non riuscito: memoria piena?",3500))},"image/png");
}

/* ---------- vista: adatta, zoom, sposta ---------- */
function applyView(){stage.style.transform="translate("+tx0+"px,"+ty0+"px) scale("+zoom+")";placePtr();sendView()}
let vq=0;
function sendView(){if(PLAYER||vq||!iw)return;vq=requestAnimationFrame(()=>{vq=0;send({t:"view",x:-tx0/zoom,y:-ty0/zoom,w:view.clientWidth/zoom,h:view.clientHeight/zoom})})}
async function syncAll(){
  if(PLAYER)return;sendStage();
  if(!sc){send({t:"empty"});sendIni();return}
  const fb=await new Promise(r=>fogC.toBlob(r,"image/png"));
  send({t:"scene",img:sc.img,fog:fb,grid:sc.grid});sendIni();sendView();
}
async function syncFog(){if(PLAYER||!sc)return;const fb=await new Promise(r=>fogC.toBlob(r,"image/png"));send({t:"fog",b:fb})}
function pFit(){
  if(!iw||!pview)return;const vw=view.clientWidth,vh=view.clientHeight,z=Math.min(vw/pview.w,vh/pview.h);
  zoom=z;tx0=(vw-pview.w*z)/2-pview.x*z;ty0=(vh-pview.h*z)/2-pview.y*z;stage.style.transform="translate("+tx0+"px,"+ty0+"px) scale("+zoom+")";placePtr();
}
let pview=null;
function fit(mode){
  if(PLAYER){pFit();return}
  if(!iw)return;fitMode=mode||fitMode;const vw=view.clientWidth,vh=view.clientHeight;
  zoom=fitMode==="cover"?Math.max(vw/iw,vh/ih):Math.min(vw/iw,vh/ih);
  tx0=(vw-iw*zoom)/2;ty0=(vh-ih*zoom)/2;manual=false;applyView();
}
function zoomAt(cx,cy,f){const z=Math.max(.05,Math.min(10,zoom*f)),r=z/zoom;tx0=cx-(cx-tx0)*r;ty0=cy-(cy-ty0)*r;zoom=z;manual=true;applyView()}
const toImg=(cx,cy)=>{const r=view.getBoundingClientRect();return[(cx-r.left-tx0)/zoom,(cy-r.top-ty0)/zoom]};
addEventListener("resize",()=>{if(!manual)fit()});

/* ---------- griglia ---------- */
function applyGrid(){
  if(!sc)return;send({t:"grid",g:sc.grid});const g=sc.grid;gridEl.style.display=g.on?"block":"none";if(!g.on)return;
  const lw=Math.max(1,Math.round(iw/1400*g.w)),c=g.color;
  gridEl.style.opacity=g.alpha;
  gridEl.style.backgroundImage="linear-gradient(to right,"+c+" 0,"+c+" "+lw+"px,transparent "+lw+"px),linear-gradient(to bottom,"+c+" 0,"+c+" "+lw+"px,transparent "+lw+"px)";
  gridEl.style.backgroundSize=g.size+"px "+g.size+"px";gridEl.style.backgroundPosition=g.ox+"px "+g.oy+"px";
}
const wrap=(v,m)=>((v%m)+m)%m;
function gridChange(p){if(!sc||sc.grid.locked)return;Object.assign(sc.grid,p);sc.grid.size=Math.max(10,Math.min(600,sc.grid.size));sc.grid.ox=wrap(sc.grid.ox,sc.grid.size);sc.grid.oy=wrap(sc.grid.oy,sc.grid.size);applyGrid();scheduleSave()}

/* ---------- nebbia ---------- */
function stamp(ctx,s,x,y){
  const k=fw/iw,r=s.r*k;ctx.beginPath();
  if(s.soft){const g=ctx.createRadialGradient(x*k,y*k,r*.4,x*k,y*k,r);g.addColorStop(0,FOG);g.addColorStop(1,FOG0);ctx.fillStyle=g}else ctx.fillStyle=FOG;
  ctx.arc(x*k,y*k,r,0,Math.PI*2);ctx.fill();
}
function seg(ctx,s,a,b){
  const step=Math.max(1,s.r*.22),dx=b[0]-a[0],dy=b[1]-a[1],n=Math.max(1,Math.ceil(Math.hypot(dx,dy)/step));
  for(let i=(a===b?0:1);i<=n;i++)stamp(ctx,s,a[0]+dx*i/n,a[1]+dy*i/n);
}
function applyStroke(ctx,s,from){
  ctx.save();ctx.globalCompositeOperation=s.m==="r"?"destination-out":"source-over";ctx.fillStyle=FOG;
  const k=fw/iw;
  if(s.all)ctx.fillRect(0,0,fw,fh);
  else if(s.rect)ctx.fillRect(s.rect[0]*k,s.rect[1]*k,s.rect[2]*k,s.rect[3]*k);
  else{const p=s.pts;if(from==null){seg(ctx,s,p[0],p[0]);for(let i=1;i<p.length;i++)seg(ctx,s,p[i-1],p[i])}else for(let i=Math.max(1,from);i<p.length;i++)seg(ctx,s,p[i-1],p[i])}
  ctx.restore();
}
function renderFog(){fctx.clearRect(0,0,fw,fh);fctx.drawImage(baseC,0,0);for(const s of strokes)applyStroke(fctx,s)}
function commit(s){strokes.push(s);if(strokes.length>30){applyStroke(bctx,strokes.shift())}scheduleSave()}
function undo(){if(!sc||!strokes.length){toast("Niente da annullare");return}strokes.pop();renderFog();scheduleSave();syncFog()}
function fogAll(reveal){if(!sc)return;const s={m:reveal?"r":"c",all:true};applyStroke(fctx,s);commit(s);send({t:"op",s})}
function cellAt(x,y,cover){
  const g=sc.grid;if(!g.on){toast("Attiva la griglia per usare la modalità Cella");return}
  const cx=Math.floor((x-g.ox)/g.size),cy=Math.floor((y-g.oy)/g.size),s={m:cover?"c":"r",rect:[g.ox+cx*g.size,g.oy+cy*g.size,g.size,g.size]};
  applyStroke(fctx,s);commit(s);send({t:"op",s});
}

/* ---------- puntatore ---------- */
const ptrs=new Map();let gest=null;
const R=()=>brush.d/2;
function ringShow(e){if(!(tool==="reveal"||tool==="cover")||!sc){ring.style.display="none";return}ring.style.display="block";ring.style.width=brush.d+"px";ring.style.height=brush.d+"px";ring.style.left=e.clientX+"px";ring.style.top=e.clientY+"px";ring.style.borderColor=tool==="cover"?"var(--acc)":"var(--brass)"}
view.addEventListener("contextmenu",e=>e.preventDefault());
view.addEventListener("pointerenter",ringShow);
view.addEventListener("pointerleave",()=>{ring.style.display="none";if(tool==="point"&&!PLAYER){ptrOff();send({t:"ptr",off:true})}});
view.addEventListener("pointerdown",e=>{
  if(!sc||PLAYER)return;view.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){gest=null;const[a,b]=[...ptrs.values()];gest={t:"pinch",d:Math.hypot(a.x-b.x,a.y-b.y),z:zoom,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2,tx:tx0,ty:ty0};return}
  if(ptrs.size>2)return;
  const pan=e.button===1||e.button===2||spaceDown||tool==="pan";
  if(pan){gest={t:"pan",x:e.clientX,y:e.clientY,tx:tx0,ty:ty0};view.style.cursor="grabbing";return}
  const[x,y]=toImg(e.clientX,e.clientY);
  if(tool==="point"){setPtr(x,y,true);send({t:"ptr",x,y,ping:true});return}
  if(tool==="reveal"||tool==="cover"){
    const s={m:tool==="reveal"?"r":"c",r:R()/zoom,soft:brush.soft,pts:[[x,y]]};gest={t:"draw",s,n:0};applyStroke(fctx,s,null);send({t:"sb",s:{m:s.m,r:s.r,soft:s.soft,pts:[[x,y]]}});
  }else if(tool==="cell"){cellAt(x,y,e.shiftKey)}
  else if(tool==="grid"){if(sc.grid.locked){toast("La griglia è bloccata: sbloccala per spostarla");return}gest={t:"grid",x:e.clientX,y:e.clientY,ox:sc.grid.ox,oy:sc.grid.oy}}
});
view.addEventListener("pointermove",e=>{
  ringShow(e);if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(tool==="point"&&sc&&!PLAYER&&!gest){const[px,py]=toImg(e.clientX,e.clientY);setPtr(px,py);send({t:"ptr",x:px,y:py})}
  if(!gest)return;
  if(gest.t==="pinch"&&ptrs.size>=2){const[a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y),r=view.getBoundingClientRect(),cx=(a.x+b.x)/2-r.left,cy=(a.y+b.y)/2-r.top,z=Math.max(.05,Math.min(10,gest.z*d/gest.d)),px=(gest.cx-r.left-gest.tx)/gest.z,py=(gest.cy-r.top-gest.ty)/gest.z;zoom=z;tx0=cx-px*z;ty0=cy-py*z;manual=true;applyView();return}
  if(gest.t==="pan"){tx0=gest.tx+e.clientX-gest.x;ty0=gest.ty+e.clientY-gest.y;manual=true;applyView()}
  else if(gest.t==="draw"){const[x,y]=toImg(e.clientX,e.clientY),p=gest.s.pts,l=p[p.length-1];if(Math.hypot(x-l[0],y-l[1])*zoom>=2){p.push([x,y]);applyStroke(fctx,gest.s,p.length-1);send({t:"sp",p:[x,y]})}}
  else if(gest.t==="grid"){const g=sc.grid;g.ox=wrap(gest.ox+(e.clientX-gest.x)/zoom,g.size);g.oy=wrap(gest.oy+(e.clientY-gest.y)/zoom,g.size);applyGrid()}
});
function endPtr(e){
  ptrs.delete(e.pointerId);
  if(gest&&gest.t==="draw"){commit(gest.s)}else if(gest&&gest.t==="grid"){scheduleSave();drawBars()}
  if(ptrs.size<2&&gest&&gest.t==="pinch")gest=null;else if(!ptrs.size)gest=null;
  view.style.cursor="";
}
view.addEventListener("pointerup",endPtr);view.addEventListener("pointercancel",endPtr);
view.addEventListener("wheel",e=>{if(!sc||PLAYER)return;e.preventDefault();const r=view.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-e.deltaY*.0016))},{passive:false});
let dragN=0;
const hasFiles=e=>e.dataTransfer&&[...(e.dataTransfer.types||[])].includes("Files");
addEventListener("dragenter",e=>{if(hasFiles(e)){dragN++;$("#drop").style.display="grid"}});
addEventListener("dragleave",()=>{dragN=Math.max(0,dragN-1);if(!dragN)$("#drop").style.display="none"});
addEventListener("dragover",e=>{if(hasFiles(e))e.preventDefault()});
addEventListener("drop",e=>{if(!hasFiles(e))return;e.preventDefault();dragN=0;$("#drop").style.display="none";if(e.dataTransfer.files.length)newScenes(e.dataTransfer.files)});
addEventListener("paste",e=>{const t=e.target;if(t&&/^(INPUT|TEXTAREA)$/.test(t.tagName))return;const fs=[...((e.clipboardData&&e.clipboardData.files)||[])].filter(isImg);if(fs.length){e.preventDefault();newScenes(fs.map(f=>new File([f],f.name&&f.name!=="image.png"?f.name:"Immagine incollata",{type:f.type})))}});

    if(!m||!m.t)return;
    if(m.t==="scene"){got=true;await pScene(m)}
    else if(m.t==="empty"){got=true;sc=null;iw=0;mapEl.removeAttribute("src");gridEl.style.display="none";fctx.clearRect(0,0,fogC.width,fogC.height);$("#empty").style.display="grid"}
    else if(m.t==="stage"){stageOn(m)}
    else if(m.t==="stageline"){typeLine(m.who,m.text)}
    else if(!sc&&m.t!=="ini"&&m.t!=="view")return;
    else if(m.t==="fog"){const bm=await createImageBitmap(m.b);fctx.save();fctx.globalCompositeOperation="source-over";fctx.clearRect(0,0,fw,fh);fctx.drawImage(bm,0,0,fw,fh);fctx.restore()}
    else if(m.t==="sb"){cur=m.s;applyStroke(fctx,cur,null)}
    else if(m.t==="sp"){if(cur){cur.pts.push(m.p);applyStroke(fctx,cur,cur.pts.length-1)}}
    else if(m.t==="op"){applyStroke(fctx,m.s)}
    else if(m.t==="grid"){sc.grid=m.g;applyGrid()}
    else if(m.t==="ini"){ini=m.ini;drawIni()}
    else if(m.t==="view"){pview=m;fit()}
    else if(m.t==="ptr"){if(m.off)ptrOff();else setPtr(m.x,m.y,m.ping)}
  };
  if(BC){BC.onmessage=ev=>{chain=chain.then(()=>pHandle(ev.data)).catch(()=>{})};
    const hello=()=>{if(got)return;try{BC.postMessage({t:"hello"})}catch(e){}};hello();setInterval(hello,1500)}
  const SIDES=[["l","sidel","Iniziative a sinistra"],["r","sider","Iniziative a destra"],["b","sideb","Iniziative su entrambi i lati"]];
  let side="r";try{const v=localStorage.getItem("tavolo-lato");if(v&&"lrb".includes(v))side=v}catch(e){}
  const mirror=()=>{if(side!=="b")return;const c=$("#ini").cloneNode(true);c.querySelectorAll("[id]").forEach(e=>e.removeAttribute("id"));$("#ini2").replaceChildren(...c.children)};
  {const _d=drawIni;drawIni=function(){_d();mirror()}}
  const setSide=v=>{side=v;try{localStorage.setItem("tavolo-lato",v)}catch(e){}
    document.body.classList.remove("side-l","side-r","side-b");document.body.classList.add("side-"+v);
    $("#sides").replaceChildren(...SIDES.map(([k,ic,t])=>{const b=h("button",{class:"btn",type:"button",title:t,"aria-label":t,"aria-pressed":String(k===v)},ico(ic));b.addEventListener("click",()=>setSide(k));return b}));
    drawIni();fit()};
  setSide(side);
  ini={list:[],turn:null,round:1};drawIni();
}else{
if(BC)BC.onmessage=ev=>{if(ev.data&&ev.data.t==="hello")syncAll()};
if(lsGet("tavolo-noini"))document.body.classList.add("noini");
(async()=>{
  drawBars();drawIni();$("#showui").title="Mostra i comandi (H)";
  try{const id=lsGet("tavolo-scene");if(id){const o=await dbGet(id);if(o)await openScene(o)}}catch(e){}
})();
}
addEventListener("beforeunload",()=>{try{saveNow()}catch(e){}});
</script>
</body>
